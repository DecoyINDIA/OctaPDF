# Production configuration for OctaPDF (OPS-01)

# Logging
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.eclipse.jetty=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.stirling.software.SPDF=INFO

# Security & Error Handling (SEC-03)
server.error.path=/error
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

# Secure Session Cookies
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Request & Size Limits (SEC-05)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=250MB
spring.mvc.async.request-timeout=300000
system.fileUploadLimit=100MB

# Rate Limiting (SEC-04)
security.rateLimit.requestsPerMinute=60
security.rateLimit.heavyRequestsPerMinute=10

# Search Engine Indexing
system.googlevisibility=true

# Endpoints & Metrics Lockdown (SEC-06)
metrics.enabled=false
endpoints.toRemove=pipeline,html-to-pdf,markdown-to-pdf,file-to-pdf,redact,auto-redact
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Disable DevTools in Production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Actuator Health endpoint only (OPS-05)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
