<footer th:fragment="footer" id="footer" class="text-center pt-5">
  
  <script type="module" th:src="@{'/js/thirdParty/cookieconsent-config.js'}"></script>
  <div class="footer-center pb-4">
    <!-- Links section -->
    <div class="d-flex justify-content-center">
      <ul class="list-unstyled footer-link-list">
        <li><a class="footer-link px-2" id="about" target="_blank" th:href="@{'/about'}" th:text="#{about.nav}">About</a></li>
        <li><a class="footer-link px-2" id="licenses" target="_blank" th:href="@{'/licenses'}" th:text="#{licenses.nav}">Licenses</a></li>
        <li><a class="footer-link px-2" id="support" href="mailto:support@octapdf.com">Support</a></li>
        <li><a class="footer-link px-2" id="status" target="_blank" th:href="@{'/actuator/health'}">Status</a></li>
        <li><a class="footer-link px-2" id="releases" target="_blank" th:href="@{'/releases'}" th:text="#{releases.footer}">Releases</a></li>
        <li th:if="${@privacyPolicy != null and @privacyPolicy != ''}"><a class="footer-link px-2" target="_blank" th:href="@{${@privacyPolicy}}" th:text="#{legal.privacy}">privacyPolicy</a></li>
        <li th:if="${@termsAndConditions != null and @termsAndConditions != ''}"><a class="footer-link px-2" target="_blank" th:href="@{${@termsAndConditions}}" th:text="#{legal.terms}">termsAndConditions</a></li>
        <li th:if="${@accessibilityStatement != null and @accessibilityStatement != ''}"><a class="footer-link px-2" target="_blank" th:href="@{${@accessibilityStatement}}" th:text="#{legal.accessibility}">accessibilityStatement</a></li>
        <li th:if="${@cookiePolicy != null and @cookiePolicy != ''}"><a class="footer-link px-2" target="_blank" th:href="@{${@cookiePolicy}}" th:text="#{legal.cookie}">cookiePolicy</a></li>
        <li th:if="${@impressum != null and @impressum != ''}"><a class="footer-link px-2" target="_blank" th:href="@{${@impressum}}" th:text="#{legal.impressum}">impressum</a></li>
        <li><a class="footer-link px-2" id="cookieBanner" target="_blank"  th:text="#{legal.showCookieBanner}" onClick="CookieConsent.show(true)">Cookie Preferences</a></li>
      </ul>
    </div>

    <!-- powered by section -->
    <div class="footer-powered-by">
      <span th:text="#{poweredBy}"></span>
      <a href="https://github.com/DecoyINDIA/OctaPDF" class="brand-link">XolverLabs</a>
    </div>
  </div>
</footer>
