<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OctaPDF Readme Studio Smoke Test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #faf7f2;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from '/scripts/readme-studio/vendor/three.module.js';

    const w = window.innerWidth || 960;
    const h = window.innerHeight || 540;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(w, h, false);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#FAF7F2');

    const camera = new THREE.PerspectiveCamera(34, w / h, 0.1, 50);
    camera.position.set(0, 2.2, 5.2);
    camera.lookAt(0, 0.25, 0);

    const hemi = new THREE.HemisphereLight('#FFFDF9', '#D6CEC4', 0.9);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight('#FFF6EB', 2.1);
    keyLight.position.set(3.2, 5.0, 3.6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 16;
    keyLight.shadow.camera.left = -3.5;
    keyLight.shadow.camera.right = 3.5;
    keyLight.shadow.camera.top = 3.5;
    keyLight.shadow.camera.bottom = -3.5;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const desk = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 12),
      new THREE.MeshStandardMaterial({ color: '#F3EEE6', roughness: 0.92, metalness: 0.0 })
    );
    desk.rotation.x = -Math.PI / 2;
    desk.position.y = -0.45;
    desk.receiveShadow = true;
    scene.add(desk);

    const paperGroup = new THREE.Group();
    const sheet = new THREE.Mesh(
      new THREE.BoxGeometry(1.7, 2.2, 0.03),
      new THREE.MeshStandardMaterial({ color: '#FFFFFF', roughness: 0.55, metalness: 0.02 })
    );
    sheet.castShadow = true;
    sheet.receiveShadow = true;
    paperGroup.add(sheet);

    const accentSeal = new THREE.Mesh(
      new THREE.CylinderGeometry(0.24, 0.24, 0.045, 8),
      new THREE.MeshStandardMaterial({ color: '#E8501C', roughness: 0.35, metalness: 0.08 })
    );
    accentSeal.rotation.x = Math.PI / 2;
    accentSeal.position.set(0.38, -0.55, 0.02);
    accentSeal.castShadow = true;
    paperGroup.add(accentSeal);

    paperGroup.position.y = 0.72;
    scene.add(paperGroup);

    window.renderFrame = function renderFrame(i, totalFrames, t) {
      const angle = t * Math.PI * 2;
      paperGroup.rotation.y = Math.sin(angle) * 0.42;
      paperGroup.rotation.x = -0.18 + Math.cos(angle) * 0.08;
      paperGroup.position.y = 0.72 + Math.sin(angle) * 0.1;
      renderer.render(scene, camera);
    };
  </script>
</body>
</html>
