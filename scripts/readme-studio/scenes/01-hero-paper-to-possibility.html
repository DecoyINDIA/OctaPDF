<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OctaPDF — From Paper to Possibility</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FAF7F2;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .swiss-lockup {
      position: absolute;
      left: 552px;
      top: 146px;
      width: 510px;
      pointer-events: none;
    }
    .swiss-kicker {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #6E645D;
      margin: 0 0 14px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .swiss-kicker-line {
      width: 20px;
      height: 1.5px;
      background: #E8501C;
      display: inline-block;
    }
    .wordmark-mask {
      overflow: hidden;
      margin: 0 0 18px 0;
    }
    .wordmark {
      font-size: 74px;
      font-weight: 700;
      line-height: 0.96;
      letter-spacing: -0.032em;
      margin: 0;
      will-change: transform, opacity;
    }
    .wordmark .octa { color: #241E1B; }
    .wordmark .pdf  { color: #E8501C; }

    .swiss-rule {
      height: 1.5px;
      width: 0px;
      background: linear-gradient(90deg, #FE9114 0%, #E8501C 65%, #D53902 100%);
      margin: 0 0 18px 0;
    }
    .tagline-mask {
      overflow: hidden;
      margin: 0 0 18px 0;
    }
    .tagline {
      font-family: 'OctaEditorialSerif', 'Georgia', serif;
      font-size: 22px;
      line-height: 1.38;
      color: #241E1B;
      letter-spacing: -0.005em;
      margin: 0;
    }
    .colophon {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6E645D;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <script type="module">
    import * as THREE from '/scripts/readme-studio/vendor/three.module.js';
    import {
      initStudio,
      createCottonPaperMaterial,
      createPdfPageTexture,
      createEditorialCaptionLayer,
      foldPlaneGeometry,
      clamp01,
      lerp,
      smoothstep,
      smootherstep,
      band,
      easeOutExpo,
      springDamped
    } from '/scripts/readme-studio/scenes/studio-kit.js';

    const DESIGN_W = 1120;
    const DESIGN_H = 540;
    const stage = document.getElementById('stage');

    const studio = initStudio(stage, {
      width: DESIGN_W,
      height: DESIGN_H,
      mode: 'light',
      fov: 31,
      camPos: [0, 2.05, 5.95],
      lookAt: [0, 0.34, 0],
      exposure: 1.05,
      floorY: -1.04,
      shadowOpacity: 0.23,
      fogDensity: 0.025
    });
    const { renderer, scene, camera, lights } = studio;
    lights.key.position.set(3.4, 5.6, 3.0);

    // Swiss Editorial Typography Layer (NO HTML rounded pill badges)
    const hud = createEditorialCaptionLayer(stage, {
      mode: 'light',
      designWidth: DESIGN_W,
      designHeight: DESIGN_H,
      kicker: 'PROJECT ORIGAMI  ·  LOCAL-FIRST PDF ARCHITECTURE',
      corners: true
    });

    const lockupEl = document.createElement('div');
    lockupEl.className = 'swiss-lockup';
    lockupEl.style.opacity = '0';
    lockupEl.innerHTML = `
      <div class="swiss-kicker"><span class="swiss-kicker-line"></span>PAPER DESK EDITION</div>
      <div class="wordmark-mask"><div class="wordmark" id="wordmark"><span class="octa">OCTA</span><span class="pdf">PDF</span></div></div>
      <div class="swiss-rule" id="swissRule"></div>
      <div class="tagline-mask"><p class="tagline" id="tagline">Local-first PDF craft. Precision paper architecture.</p></div>
      <p class="colophon" id="colophon">ZERO TELEMETRY &nbsp;&middot;&nbsp; SELF-HOSTED &nbsp;&middot;&nbsp; MIT OPEN SOURCE</p>
    `;
    hud.root.appendChild(lockupEl);

    const wordmarkEl = lockupEl.querySelector('#wordmark');
    const swissRuleEl = lockupEl.querySelector('#swissRule');
    const taglineEl = lockupEl.querySelector('#tagline');
    const colophonEl = lockupEl.querySelector('#colophon');

    // =========================================================================
    // 1. Opening Archival Cotton-Ivory Sheet (Scene 1 & 2, 60x80 subdivisions)
    // =========================================================================
    const mainSheetGroup = new THREE.Group();
    mainSheetGroup.position.set(0, 0.38, 0);
    scene.add(mainSheetGroup);

    const briefTex = createPdfPageTexture('brief', false);
    const mainFold = foldPlaneGeometry(1.92, 2.48, 60, 80);
    const mainFrontMat = createCottonPaperMaterial({
      color: '#FFFDF9',
      map: briefTex,
      vertexColors: true,
      roughness: 0.88,
      sheen: 0.45,
      bumpScale: 0.009,
      side: THREE.FrontSide,
      transparent: true,
      opacity: 1
    });
    const mainFrontMesh = new THREE.Mesh(mainFold.geometry, mainFrontMat);
    mainFrontMesh.castShadow = true;
    mainFrontMesh.receiveShadow = true;
    mainSheetGroup.add(mainFrontMesh);

    // Rich terracotta #E8501C underside lamina revealing during origami folds
    const mainBackMat = createCottonPaperMaterial({
      color: '#E8501C',
      vertexColors: true,
      roughness: 0.72,
      sheen: 0.35,
      sheenColor: '#FE9114',
      side: THREE.BackSide,
      transparent: true,
      opacity: 1
    });
    const mainBackMesh = new THREE.Mesh(mainFold.geometry, mainBackMat);
    mainBackMesh.castShadow = true;
    mainSheetGroup.add(mainBackMesh);

    // Fine terracotta score-line guides appearing right before fold
    const scoreMat = new THREE.LineBasicMaterial({ color: '#E8501C', transparent: true, opacity: 0 });
    const scoreGroup = new THREE.Group();
    [
      [[0, -1.24, 0.008], [0, 1.24, 0.008]],
      [[-0.96, -1.24, 0.008], [0.96, 1.24, 0.008]],
      [[0.96, -1.24, 0.008], [-0.96, 1.24, 0.008]]
    ].forEach(([a, b]) => {
      const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]);
      scoreGroup.add(new THREE.Line(g, scoreMat));
    });
    mainSheetGroup.add(scoreGroup);

    // =========================================================================
    // 2. Eight Layered Architectural Vellum & Cotton Paper Leaves (Scene 2-3)
    // =========================================================================
    const fanGroup = new THREE.Group();
    fanGroup.position.set(0, 0.36, 0);
    scene.add(fanGroup);

    const leafVariants = ['brief', 'architecture', 'contract', 'ledger'];
    const leafTextures = leafVariants.map((v) => createPdfPageTexture(v, false));

    const leaves = [];
    for (let i = 0; i < 8; i++) {
      const isTerracottaBack = i % 2 === 0;
      const leafFold = foldPlaneGeometry(1.12, 1.66, 40, 56);
      const frontMat = createCottonPaperMaterial({
        color: i % 3 === 0 ? '#FFFDF9' : '#FAF5EC',
        map: leafTextures[i % leafTextures.length],
        vertexColors: true,
        roughness: 0.85,
        sheen: 0.42,
        side: THREE.FrontSide,
        transparent: true,
        opacity: 0
      });
      const backMat = createCottonPaperMaterial({
        color: isTerracottaBack ? '#E8501C' : '#F3EAE0',
        vertexColors: true,
        roughness: 0.74,
        sheen: 0.35,
        sheenColor: isTerracottaBack ? '#FE9114' : '#FFF8EE',
        side: THREE.BackSide,
        transparent: true,
        opacity: 0
      });

      const pivot = new THREE.Group();
      const fMesh = new THREE.Mesh(leafFold.geometry, frontMat);
      const bMesh = new THREE.Mesh(leafFold.geometry, backMat);
      fMesh.castShadow = true;
      fMesh.receiveShadow = true;
      bMesh.castShadow = true;
      pivot.add(fMesh, bMesh);
      fanGroup.add(pivot);

      const angle = ((i - 3.5) / 3.5) * 1.24;
      leaves.push({
        pivot,
        fold: leafFold,
        frontMat,
        backMat,
        idx: i,
        fanAngle: angle,
        radius: 1.18 + (i % 2) * 0.18,
        zOffset: (i - 3.5) * 0.042
      });
    }

    // =========================================================================
    // 3. Embossed Cotton-Ivory Hero Tablet + GLSL SDF/Normal Emblem Emergence
    // =========================================================================
    const tabletGroup = new THREE.Group();
    tabletGroup.position.set(0, 0.36, -0.06);
    scene.add(tabletGroup);

    // Beveled octagonal heavy cardstock plinth
    const octShape = new THREE.Shape();
    const R = 1.38;
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2 + Math.PI / 8;
      const x = Math.cos(a) * R;
      const y = Math.sin(a) * R;
      if (k === 0) octShape.moveTo(x, y);
      else octShape.lineTo(x, y);
    }
    octShape.closePath();

    const tabletGeo = new THREE.ExtrudeGeometry(octShape, {
      depth: 0.08,
      bevelEnabled: true,
      bevelThickness: 0.025,
      bevelSize: 0.025,
      bevelSegments: 4
    });
    tabletGeo.center();

    const tabletMat = createCottonPaperMaterial({
      color: '#F5EFE6',
      roughness: 0.84,
      sheen: 0.45,
      bumpScale: 0.008,
      transparent: true,
      opacity: 0
    });
    const tabletMesh = new THREE.Mesh(tabletGeo, tabletMat);
    tabletMesh.castShadow = true;
    tabletMesh.receiveShadow = true;
    tabletGroup.add(tabletMesh);

    // Inner raised archival cotton face
    const faceMat = createCottonPaperMaterial({
      color: '#FFFDF9',
      roughness: 0.86,
      sheen: 0.5,
      bumpScale: 0.007,
      transparent: true,
      opacity: 0
    });
    const faceDisc = new THREE.Mesh(
      new THREE.CylinderGeometry(1.16, 1.18, 0.032, 72),
      faceMat
    );
    faceDisc.rotation.x = Math.PI / 2;
    faceDisc.position.z = 0.066;
    faceDisc.receiveShadow = true;
    tabletGroup.add(faceDisc);

    // Delicate debossed terracotta hairline circle
    const ringMat = new THREE.MeshBasicMaterial({
      color: '#E8501C',
      transparent: true,
      opacity: 0
    });
    const debossRing = new THREE.Mesh(new THREE.RingGeometry(1.06, 1.072, 96), ringMat);
    debossRing.position.z = 0.085;
    tabletGroup.add(debossRing);

    // Custom GLSL Shader sampling octapdf-emblem-sdf.png + octapdf-emblem-normal.png + octapdf-emblem-alpha.png
    let emblemShaderMat = null;
    let emblemMesh = null;

    function loadTex(url, srgb = false) {
      return new Promise((resolve, reject) => {
        new THREE.TextureLoader().load(
          url,
          (t) => {
            t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
            t.anisotropy = 8;
            resolve(t);
          },
          undefined,
          reject
        );
      });
    }

    window.sceneReady = Promise.all([
      loadTex('/scripts/readme-studio/assets/octapdf-emblem-alpha.png', true),
      loadTex('/scripts/readme-studio/assets/octapdf-emblem-sdf.png', false),
      loadTex('/scripts/readme-studio/assets/octapdf-emblem-normal.png', false)
    ]).then(([albedoTex, sdfTex, normalTex]) => {
      emblemShaderMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          uAlbedo: { value: albedoTex },
          uSdf: { value: sdfTex },
          uNormal: { value: normalTex },
          uEmboss: { value: 0.0 },
          uInkProgress: { value: 0.0 },
          uOpacity: { value: 0.0 },
          uSweepX: { value: -1.5 },
          uLightDir: { value: new THREE.Vector3(0.45, 0.65, 0.61).normalize() }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uAlbedo;
          uniform sampler2D uSdf;
          uniform sampler2D uNormal;
          uniform float uEmboss;
          uniform float uInkProgress;
          uniform float uOpacity;
          uniform float uSweepX;
          uniform vec3 uLightDir;
          varying vec2 vUv;

          void main() {
            vec4 albedo = texture2D(uAlbedo, vUv);
            vec3 sdfData = texture2D(uSdf, vUv).rgb;
            vec3 nMap = texture2D(uNormal, vUv).xyz * 2.0 - 1.0;

            float sdf = sdfData.r;       // 0.5 contour
            float flow = sdfData.g;      // 0.0 mantle -> 1.0 tips
            float relief = sdfData.b;    // blurred heightmap

            // Tangent-space normal embossed lighting
            vec3 N = normalize(mix(vec3(0.0, 0.0, 1.0), nMap, uEmboss * 1.15));
            float diff = max(dot(N, uLightDir), 0.0);
            vec3 H = normalize(uLightDir + vec3(0.0, 0.0, 1.0));
            float spec = pow(max(dot(N, H), 0.0), 26.0);

            // Blind-debossed paper relief shade before ink arrives
            float paperMask = smoothstep(0.46, 0.53, sdf) * uEmboss;
            vec3 blindPaper = vec3(1.0, 0.992, 0.976) * (0.88 + 0.16 * diff) + vec3(0.06, 0.04, 0.02) * spec;

            // Geodesic ribbon flow wave sweeping from mantle outward to tentacle tips
            float flowFront = uInkProgress * 1.28 - 0.12;
            float inkWave = smoothstep(flowFront + 0.06, flowFront - 0.12, flow);
            float sdfCrisp = smoothstep(0.485, 0.515, sdf);
            float inkMask = clamp(albedo.a * inkWave * sdfCrisp, 0.0, 1.0);

            // Studio specular sweep highlight across embossed brand colors (#FE9114 -> #F54702 -> #D53902)
            float xLocal = (vUv.x - 0.5) * 2.0;
            float sweepHighlight = exp(-pow((xLocal - uSweepX) * 2.4, 2.0)) * 0.24;
            vec3 inkCol = albedo.rgb * (0.86 + 0.24 * diff)
                        + vec3(0.996, 0.568, 0.078) * (spec * 0.28 + sweepHighlight * relief);

            // Combine blind paper emboss + geodesic ink emergence
            vec3 finalRgb = mix(blindPaper, inkCol, inkMask);
            float finalAlpha = max(paperMask * 0.55 * relief, albedo.a * max(inkMask, paperMask * 0.65)) * uOpacity;

            if (finalAlpha < 0.005) discard;
            gl_FragColor = vec4(finalRgb, finalAlpha);
          }
        `
      });

      emblemMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.78, 1.78), emblemShaderMat);
      emblemMesh.position.z = 0.088;
      tabletGroup.add(emblemMesh);
    });

    // =========================================================================
    // Deterministic 6-Phase Loop Choreography (t in [0, 1))
    // =========================================================================
    window.renderFrame = async function renderFrame(i, totalFrames, t) {
      const loopA = t * Math.PI * 2;
      const reverseEnd = band(t, 0.90, 0.995);

      // Scene 1-2: Single cotton-ivory archival sheet (0..0.33, returns 0.91..1.0)
      const sheetOut = band(t, 0.25, 0.34);
      const sheetIn  = band(t, 0.92, 0.992);
      const sheetVis = clamp01(1 - sheetOut + sheetIn);

      const foldStart = band(t, 0.15, 0.30);
      const foldAmt = clamp01(foldStart * (1 - sheetOut) + (1 - band(t, 0.92, 0.995)) * sheetIn * 0.45);
      const curlAmt = clamp01(band(t, 0.06, 0.24) * (1 - sheetOut));

      mainSheetGroup.visible = sheetVis > 0.005;
      mainFrontMat.opacity = sheetVis;
      mainBackMat.opacity = sheetVis;
      scoreMat.opacity = clamp01((band(t, 0.13, 0.19) - band(t, 0.25, 0.31)) * 0.65);

      mainFold.applyFold({
        fold: foldAmt,
        curl: curlAmt,
        diagFold: foldAmt * 0.85,
        wavePhase: loopA,
        waveAmp: sheetVis * 0.7,
        aoStrength: 0.28
      });

      mainSheetGroup.rotation.set(
        -0.32 + Math.sin(loopA) * 0.04 - foldAmt * 0.14,
        -0.18 + Math.cos(loopA) * 0.06 + foldAmt * 0.28,
        Math.sin(loopA * 2) * 0.025
      );
      mainSheetGroup.position.set(0, 0.38 + Math.sin(loopA) * 0.045, 0);
      mainSheetGroup.scale.setScalar(lerp(1.0, 0.86, foldAmt));

      // Scene 2-3: Eight layered curved architectural leaves (0.20..0.54, parting cleanly around tablet)
      const fanIn  = band(t, 0.20, 0.31);
      const fanOut = band(t, 0.45, 0.54);
      const fanVis = clamp01(fanIn - fanOut);
      const fanSpread = smootherstep(clamp01((t - 0.20) / 0.18)) * (1 - band(t, 0.43, 0.54));
      const fanShiftX = lerp(0, -1.52, band(t, 0.42, 0.56)) * (1 - reverseEnd);

      fanGroup.visible = fanVis > 0.005;
      fanGroup.position.set(fanShiftX, 0.36, -0.09);
      fanGroup.rotation.y = lerp(0.42, -0.14, band(t, 0.24, 0.50));

      if (fanGroup.visible) {
        leaves.forEach((lf) => {
          const phase = loopA + lf.idx * 0.42;
          lf.frontMat.opacity = fanVis * 0.95;
          lf.backMat.opacity = fanVis * 0.95;
          lf.fold.applyFold({
            fold: lerp(0.55, 0.16, band(t, 0.40, 0.54)),
            curl: 0.42 * fanSpread + 0.12,
            diagFold: 0.25,
            wavePhase: phase,
            waveAmp: 0.55,
            aoStrength: 0.24
          });
          const a = lf.fanAngle * lerp(0.20, 1.0, fanSpread);
          lf.pivot.position.set(
            Math.sin(a) * lf.radius * fanSpread,
            Math.cos(a) * 0.22 * fanSpread + Math.sin(phase) * 0.03,
            lf.zOffset * lerp(0.2, 1.0, fanSpread) - 0.06
          );
          lf.pivot.rotation.set(
            lerp(-0.22, 0.06, band(t, 0.40, 0.54)) + Math.sin(phase) * 0.04,
            a * 0.62,
            -a * 0.46
          );
          lf.pivot.scale.setScalar(lerp(0.84, 0.94, fanVis));
        });
      }

      // Scene 3-4: Embossed Hero Tablet + GLSL SDF/Normal Emblem Emergence (0.40..0.94)
      const tabIn  = springDamped(clamp01((t - 0.40) / 0.16));
      const tabOut = band(t, 0.89, 0.96);
      const tabVis = clamp01(band(t, 0.40, 0.50) - tabOut);
      const tabX = lerp(-0.28, -1.54, band(t, 0.46, 0.65)) * (1 - reverseEnd);

      tabletGroup.visible = tabVis > 0.005;
      tabletGroup.position.set(tabX, 0.35 + Math.sin(loopA) * 0.02, -0.02);
      tabletGroup.scale.setScalar(lerp(0.84, 0.94, tabIn) * lerp(1.0, 0.84, tabOut));
      tabletGroup.rotation.set(
        lerp(-0.18, -0.04, band(t, 0.44, 0.68)),
        lerp(0.24, 0.09, band(t, 0.44, 0.70)) - tabOut * 0.25,
        0
      );

      tabletMat.opacity = tabVis;
      faceMat.opacity = tabVis;
      ringMat.opacity = tabVis * 0.38;

      if (emblemShaderMat) {
        const embossAmt = band(t, 0.41, 0.52) * (1 - band(t, 0.89, 0.95));
        const inkProgress = smootherstep(clamp01((t - 0.46) / 0.22)) * (1 - band(t, 0.88, 0.94));
        const sweepX = lerp(-1.4, 1.4, clamp01((t - 0.58) / 0.18));

        emblemShaderMat.uniforms.uEmboss.value = embossAmt;
        emblemShaderMat.uniforms.uInkProgress.value = inkProgress;
        emblemShaderMat.uniforms.uOpacity.value = tabVis;
        emblemShaderMat.uniforms.uSweepX.value = sweepX;
      }

      // Camera Choreography (returns identically to t=0 at t=1)
      const camZoom = band(t, 0.24, 0.56) * (1 - band(t, 0.86, 0.99));
      const endBlend = band(t, 0.90, 1.0);
      const cx = lerp(0, 0.22, band(t, 0.22, 0.55)) * (1 - band(t, 0.60, 0.96));
      const cy = lerp(2.05, 1.18, band(t, 0.44, 0.70));
      const cz = lerp(5.95, 5.25, camZoom);

      camera.position.set(
        lerp(cx, 0, endBlend),
        lerp(cy, 2.05, endBlend),
        lerp(cz, 5.95, endBlend)
      );
      camera.lookAt(
        lerp(0, -0.08, band(t, 0.56, 0.74)) * (1 - endBlend),
        lerp(0.34, 0.32, camZoom) * (1 - endBlend) + 0.34 * endBlend,
        0
      );

      // Scene 5: Masked Swiss Editorial Typography Reveal (0.70..0.92)
      const typIn  = easeOutExpo((t - 0.70) / 0.10);
      const typOut = band(t, 0.89, 0.94);
      const typVis = clamp01(typIn - typOut);

      lockupEl.style.opacity = typVis.toFixed(4);
      wordmarkEl.style.transform = `translate3d(0, ${(1 - typIn) * 62}px, 0)`;
      swissRuleEl.style.width = `${Math.round(easeOutExpo((t - 0.72) / 0.10) * (1 - typOut) * 76)}px`;

      const tagIn = easeOutExpo((t - 0.74) / 0.10) * (1 - typOut);
      taglineEl.style.opacity = tagIn.toFixed(4);
      taglineEl.style.transform = `translate3d(0, ${(1 - tagIn) * 22}px, 0)`;

      const colIn = easeOutExpo((t - 0.77) / 0.10) * (1 - typOut);
      colophonEl.style.opacity = colIn.toFixed(4);

      // Quiet unboxed Swiss bottom-left phase caption
      let idx = '01';
      let lbl = 'ARCHIVAL COTTON FOLIO';
      if (t >= 0.18 && t < 0.45) {
        idx = '02'; lbl = 'ORIGAMI SCORE & VELLUM FAN';
      } else if (t >= 0.45 && t < 0.74) {
        idx = '03'; lbl = 'GEODESIC INK & EMBOSSED RELIEF';
      } else if (t >= 0.74 && t < 0.90) {
        idx = '04'; lbl = 'OCTAPDF · PAPER ARCHITECTURE';
      } else if (t >= 0.90) {
        idx = '05'; lbl = 'RETURN TO BLANK SHEET';
      }
      hud.setCaption(idx, lbl, 0.76);

      renderer.render(scene, camera);
    };
  </script>
</body>
</html>
