<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OctaPDF — Freedom by Design</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141210;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #141210;
    }
    .swiss-title-block {
      position: absolute;
      top: 52px;
      left: 42px;
    }
    .swiss-title {
      font-family: 'OctaEditorialSerif', Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: #F5EFE6;
      line-height: 1.1;
    }
    .swiss-sub {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 400;
      color: #A89E94;
    }
    .perimeter-anno {
      position: absolute;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(245, 239, 230, 0.16);
      transform: translateY(-50%);
      white-space: nowrap;
    }
    .perimeter-anno.left {
      left: 42px;
      width: 192px;
    }
    .perimeter-anno.right {
      right: 42px;
      width: 192px;
      text-align: right;
    }
    .perimeter-anno .k {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      color: #FF6B35;
      letter-spacing: 0.02em;
    }
    .perimeter-anno .d {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #A89E94;
    }
    svg.swiss-leaders {
      position: absolute;
      inset: 0;
      width: 1120px;
      height: 500px;
      pointer-events: none;
    }
    .swiss-footer-right {
      position: absolute;
      right: 42px;
      bottom: 30px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #A89E94;
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <script type="module">
    import * as THREE from '/scripts/readme-studio/vendor/three.module.js';
    import {
      initStudio,
      createCottonPaperMaterial,
      createPdfPageTexture,
      createEditorialCaptionLayer,
      foldPlaneGeometry
    } from '/scripts/readme-studio/scenes/studio-kit.js';

    const W = 1120;
    const H = 500;
    const stage = document.getElementById('stage');

    const { renderer, scene, camera, lights } = initStudio(stage, {
      width: W,
      height: H,
      mode: 'dark',
      fov: 31,
      camPos: [0, 5.25, 7.35],
      lookAt: [0, 0.12, 0.05],
      floorY: -0.45,
      fogDensity: 0.036,
      shadowFrustum: 5.2,
      shadowOpacity: 0.45
    });
    lights.key.position.set(4.2, 8.0, 4.2);

    const hud = createEditorialCaptionLayer(stage, {
      mode: 'dark',
      designWidth: W,
      designHeight: H,
      kicker: 'AIR-GAPPED SANCTUARY · LOCAL CUSTODY',
      corners: true
    });
    hud.setCaption('10', 'Zero Telemetry · Local Processing · MIT Open Source', 0.85);

    const titleBlock = document.createElement('div');
    titleBlock.className = 'swiss-title-block';
    titleBlock.innerHTML = `
      <div class="swiss-title">Freedom by Design</div>
      <div class="swiss-sub">Warm ivory PDFs circulate inside a sealed obsidian-vellum sanctuary</div>
    `;
    hud.root.appendChild(titleBlock);

    const footerRight = document.createElement('div');
    footerRight.className = 'swiss-footer-right';
    footerRight.textContent = 'ZERO OUTBOUND EGRESS';
    hud.root.appendChild(footerRight);

    const leadersSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    leadersSvg.setAttribute('class', 'swiss-leaders');
    leadersSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    hud.root.appendChild(leadersSvg);

    // Subtle concentric studio floor datum lines
    const datumMat = new THREE.MeshBasicMaterial({ color: '#342D27', transparent: true, opacity: 0.72 });
    for (const r of [1.15, 2.05, 2.75, 3.65]) {
      const ring = new THREE.Mesh(new THREE.RingGeometry(r - 0.008, r + 0.008, 128), datumMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = -0.445;
      scene.add(ring);
    }

    const sanctuary = new THREE.Group();
    scene.add(sanctuary);

    // Warm backlit hearth glow inside the sanctuary
    const hearthLight = new THREE.PointLight('#FF7A45', 2.4, 5.2, 1.5);
    hearthLight.position.set(0, 0.75, 0);
    scene.add(hearthLight);

    // Ultra-thin brushed-graphite & terracotta concentric horizon rings
    const graphiteRingMat = new THREE.MeshPhysicalMaterial({
      color: '#3E362F',
      roughness: 0.34,
      metalness: 0.42,
      clearcoat: 0.35
    });
    const terracottaGlowMat = new THREE.MeshPhysicalMaterial({
      color: '#E8501C',
      emissive: '#FF6B35',
      emissiveIntensity: 0.55,
      roughness: 0.28,
      clearcoat: 0.4
    });

    const outerHorizon = new THREE.Mesh(new THREE.TorusGeometry(2.74, 0.014, 16, 128), graphiteRingMat);
    outerHorizon.rotation.x = Math.PI / 2;
    outerHorizon.position.y = -0.02;
    sanctuary.add(outerHorizon);

    const innerHorizon = new THREE.Mesh(new THREE.TorusGeometry(1.94, 0.012, 16, 128), terracottaGlowMat);
    innerHorizon.rotation.x = Math.PI / 2;
    innerHorizon.position.y = -0.08;
    sanctuary.add(innerHorizon);

    // 12 finely pleated dark origami baffle fins enclosing the perimeter
    const baffleMat = createCottonPaperMaterial({
      color: '#2A241F',
      roughness: 0.72,
      sheen: 0.35,
      sheenColor: '#FF6B35',
      side: THREE.DoubleSide
    });

    const baffleRing = new THREE.Group();
    sanctuary.add(baffleRing);

    function makePleatedBaffle() {
      const geo = new THREE.BufferGeometry();
      // Sleek V-folded vertical architectural louver fin
      const verts = new Float32Array([
        -0.28, -0.22,  0.07,
         0.00, -0.22, -0.07,
         0.28, -0.22,  0.07,
        -0.22,  0.34,  0.05,
         0.00,  0.38, -0.09,
         0.22,  0.34,  0.05
      ]);
      const idx = [
        0, 1, 4,  0, 4, 3,
        1, 2, 5,  1, 5, 4
      ];
      geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, baffleMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      const baffle = makePleatedBaffle();
      baffle.position.set(Math.cos(a) * 2.48, -0.14, Math.sin(a) * 2.48);
      baffle.rotation.y = -a + Math.PI / 2;
      baffleRing.add(baffle);
    }

    // Central low brushed-stone plinth + soft terracotta focal octahedron
    const hearthPedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(0.46, 0.56, 0.12, 16),
      graphiteRingMat
    );
    hearthPedestal.position.y = -0.34;
    hearthPedestal.castShadow = true;
    hearthPedestal.receiveShadow = true;
    sanctuary.add(hearthPedestal);

    const hearthGem = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.18, 0),
      terracottaGlowMat
    );
    hearthGem.position.y = 0.02;
    sanctuary.add(hearthGem);

    // 5 authentic backlit warm-ivory PDF sheets drifting in calm laminar orbits
    const pageVariants = ['brief', 'contract', 'architecture', 'ledger', 'brief'];
    const docs = pageVariants.map((variant, idx) => {
      const tex = createPdfPageTexture(variant, false);
      const sheetMat = createCottonPaperMaterial({
        map: tex,
        roughness: 0.82,
        sheen: 0.45,
        emissive: '#FFF3E0',
        emissiveIntensity: 0.08,
        vertexColors: true
      });
      const fold = foldPlaneGeometry(0.42, 0.54, 14, 18);
      fold.applyFold({ fold: 0.08, curl: 0.22, diagFold: 0, waveAmp: 0 });
      const mesh = new THREE.Mesh(fold.geometry, sheetMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.castShadow = true;
      sanctuary.add(mesh);
      return { mesh, fold, phase: (idx / pageVariants.length) * Math.PI * 2 };
    });

    // External hairline probe filaments that softly dissolve into faint dust motes at outer perimeter
    const PROBE_COUNT = 10;
    const probes = [];
    for (let k = 0; k < PROBE_COUNT; k++) {
      const az = (k / PROBE_COUNT) * Math.PI * 2 + 0.18;
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, -0.32),
        new THREE.Vector3(0, 0, 0.32)
      ]);
      const lineMat = new THREE.LineBasicMaterial({
        color: '#9C9084',
        transparent: true,
        opacity: 0.55
      });
      const filament = new THREE.Line(lineGeo, lineMat);
      scene.add(filament);

      const moteGroup = new THREE.Group();
      const motes = [];
      for (let m = 0; m < 5; m++) {
        const moteMat = new THREE.MeshBasicMaterial({
          color: m % 2 === 0 ? '#FF6B35' : '#A89E94',
          transparent: true,
          opacity: 0
        });
        const mote = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 8), moteMat);
        moteGroup.add(mote);
        motes.push({ mesh: mote, mat: moteMat, angleOffset: (m - 2) * 0.26, speed: 0.45 + m * 0.12 });
      }
      scene.add(moteGroup);

      probes.push({ az, phase: (k * 0.31) % 1.0, filament, lineMat, moteGroup, motes });
    }

    const ANNOS = [
      { key: 'internal: true',     desc: 'Docker isolated bridge', side: 'left',  y: 170, world: new THREE.Vector3(-2.55, 0.05, -0.65) },
      { key: 'read_only: true',    desc: 'Immutable rootfs',       side: 'left',  y: 330, world: new THREE.Vector3(-2.45, 0.05,  0.85) },
      { key: "connect-src 'self'", desc: 'Strict CSP header',      side: 'right', y: 170, world: new THREE.Vector3( 2.55, 0.05, -0.65) },
      { key: 'zero telemetry',     desc: 'No remote phone-home',   side: 'right', y: 330, world: new THREE.Vector3( 2.45, 0.05,  0.85) }
    ];

    const annoBindings = ANNOS.map((a) => {
      const el = document.createElement('div');
      el.className = `perimeter-anno ${a.side}`;
      el.style.top = `${a.y}px`;
      el.innerHTML = `<span class="k">${a.key}</span><span class="d">${a.desc}</span>`;
      hud.root.appendChild(el);

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', 'rgba(255, 107, 53, 0.48)');
      line.setAttribute('stroke-width', '1');
      leadersSvg.appendChild(line);

      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('r', '2.5');
      dot.setAttribute('fill', '#FF6B35');
      leadersSvg.appendChild(dot);

      return { a, line, dot };
    });

    window.renderFrame = function renderFrame(i, totalFrames, t) {
      const loopAngle = t * Math.PI * 2;

      // 12-fold ring rotates 1/6 turn (60deg = 2/12 fins) -> mathematically seamless
      baffleRing.rotation.y = (loopAngle / 6);
      hearthGem.rotation.y = -loopAngle;
      hearthGem.position.y = 0.02 + Math.sin(loopAngle * 2) * 0.04;
      hearthLight.intensity = 2.25 + Math.sin(loopAngle * 2) * 0.3;

      docs.forEach((d, idx) => {
        const a = loopAngle + d.phase;
        const r = 1.24 + 0.22 * Math.sin(a * 2 + idx);
        d.mesh.position.set(
          Math.cos(a) * r,
          0.14 + Math.sin(a * 2) * 0.08,
          Math.sin(a) * r
        );
        d.mesh.rotation.z = a - Math.PI / 2;
        d.fold.applyFold({
          fold: 0.06,
          curl: 0.16 + 0.08 * Math.sin(a * 2),
          wavePhase: a * 2,
          waveAmp: 0.5
        });
      });

      probes.forEach((p) => {
        const u = (t * 2 + p.phase) % 1.0;
        const dx = Math.cos(p.az);
        const dz = Math.sin(p.az);
        const impactR = 2.78;
        const startR = 4.65;

        if (u < 0.55) {
          const s = u / 0.55;
          const r = THREE.MathUtils.lerp(startR, impactR, s);
          p.filament.position.set(dx * r, 0.04, dz * r);
          p.filament.lookAt(0, 0.04, 0);
          p.lineMat.opacity = Math.sin(s * Math.PI) * 0.65;
          p.filament.visible = true;
          p.motes.forEach((m) => { m.mat.opacity = 0; });
        } else {
          const s = (u - 0.55) / 0.45;
          p.filament.visible = false;
          p.moteGroup.position.set(dx * impactR, 0.04, dz * impactR);
          p.moteGroup.rotation.y = -p.az;
          p.motes.forEach((m, idx) => {
            const spread = s * m.speed;
            m.mesh.position.set(
              spread * 0.45,
              Math.sin(s * Math.PI) * 0.14 + (idx - 2) * 0.02,
              Math.sin(m.angleOffset) * spread * 0.8
            );
            m.mat.opacity = Math.max(0, 0.72 * (1 - s));
          });
        }
      });

      renderer.render(scene, camera);

      for (const b of annoBindings) {
        const proj = b.a.world.clone().project(camera);
        const sx = (proj.x * 0.5 + 0.5) * W;
        const sy = (-proj.y * 0.5 + 0.5) * H;
        const anchorX = b.a.side === 'left' ? 234 : W - 234;
        const elbowX = b.a.side === 'left' ? 270 : W - 270;
        b.line.setAttribute('points', `${sx.toFixed(1)},${sy.toFixed(1)} ${elbowX},${b.a.y} ${anchorX},${b.a.y}`);
        b.dot.setAttribute('cx', sx.toFixed(1));
        b.dot.setAttribute('cy', sy.toFixed(1));
      }
    };

    window.renderFrame(0, 192, 0);
  </script>
</body>
</html>
