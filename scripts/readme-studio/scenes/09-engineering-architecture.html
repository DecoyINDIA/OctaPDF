<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OctaPDF — Engineering Beneath the Paper</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FAF7F2;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #FAF7F2;
    }
    .swiss-title-block {
      position: absolute;
      top: 52px;
      left: 42px;
    }
    .swiss-title {
      font-family: 'OctaEditorialSerif', Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: #241E1B;
      line-height: 1.1;
    }
    .swiss-sub {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 400;
      color: #6E645D;
    }
    .layer-spec {
      position: absolute;
      right: 42px;
      width: 454px;
      padding-top: 9px;
      border-top: 1px solid rgba(36, 30, 27, 0.18);
      transform: translateY(-50%);
    }
    .layer-spec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .layer-spec-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #241E1B;
    }
    .layer-spec-idx {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #E8501C;
    }
    .layer-spec-tech {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1.5;
      color: #6E645D;
    }
    .layer-spec-tech strong {
      color: #241E1B;
      font-weight: 700;
    }
    svg.swiss-leaders {
      position: absolute;
      inset: 0;
      width: 1120px;
      height: 580px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <script type="module">
    import * as THREE from '/scripts/readme-studio/vendor/three.module.js';
    import {
      initStudio,
      createCottonPaperMaterial,
      createPdfPageTexture,
      createEditorialCaptionLayer
    } from '/scripts/readme-studio/scenes/studio-kit.js';

    const W = 1120;
    const H = 580;
    const stage = document.getElementById('stage');

    // Telephoto isometric-style camera with full PMREM softbox reflections
    const { renderer, scene, camera, lights } = initStudio(stage, {
      width: W,
      height: H,
      mode: 'light',
      fov: 21,
      camPos: [9.8, 7.3, 10.8],
      lookAt: [1.45, -0.22, -0.55],
      floorY: -2.48,
      fogDensity: 0.012,
      shadowFrustum: 5.5,
      shadowOpacity: 0.16
    });
    lights.key.position.set(5.8, 7.8, 4.2);
    lights.key.intensity = 1.65;
    lights.hemi.intensity = 0.62;
    lights.fill.intensity = 0.36;

    const hud = createEditorialCaptionLayer(stage, {
      mode: 'light',
      designWidth: W,
      designHeight: H,
      kicker: 'VERIFIED STACK · LOCAL EXECUTION PERIMETER',
      corners: true
    });
    hud.setCaption('09', 'Local Host Boundary · Zero External Egress', 0.85);

    const titleBlock = document.createElement('div');
    titleBlock.className = 'swiss-title-block';
    titleBlock.innerHTML = `
      <div class="swiss-title">Engineering Beneath the Paper</div>
      <div class="swiss-sub">Four-tier frosted vellum &amp; brushed cotton architecture</div>
    `;
    hud.root.appendChild(titleBlock);

    const leadersSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    leadersSvg.setAttribute('class', 'swiss-leaders');
    leadersSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    hud.root.appendChild(leadersSvg);

    // Subtle hairline architectural grid on floor plane
    const gridHelper = new THREE.GridHelper(4.8, 12, '#DCD1C3', '#EAE2D7');
    gridHelper.position.y = -2.415;
    scene.add(gridHelper);

    // Materials — Stripe / Teenage Engineering frosted vellum + brushed cotton + anodized graphite
    const cottonMat = createCottonPaperMaterial({ color: '#F3ECE1', roughness: 0.86, sheen: 0.35, envMapIntensity: 0.30 });
    const stoneMat = createCottonPaperMaterial({ color: '#E4D9C9', roughness: 0.74, sheen: 0.25, envMapIntensity: 0.30 });
    const baseStoneMat = createCottonPaperMaterial({ color: '#D7CBB9', roughness: 0.78, sheen: 0.20, envMapIntensity: 0.28 });
    const frostedVellumMat = new THREE.MeshPhysicalMaterial({
      color: '#EAE1D4',
      roughness: 0.28,
      metalness: 0.0,
      transmission: 0.18,
      thickness: 0.18,
      ior: 1.44,
      clearcoat: 0.45,
      clearcoatRoughness: 0.22,
      envMapIntensity: 0.40,
      transparent: true,
      opacity: 0.90
    });
    const graphitePlateMat = new THREE.MeshPhysicalMaterial({
      color: '#241E1B',
      roughness: 0.38,
      metalness: 0.18,
      clearcoat: 0.3,
      clearcoatRoughness: 0.28
    });
    const terracottaAccentMat = new THREE.MeshPhysicalMaterial({
      color: '#E8501C',
      roughness: 0.32,
      metalness: 0.06,
      clearcoat: 0.45
    });

    function makeBeveledPlate(w, d, h, r, mat, edgeColor = '#D5C9BA') {
      const shape = new THREE.Shape();
      const hw = w / 2, hd = d / 2;
      shape.moveTo(-hw + r, -hd);
      shape.lineTo(hw - r, -hd);
      shape.quadraticCurveTo(hw, -hd, hw, -hd + r);
      shape.lineTo(hw, hd - r);
      shape.quadraticCurveTo(hw, hd, hw - r, hd);
      shape.lineTo(-hw + r, hd);
      shape.quadraticCurveTo(-hw, hd, -hw, hd - r);
      shape.lineTo(-hw, -hd + r);
      shape.quadraticCurveTo(-hw, -hd, -hw + r, -hd);

      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: h,
        bevelEnabled: true,
        bevelThickness: 0.012,
        bevelSize: 0.012,
        bevelSegments: 3,
        curveSegments: 10
      });
      geo.rotateX(-Math.PI / 2);

      const g = new THREE.Group();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      g.add(mesh);

      const rim = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo, 28),
        new THREE.LineBasicMaterial({ color: edgeColor, transparent: true, opacity: 0.42 })
      );
      g.add(rim);
      return g;
    }

    const stackRoot = new THREE.Group();
    stackRoot.position.y = -0.30;
    scene.add(stackRoot);

    // 4 ultra-thin vertical optical corner alignment threads
    const threadGeo = new THREE.CylinderGeometry(0.005, 0.005, 4.15, 8);
    const threadMat = new THREE.MeshBasicMaterial({ color: '#9D9287', transparent: true, opacity: 0.48 });
    for (const [tx, tz] of [[-1.42, -1.42], [1.42, -1.42], [-1.42, 1.42], [1.42, 1.42]]) {
      const th = new THREE.Mesh(threadGeo, threadMat);
      th.position.set(tx, -0.02, tz);
      stackRoot.add(th);
    }

    // Layer 01 (Top): Client Workspace — Paper Desk UI with genuine crisp PDF page sheet
    const layer1 = new THREE.Group();
    layer1.baseY = 1.62;
    layer1.add(makeBeveledPlate(2.96, 2.96, 0.06, 0.14, frostedVellumMat, '#B6A999'));
    const briefTex = createPdfPageTexture('brief', false);
    const uiPageMat = createCottonPaperMaterial({ map: briefTex, color: '#F7F1E8', roughness: 0.88, sheen: 0.25, envMapIntensity: 0.24 });
    const uiPage = new THREE.Mesh(new THREE.BoxGeometry(1.18, 0.022, 1.52), uiPageMat);
    uiPage.position.set(-0.36, 0.095, 0.18);
    uiPage.rotation.y = 0.06;
    uiPage.castShadow = true;
    layer1.add(uiPage);

    const uiRail = makeBeveledPlate(0.68, 1.85, 0.028, 0.06, stoneMat, '#B6A999');
    uiRail.position.set(0.84, 0.075, 0.14);
    const uiTagPin = makeBeveledPlate(0.36, 0.08, 0.024, 0.02, terracottaAccentMat, '#E8501C');
    uiTagPin.position.set(-0.36, 0.115, -0.44);
    layer1.add(uiRail, uiTagPin);
    stackRoot.add(layer1);

    // Layer 02: Web & Security Perimeter — Spring Boot 3.4.5 + Jetty
    const layer2 = new THREE.Group();
    layer2.baseY = 0.54;
    layer2.add(makeBeveledPlate(2.96, 2.96, 0.06, 0.14, stoneMat, '#B6A999'));
    const secInner = makeBeveledPlate(2.16, 2.16, 0.032, 0.10, cottonMat, '#C4B7A8');
    secInner.position.y = 0.07;
    layer2.add(secInner);
    for (const [px, pz, isTerra] of [[-1.08, -1.08, true], [1.08, -1.08, false], [-1.08, 1.08, false], [1.08, 1.08, true]]) {
      const bastion = makeBeveledPlate(0.24, 0.24, 0.09, 0.04, isTerra ? terracottaAccentMat : graphitePlateMat, isTerra ? '#E8501C' : '#554B43');
      bastion.position.set(px, 0.075, pz);
      layer2.add(bastion);
    }
    stackRoot.add(layer2);

    // Layer 03: JVM Document Core — PDFBox, BouncyCastle, Tabula, TwelveMonkeys, ZXing
    const layer3 = new THREE.Group();
    layer3.baseY = -0.56;
    layer3.add(makeBeveledPlate(2.96, 2.96, 0.07, 0.14, graphitePlateMat, '#4A4139'));
    const jvmChips = [
      { x: -0.70, z: -0.52, w: 1.02, d: 0.86, terra: true },
      { x:  0.60, z: -0.52, w: 1.02, d: 0.86, terra: false },
      { x: -0.80, z:  0.58, w: 0.78, d: 0.82, terra: false },
      { x:  0.04, z:  0.58, w: 0.66, d: 0.82, terra: false },
      { x:  0.86, z:  0.58, w: 0.66, d: 0.82, terra: true }
    ];
    for (const c of jvmChips) {
      const chip = makeBeveledPlate(c.w, c.d, 0.055, 0.06, c.terra ? terracottaAccentMat : cottonMat, c.terra ? '#FF8554' : '#D5C9BA');
      chip.position.set(c.x, 0.085, c.z);
      layer3.add(chip);
    }
    stackRoot.add(layer3);

    // Layer 04 (Bottom): Local Native Engines — qpdf, Tesseract OCR, LibreOffice, Poppler, weasyprint_safe.py
    const layer4 = new THREE.Group();
    layer4.baseY = -1.68;
    layer4.add(makeBeveledPlate(3.08, 3.08, 0.08, 0.14, baseStoneMat, '#A89B8C'));
    for (let k = 0; k < 5; k++) {
      const x = -0.94 + k * 0.47;
      const fin = makeBeveledPlate(0.28, 1.98, 0.11, 0.04, k % 2 === 0 ? cottonMat : graphitePlateMat, k === 1 ? '#E8501C' : '#CFC3B4');
      fin.position.set(x, 0.095, 0);
      layer4.add(fin);
      if (k === 1 || k === 3) {
        const cap = makeBeveledPlate(0.28, 1.98, 0.018, 0.03, terracottaAccentMat, '#E8501C');
        cap.position.set(x, 0.22, 0);
        layer4.add(cap);
      }
    }
    stackRoot.add(layer4);

    // Vertical optical guide threads carrying gentle glowing #E8501C data pulses
    const conduitDefs = [
      { x: -0.44, z: -0.28, phase: 0.0 },
      { x:  0.52, z:  0.34, phase: 0.33 },
      { x:  0.04, z: -0.76, phase: 0.66 }
    ];
    const conduits = conduitDefs.map((c) => {
      const wire = new THREE.Mesh(
        new THREE.CylinderGeometry(0.006, 0.006, 3.5, 8),
        new THREE.MeshBasicMaterial({ color: '#E8501C', transparent: true, opacity: 0.45 })
      );
      wire.position.set(c.x, 0.0, c.z);
      stackRoot.add(wire);

      const bead = new THREE.Mesh(
        new THREE.SphereGeometry(0.055, 16, 16),
        new THREE.MeshBasicMaterial({ color: '#FF6B35' })
      );
      bead.position.set(c.x, 0, c.z);
      stackRoot.add(bead);

      const halo = new THREE.Mesh(
        new THREE.RingGeometry(0.075, 0.10, 24),
        new THREE.MeshBasicMaterial({ color: '#E8501C', side: THREE.DoubleSide, transparent: true, opacity: 0.6 })
      );
      halo.rotation.x = Math.PI / 2;
      stackRoot.add(halo);

      return { ...c, bead, halo };
    });

    const SPECS = [
      {
        layer: layer1,
        anchorLocal: new THREE.Vector3(1.48, 0.03, -0.35),
        y: 132,
        idx: 'Layer 01 · Client',
        name: 'Paper Desk UI Workspace',
        tech: '<strong>Bootstrap 5</strong> · <strong>PDF.js</strong> · <strong>pdf-lib</strong> · <strong>signature_pad</strong>'
      },
      {
        layer: layer2,
        anchorLocal: new THREE.Vector3(1.48, 0.03, -0.35),
        y: 250,
        idx: 'Layer 02 · Security',
        name: 'Spring Boot 3.4.5 + Jetty Perimeter',
        tech: '<strong>SecurityHeadersFilter</strong> (CSP \'self\') · <strong>IPRateLimitingFilter</strong><br><strong>EnterpriseEndpointFilter</strong> · <strong>TempFileJanitorService</strong>'
      },
      {
        layer: layer3,
        anchorLocal: new THREE.Vector3(1.48, 0.03, -0.35),
        y: 368,
        idx: 'Layer 03 · JVM Core',
        name: 'JVM Document Engine Core',
        tech: '<strong>Apache PDFBox 3.0.5</strong> · <strong>BouncyCastle 1.80</strong> · <strong>Tabula 1.0.5</strong><br><strong>TwelveMonkeys ImageIO</strong> · <strong>ZXing</strong>'
      },
      {
        layer: layer4,
        anchorLocal: new THREE.Vector3(1.54, 0.04, -0.35),
        y: 486,
        idx: 'Layer 04 · Native Host',
        name: 'Local Native Engines',
        tech: '<strong>qpdf</strong> · <strong>Tesseract OCR</strong> (13 langs) · <strong>LibreOffice / unoserver</strong><br><strong>Poppler pdftohtml</strong> · <strong>weasyprint_safe.py</strong> (SSRF-guarded)'
      }
    ];

    const bindings = SPECS.map((spec) => {
      const el = document.createElement('div');
      el.className = 'layer-spec';
      el.style.top = `${spec.y}px`;
      el.innerHTML = `
        <div class="layer-spec-head">
          <span class="layer-spec-name">${spec.name}</span>
          <span class="layer-spec-idx">${spec.idx}</span>
        </div>
        <div class="layer-spec-tech">${spec.tech}</div>
      `;
      hud.root.appendChild(el);

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', 'rgba(36, 30, 27, 0.34)');
      line.setAttribute('stroke-width', '1');
      leadersSvg.appendChild(line);

      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('r', '2.8');
      dot.setAttribute('fill', '#E8501C');
      leadersSvg.appendChild(dot);

      return { spec, line, dot };
    });

    const layers = [layer1, layer2, layer3, layer4];

    window.renderFrame = function renderFrame(i, totalFrames, t) {
      const loopAngle = t * Math.PI * 2;
      const explode = Math.sin(loopAngle) * 0.10;
      const mults = [1.5, 0.5, -0.5, -1.5];

      layers.forEach((lyr, idx) => {
        lyr.position.y = lyr.baseY + mults[idx] * explode + Math.sin(loopAngle + idx * 0.6) * 0.025;
      });

      stackRoot.rotation.y = Math.sin(loopAngle) * 0.032;

      conduits.forEach((c) => {
        const u = (t + c.phase) % 1.0;
        const yPos = Math.cos(u * Math.PI * 2) * 1.66;
        c.bead.position.y = yPos;
        c.bead.scale.setScalar(0.9 + 0.22 * Math.sin(u * Math.PI * 4));
        c.halo.position.set(c.x, yPos, c.z);
        const pulse = (u * 2) % 1;
        c.halo.scale.setScalar(0.75 + pulse * 0.85);
        c.halo.material.opacity = 0.65 * (1 - pulse);
      });

      renderer.render(scene, camera);

      const cardLeftX = W - 42 - 454;
      for (const b of bindings) {
        const worldPt = b.spec.anchorLocal.clone().applyMatrix4(b.spec.layer.matrixWorld);
        const proj = worldPt.project(camera);
        const sx = (proj.x * 0.5 + 0.5) * W;
        const sy = (-proj.y * 0.5 + 0.5) * H;
        const elbowX = cardLeftX - 30;
        b.line.setAttribute('points', `${sx.toFixed(1)},${sy.toFixed(1)} ${elbowX.toFixed(1)},${b.spec.y} ${cardLeftX},${b.spec.y}`);
        b.dot.setAttribute('cx', sx.toFixed(1));
        b.dot.setAttribute('cy', sy.toFixed(1));
      }
    };

    window.renderFrame(0, 216, 0);
  </script>
</body>
</html>
