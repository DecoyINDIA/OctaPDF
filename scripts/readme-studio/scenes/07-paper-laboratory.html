<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OctaPDF — Paper Laboratory (Level 4)</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FAF7F2;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .spec-header-right {
      position: absolute;
      top: 28px;
      right: 42px;
      font-family: ui-monospace, 'Consolas', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6E645D;
      pointer-events: none;
    }
    .tray-label {
      position: absolute;
      transform: translate(-50%, 0);
      width: 280px;
      padding-top: 6px;
      border-top: 1px solid rgba(36, 30, 27, 0.16);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: 'OctaEditorialSans', 'Segoe UI', system-ui, sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #241E1B;
      pointer-events: none;
      white-space: nowrap;
    }
    .tray-label .idx {
      color: #E8501C;
      margin-right: 7px;
      font-family: ui-monospace, 'Consolas', monospace;
    }
    .tray-label .sub {
      color: #6E645D;
      font-weight: 400;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      font-family: ui-monospace, 'Consolas', monospace;
    }
  </style>
</head>
<body>
  <div class="spec-header-right">06 SPECIMENS · PDFBOX · QPDF · TESSERACT · LIBREOFFICE</div>

  <div class="tray-label" id="lbl-0"><span><span class="idx">01</span>MERGE</span><span class="sub">BOUND FOLIOS</span></div>
  <div class="tray-label" id="lbl-1"><span><span class="idx">02</span>SPLIT</span><span class="sub">HAIRLINE CREASE</span></div>
  <div class="tray-label" id="lbl-2"><span><span class="idx">03</span>ROTATE &amp; CROP</span><span class="sub">90° BRACKETS</span></div>
  <div class="tray-label" id="lbl-3"><span><span class="idx">04</span>COMPRESS</span><span class="sub">VELLUM STACK</span></div>
  <div class="tray-label" id="lbl-4"><span><span class="idx">05</span>OCR</span><span class="sub">TESSERACT SCAN</span></div>
  <div class="tray-label" id="lbl-5"><span><span class="idx">06</span>CONVERT</span><span class="sub" id="convert-state">PDF → PDF/A</span></div>

  <script type="module">
    import * as THREE from '/scripts/readme-studio/vendor/three.module.js';
    import {
      initStudio,
      createCottonPaperMaterial,
      createPdfPageTexture,
      createEditorialCaptionLayer,
      foldPlaneGeometry,
      mulberry32,
      clamp01,
      lerp,
      smootherstep,
      easeInOutQuint
    } from '/scripts/readme-studio/scenes/studio-kit.js';

    const W = 1120;
    const H = 620;

    const studio = initStudio(null, {
      mode: 'light',
      width: W,
      height: H,
      fov: 24,
      camPos: [0, 0.18, 10.6],
      lookAt: [0, -0.02, 0],
      fogDensity: 0.004,
      cyclorama: false,
      exposure: 0.90
    });
    const { renderer, scene, camera } = studio;

    // Gentle overhead key tuning for clean gallery specimen shadows
    studio.lights.key.position.set(3.4, 5.4, 6.2);
    studio.lights.key.intensity = 2.1;
    studio.lights.hemi.intensity = 0.72;
    studio.lights.key.shadow.camera.left = -5.5;
    studio.lights.key.shadow.camera.right = 5.5;
    studio.lights.key.shadow.camera.top = 4.2;
    studio.lights.key.shadow.camera.bottom = -4.2;

    createEditorialCaptionLayer(document.body, {
      mode: 'light',
      designWidth: W,
      designHeight: H,
      kicker: 'OCTAPDF // PAPER LABORATORY'
    });

    const gallery = new THREE.Group();
    gallery.rotation.x = -0.14;
    gallery.position.y = 0.04;
    scene.add(gallery);

    // Subtle warm #FAF7F2 gallery wall receiving soft shadows
    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 11),
      createCottonPaperMaterial({ color: '#FAF7F2', roughness: 0.95, bumpScale: 0.002, sheen: 0.1 })
    );
    wall.position.z = -0.05;
    wall.receiveShadow = true;
    gallery.add(wall);

    // 2x3 Editorial Specimen Trays on recessed warm #F5EFE6 linen
    const colX = [-2.42, 0, 2.42];
    const rowY = [0.88, -0.82];
    const TRAY_W = 2.08;
    const TRAY_H = 1.36;

    const trays = [];
    const labelAnchors = [];

    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 3; c++) {
        const bay = new THREE.Group();
        bay.position.set(colX[c], rowY[r], 0);
        gallery.add(bay);

        // Warm recessed #F5EFE6 linen tray bed
        const linenTray = new THREE.Mesh(
          new THREE.PlaneGeometry(TRAY_W, TRAY_H),
          createCottonPaperMaterial({
            color: '#EFE7DA',
            roughness: 0.94,
            bumpScale: 0.007,
            sheen: 0.2
          })
        );
        linenTray.position.z = 0.002;
        linenTray.receiveShadow = true;
        bay.add(linenTray);

        // Recessed hairline border + inner miter corner marks (no thick black blocks)
        const hw = TRAY_W * 0.5, hh = TRAY_H * 0.5;
        const borderPts = [
          new THREE.Vector3(-hw, -hh, 0.005),
          new THREE.Vector3(hw, -hh, 0.005),
          new THREE.Vector3(hw, hh, 0.005),
          new THREE.Vector3(-hw, hh, 0.005)
        ];
        bay.add(new THREE.LineLoop(
          new THREE.BufferGeometry().setFromPoints(borderPts),
          new THREE.LineBasicMaterial({ color: '#C6B9A7', transparent: true, opacity: 0.95 })
        ));

        // Tiny architectural terracotta index tick top-left
        bay.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(-hw + 0.06, hh - 0.06, 0.006),
            new THREE.Vector3(-hw + 0.16, hh - 0.06, 0.006)
          ]),
          new THREE.LineBasicMaterial({ color: '#E8501C', transparent: true, opacity: 0.85 })
        ));

        const stage = new THREE.Group();
        stage.position.set(0, 0.01, 0.025);
        bay.add(stage);
        trays.push(stage);

        const anchor = new THREE.Object3D();
        anchor.position.set(0, -hh - 0.065, 0.02);
        bay.add(anchor);
        labelAnchors.push(anchor);
      }
    }

    const texBrief = createPdfPageTexture('brief');
    const texArch = createPdfPageTexture('architecture');
    const texContract = createPdfPageTexture('contract');
    const texLedger = createPdfPageTexture('ledger');

    const addEdgeHairline = (mesh, w, h, color = '#A69989', opacity = 0.85) => {
      const pts = [
        new THREE.Vector3(-w * 0.5, -h * 0.5, 0.001),
        new THREE.Vector3(w * 0.5, -h * 0.5, 0.001),
        new THREE.Vector3(w * 0.5, h * 0.5, 0.001),
        new THREE.Vector3(-w * 0.5, h * 0.5, 0.001)
      ];
      mesh.add(new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color, transparent: true, opacity })
      ));
    };

    // =========================================================================
    // 01 MERGE: Two crisp PDF folios gliding flush into one bound edge
    // =========================================================================
    const mW = 0.58, mH = 0.75;
    const mLeftFP = foldPlaneGeometry(mW, mH, 16, 20);
    const mRightFP = foldPlaneGeometry(mW, mH, 16, 20);
    const mLeft = new THREE.Mesh(
      mLeftFP.geometry,
      createCottonPaperMaterial({ color: '#FFFFFF', map: texBrief, vertexColors: true, roughness: 0.82 })
    );
    const mRight = new THREE.Mesh(
      mRightFP.geometry,
      createCottonPaperMaterial({ color: '#FFFFFF', map: texArch, vertexColors: true, roughness: 0.82 })
    );
    mLeft.castShadow = true; mLeft.receiveShadow = true; mLeft.shadowSide = THREE.FrontSide;
    mRight.castShadow = true; mRight.receiveShadow = true; mRight.shadowSide = THREE.FrontSide;
    addEdgeHairline(mLeft, mW, mH);
    addEdgeHairline(mRight, mW, mH);

    const mSpineMat = new THREE.LineBasicMaterial({ color: '#E8501C', transparent: true, opacity: 0.85 });
    const mSpine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, -mH * 0.54, 0.03),
        new THREE.Vector3(0, mH * 0.54, 0.03)
      ]),
      mSpineMat
    );
    trays[0].add(mLeft, mRight, mSpine);

    // =========================================================================
    // 02 SPLIT: Folded folio cleanly parting along a hairline terracotta crease
    // =========================================================================
    const sW = 0.56, sH = 0.74;
    const sLeftFP = foldPlaneGeometry(sW, sH, 16, 20);
    const sRightFP = foldPlaneGeometry(sW, sH, 16, 20);
    const sLeft = new THREE.Mesh(
      sLeftFP.geometry,
      createCottonPaperMaterial({ color: '#FFFFFF', map: texContract, vertexColors: true, roughness: 0.82 })
    );
    const sRight = new THREE.Mesh(
      sRightFP.geometry,
      createCottonPaperMaterial({ color: '#FFFFFF', map: texLedger, vertexColors: true, roughness: 0.82 })
    );
    sLeft.castShadow = true; sLeft.receiveShadow = true; sLeft.shadowSide = THREE.FrontSide;
    sRight.castShadow = true; sRight.receiveShadow = true; sRight.shadowSide = THREE.FrontSide;
    addEdgeHairline(sLeft, sW, sH);
    addEdgeHairline(sRight, sW, sH);

    const sCreaseMat = new THREE.MeshBasicMaterial({ color: '#E8501C', transparent: true, opacity: 0.9, side: THREE.DoubleSide });
    const sCrease = new THREE.Mesh(new THREE.PlaneGeometry(0.008, sH * 1.15), sCreaseMat);
    sCrease.position.z = 0.04;
    trays[1].add(sLeft, sRight, sCrease);

    // =========================================================================
    // 03 ROTATE & CROP: Crisp PDF sheet rotating 90° inside fine corner crop brackets
    // =========================================================================
    const rW = 0.56, rH = 0.72;
    const rFP = foldPlaneGeometry(rW, rH, 18, 22);
    const rSheet = new THREE.Mesh(
      rFP.geometry,
      createCottonPaperMaterial({ color: '#FFFFFF', map: texArch, vertexColors: true, roughness: 0.82 })
    );
    rSheet.position.z = 0.03;
    rSheet.castShadow = true; rSheet.receiveShadow = true; rSheet.shadowSide = THREE.FrontSide;
    addEdgeHairline(rSheet, rW, rH);
    trays[2].add(rSheet);

    // Fine circular degree hairline ring
    const rRingPts = [];
    for (let k = 0; k <= 64; k++) {
      const a = (k / 64) * Math.PI * 2;
      rRingPts.push(new THREE.Vector3(Math.cos(a) * 0.46, Math.sin(a) * 0.46, 0.01));
    }
    trays[2].add(new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(rRingPts),
      new THREE.LineBasicMaterial({ color: '#B5A99B', transparent: true, opacity: 0.55 })
    ));

    // Ultra-fine architectural L-brackets
    const rBrkMat = new THREE.LineBasicMaterial({ color: '#E8501C', transparent: true, opacity: 0.9 });
    const rBrackets = [];
    [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([sx, sy]) => {
      const bg = new THREE.Group();
      const l = 0.12;
      const pts = [
        new THREE.Vector3(0, -sy * l, 0), new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, 0), new THREE.Vector3(-sx * l, 0, 0)
      ];
      bg.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), rBrkMat));
      bg.position.set(sx * 0.36, sy * 0.36, 0.055);
      trays[2].add(bg);
      rBrackets.push({ g: bg, sx, sy });
    });

    // =========================================================================
    // 04 COMPRESS: Layered translucent vellum sheets settling cleanly (no black clamps)
    // =========================================================================
    const VELLUM_N = 7;
    const vW = 0.68, vH = 0.84;
    const vSheets = [];
    for (let v = 0; v < VELLUM_N; v++) {
      const fp = foldPlaneGeometry(vW, vH, 14, 18);
      const mat = new THREE.MeshPhysicalMaterial({
        color: v % 2 === 0 ? '#FFFDF9' : '#F6F0E6',
        roughness: 0.55,
        sheen: 0.5,
        transparent: true,
        opacity: v === 0 ? 0.85 : 0.48,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const m = new THREE.Mesh(fp.geometry, mat);
      m.castShadow = true; m.receiveShadow = true; m.shadowSide = THREE.FrontSide;
      const edgeMat = new THREE.LineBasicMaterial({
        color: v === 0 ? '#E8501C' : '#ABA093',
        transparent: true,
        opacity: v === 0 ? 0.85 : 0.48
      });
      m.add(new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-vW * 0.5, -vH * 0.5, 0.001),
          new THREE.Vector3(vW * 0.5, -vH * 0.5, 0.001),
          new THREE.Vector3(vW * 0.5, vH * 0.5, 0.001),
          new THREE.Vector3(-vW * 0.5, vH * 0.5, 0.001)
        ]),
        edgeMat
      ));
      trays[3].add(m);
      vSheets.push({ mesh: m, fp });
    }
    // Contracting hairline gauge bracket on right side of vellum stack
    const vGauge = new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(0, 0.5, 0),
        new THREE.Vector3(-0.04, 0.5, 0), new THREE.Vector3(0.02, 0.5, 0),
        new THREE.Vector3(-0.04, -0.5, 0), new THREE.Vector3(0.02, -0.5, 0)
      ]),
      new THREE.LineBasicMaterial({ color: '#E8501C', transparent: true, opacity: 0.88 })
    );
    vGauge.position.set(0.48, 0, 0.08);
    trays[3].add(vGauge);

    // =========================================================================
    // 05 OCR (Tesseract): Luminous hairline scan bar + dynamic CanvasTexture mask
    // =========================================================================
    const ocrCW = 512, ocrCH = 660;
    const noisyCanvas = document.createElement('canvas');
    noisyCanvas.width = ocrCW; noisyCanvas.height = ocrCH;
    const nctx = noisyCanvas.getContext('2d');

    const sharpCanvas = document.createElement('canvas');
    sharpCanvas.width = ocrCW; sharpCanvas.height = ocrCH;
    const sctx = sharpCanvas.getContext('2d');

    const compCanvas = document.createElement('canvas');
    compCanvas.width = ocrCW; compCanvas.height = ocrCH;
    const cctx = compCanvas.getContext('2d');

    // Paint noisy halftone scanned source
    nctx.fillStyle = '#E6DDD0';
    nctx.fillRect(0, 0, ocrCW, ocrCH);
    const rng = mulberry32(99173);
    for (let k = 0; k < 3600; k++) {
      const gx = rng() * ocrCW, gy = rng() * ocrCH;
      const shade = 155 + Math.floor(rng() * 65);
      nctx.fillStyle = `rgba(${shade - 15},${shade - 20},${shade - 25},0.38)`;
      nctx.fillRect(gx, gy, 2.5, 2.5);
    }
    nctx.save();
    nctx.translate(ocrCW * 0.5, ocrCH * 0.5);
    nctx.rotate(-0.032);
    nctx.translate(-ocrCW * 0.5, -ocrCH * 0.5);
    nctx.fillStyle = 'rgba(56, 48, 42, 0.55)';
    nctx.filter = 'blur(1.7px)';
    nctx.font = '700 28px "Georgia", serif';
    nctx.fillText('Tesseract Optical', 48, 128);
    nctx.fillText('Character Pass', 48, 166);
    nctx.font = '400 16px "Georgia", serif';
    [
      'Scanned archival folio containing',
      'skewed halftone dot grain and',
      'unindexed raster glyph regions.',
      '',
      'Engine normalizes baseline skew',
      'and embeds searchable UTF-8',
      'text layer inside PDF stream.'
    ].forEach((ln, idx) => nctx.fillText(ln, 48, 232 + idx * 34));
    nctx.restore();

    // Paint razor-sharp straightened serif typography
    sctx.fillStyle = '#FFFDF9';
    sctx.fillRect(0, 0, ocrCW, ocrCH);
    sctx.strokeStyle = 'rgba(36, 30, 27, 0.14)';
    sctx.lineWidth = 1.5;
    sctx.strokeRect(24, 24, ocrCW - 48, ocrCH - 48);

    sctx.fillStyle = '#E8501C';
    sctx.fillRect(48, 56, 38, 3);
    sctx.fillStyle = '#6E645D';
    sctx.font = '700 12px "Consolas", monospace';
    sctx.fillText('TESSERACT OCR  ·  SEARCHABLE LAYER', 48, 84);

    sctx.fillStyle = '#241E1B';
    sctx.font = '700 28px "Georgia", serif';
    sctx.fillText('Tesseract Optical', 48, 128);
    sctx.fillText('Character Pass', 48, 166);

    sctx.fillStyle = '#241E1B';
    sctx.font = '400 16px "Georgia", serif';
    [
      'Scanned archival folio containing',
      'skewed halftone dot grain and',
      'unindexed raster glyph regions.',
      '',
      'Engine normalizes baseline skew',
      'and embeds searchable UTF-8',
      'text layer inside PDF stream.'
    ].forEach((ln, idx) => {
      const ly = 232 + idx * 34;
      sctx.fillText(ln, 48, ly);
      if (ln) {
        sctx.strokeStyle = 'rgba(232, 80, 28, 0.20)';
        sctx.lineWidth = 1;
        sctx.beginPath(); sctx.moveTo(48, ly + 6); sctx.lineTo(440, ly + 6); sctx.stroke();
      }
    });

    sctx.fillStyle = '#E8501C';
    sctx.font = '700 12px "Consolas", monospace';
    sctx.fillText('UTF-8 TEXT LAYER VERIFIED  ·  100%', 48, 586);

    const ocrTex = new THREE.CanvasTexture(compCanvas);
    ocrTex.colorSpace = THREE.SRGBColorSpace;
    ocrTex.anisotropy = 8;

    const oW = 0.72, oH = 0.92;
    const oFP = foldPlaneGeometry(oW, oH, 16, 20);
    oFP.applyFold({ curl: 0.04 });
    const oSheet = new THREE.Mesh(
      oFP.geometry,
      createCottonPaperMaterial({ color: '#FFFFFF', map: ocrTex, vertexColors: true, roughness: 0.82 })
    );
    oSheet.position.set(0, 0, 0.03);
    oSheet.rotation.z = -0.04;
    oSheet.castShadow = true; oSheet.receiveShadow = true; oSheet.shadowSide = THREE.FrontSide;
    addEdgeHairline(oSheet, oW, oH);
    trays[4].add(oSheet);

    // Luminous hairline optical scan bar
    const scanBarGroup = new THREE.Group();
    scanBarGroup.rotation.z = -0.04;
    const scanLine = new THREE.Mesh(
      new THREE.PlaneGeometry(oW * 1.18, 0.009),
      new THREE.MeshBasicMaterial({ color: '#E8501C', side: THREE.DoubleSide })
    );
    const scanHalo = new THREE.Mesh(
      new THREE.PlaneGeometry(oW * 1.18, 0.065),
      new THREE.MeshBasicMaterial({ color: '#FF6B35', transparent: true, opacity: 0.24, side: THREE.DoubleSide })
    );
    scanBarGroup.add(scanHalo, scanLine);
    scanBarGroup.position.z = 0.065;
    trays[4].add(scanBarGroup);

    // =========================================================================
    // 06 CONVERT: Folded sheet smoothly turning its leaf across PDF -> PDF/A -> DOCX · MD
    // =========================================================================
    function createConvertStateTexture(mode) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 660;
      const ctx = c.getContext('2d');
      ctx.fillStyle = mode === 'pdfa' ? '#FDF7EC' : '#FFFDF9';
      ctx.fillRect(0, 0, 512, 660);
      ctx.strokeStyle = 'rgba(36, 30, 27, 0.14)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(24, 24, 464, 612);

      ctx.fillStyle = '#E8501C';
      ctx.fillRect(48, 56, 40, 4);
      ctx.fillStyle = '#6E645D';
      ctx.font = '700 13px "Consolas", monospace';

      if (mode === 'pdf') {
        ctx.fillText('SOURCE  ·  PDF 1.7', 48, 86);
        ctx.fillStyle = '#241E1B';
        ctx.font = '700 30px "Segoe UI", sans-serif';
        ctx.fillText('Master Folio', 48, 134);
        ctx.font = '400 17px "Georgia", serif';
        ['Fixed-layout vector streams', 'Embedded sRGB profile', 'Local Page Assembly'].forEach((t, k) => ctx.fillText(t, 48, 200 + k * 34));
      } else if (mode === 'pdfa') {
        ctx.fillText('ARCHIVAL  ·  PDF/A-2B', 48, 86);
        ctx.fillStyle = '#241E1B';
        ctx.font = '700 30px "Georgia", serif';
        ctx.fillText('Long-Term Seal', 48, 134);
        ctx.font = '400 17px "Georgia", serif';
        ['ISO 19005-2 compliant', 'All fonts & ICC embedded', 'Zero external references'].forEach((t, k) => ctx.fillText(t, 48, 200 + k * 34));
        ctx.strokeStyle = '#E8501C';
        ctx.lineWidth = 2;
        ctx.strokeRect(48, 360, 180, 46);
        ctx.fillStyle = '#E8501C';
        ctx.font = '700 14px "Consolas", monospace';
        ctx.fillText('PDF/A VERIFIED', 68, 389);
      } else {
        ctx.fillText('STRUCTURED  ·  DOCX · MD', 48, 86);
        ctx.fillStyle = '#241E1B';
        ctx.font = '700 26px "Consolas", monospace';
        ctx.fillText('# Master Folio', 48, 134);
        ctx.fillStyle = '#6E645D';
        ctx.font = '400 15px "Consolas", monospace';
        [
          '## 1. Document Summary',
          '- Engine: LibreOffice',
          '- Format: .docx / .md',
          '',
          '| Metric | Status |',
          '| Headings | Mapped |',
          '| Tables   | Clean  |'
        ].forEach((t, k) => ctx.fillText(t, 48, 200 + k * 32));
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    const cTexPdf = createConvertStateTexture('pdf');
    const cTexPdfa = createConvertStateTexture('pdfa');
    const cTexMd = createConvertStateTexture('md');

    const cW = 0.62, cH = 0.80;
    const cBaseFP = foldPlaneGeometry(cW, cH, 16, 20);
    const cBaseMat = createCottonPaperMaterial({ color: '#FFFFFF', map: cTexPdfa, vertexColors: true, roughness: 0.82 });
    const cBaseSheet = new THREE.Mesh(cBaseFP.geometry, cBaseMat);
    cBaseSheet.position.set(0.08, 0, 0.02);
    cBaseSheet.castShadow = true; cBaseSheet.receiveShadow = true; cBaseSheet.shadowSide = THREE.FrontSide;
    addEdgeHairline(cBaseSheet, cW, cH);

    // Turning leaf pivoted along left spine edge
    const cTurnPivot = new THREE.Group();
    cTurnPivot.position.set(0.08 - cW * 0.5, 0, 0.032);
    const cLeafFP = foldPlaneGeometry(cW, cH, 20, 20);
    const cLeafMat = createCottonPaperMaterial({ color: '#FFFFFF', map: cTexPdf, vertexColors: true, roughness: 0.80 });
    const cLeafMesh = new THREE.Mesh(cLeafFP.geometry, cLeafMat);
    cLeafMesh.position.x = cW * 0.5;
    cLeafMesh.castShadow = true; cLeafMesh.receiveShadow = true; cLeafMesh.shadowSide = THREE.FrontSide;
    addEdgeHairline(cLeafMesh, cW, cH);
    cTurnPivot.add(cLeafMesh);
    trays[5].add(cBaseSheet, cTurnPivot);

    const convertStateEl = document.getElementById('convert-state');
    const labelEls = [0, 1, 2, 3, 4, 5].map((k) => document.getElementById(`lbl-${k}`));
    const projV = new THREE.Vector3();

    function syncLabels() {
      for (let k = 0; k < 6; k++) {
        labelAnchors[k].getWorldPosition(projV);
        projV.project(camera);
        const sx = (projV.x * 0.5 + 0.5) * W;
        const sy = (-projV.y * 0.5 + 0.5) * H;
        labelEls[k].style.left = `${sx.toFixed(1)}px`;
        labelEls[k].style.top = `${sy.toFixed(1)}px`;
      }
    }

    let labelsSynced = false;

    window.renderFrame = function renderFrame(i, totalFrames, t) {
      const phase = t * Math.PI * 2;
      if (!labelsSynced) {
        camera.updateMatrixWorld();
        gallery.updateMatrixWorld(true);
        syncLabels();
        labelsSynced = true;
      }

      // 01 MERGE: two crisp folios glide apart and flush-bind
      const mergeU = easeInOutQuint(0.5 - 0.5 * Math.cos(phase));
      const mGap = (1 - mergeU) * 0.34;
      mLeft.position.set(-0.24 - mGap, 0, 0.035);
      mRight.position.set(0.24 + mGap, 0, 0.025);
      mLeft.rotation.y = mGap * 0.42;
      mRight.rotation.y = -mGap * 0.42;
      mLeftFP.applyFold({ curl: (1 - mergeU) * 0.12 });
      mRightFP.applyFold({ curl: (1 - mergeU) * 0.12 });
      mSpineMat.opacity = 0.25 + mergeU * 0.72;
      mSpine.scale.y = 0.35 + mergeU * 0.65;

      // 02 SPLIT: folded folio parting along hairline terracotta crease
      const splitWave = 0.5 - 0.5 * Math.cos(phase + 0.9);
      const splitU = easeInOutQuint(splitWave);
      const sGap = splitU * 0.26;
      sLeft.position.set(-0.27 - sGap, 0, 0.03);
      sRight.position.set(0.27 + sGap, 0, 0.03);
      sLeft.rotation.y = -sGap * 0.65;
      sRight.rotation.y = sGap * 0.65;
      sLeftFP.applyFold({ curl: splitU * 0.10 });
      sRightFP.applyFold({ curl: splitU * 0.10 });
      sCrease.position.y = (0.5 - splitWave) * 0.28;
      sCreaseMat.opacity = 0.25 + Math.sin(splitWave * Math.PI) * 0.72;

      // 03 ROTATE & CROP: 90° smooth rotation inside fine corner crop brackets
      const rotU = easeInOutQuint(0.5 - 0.5 * Math.cos(phase + 1.8));
      rSheet.rotation.z = rotU * (Math.PI * 0.5);
      rFP.applyFold({ curl: Math.sin(rotU * Math.PI) * 0.10 });
      const brkSpan = lerp(0.40, 0.31, rotU);
      rBrackets.forEach(({ g, sx, sy }) => {
        g.position.x = sx * brkSpan;
        g.position.y = sy * brkSpan;
      });

      // 04 COMPRESS: layered translucent vellum sheets settling cleanly
      const compU = easeInOutQuint(0.5 - 0.5 * Math.cos(phase + 2.7));
      const zSpan = lerp(0.32, 0.035, compU);
      const ySpan = lerp(0.18, 0.015, compU);
      for (let v = 0; v < VELLUM_N; v++) {
        const frac = v / (VELLUM_N - 1);
        vSheets[v].mesh.position.set(
          (0.5 - frac) * lerp(0.12, 0.01, compU),
          (0.5 - frac) * ySpan,
          0.02 + (1 - frac) * zSpan
        );
        vSheets[v].fp.applyFold({ curl: (1 - compU) * 0.09, waveAmp: (1 - compU) * 0.12, wavePhase: v * 0.8 + phase });
      }
      vGauge.scale.y = lerp(0.95, 0.22, compU);

      // 05 OCR (Tesseract): luminous scan bar + real CanvasTexture clip transform
      const scanWave = 0.5 - 0.5 * Math.cos(phase + 3.5);
      const scanFrac = clamp01(scanWave); // 0 = top, 1 = bottom
      const scanCanvasY = Math.round(scanFrac * ocrCH);

      cctx.clearRect(0, 0, ocrCW, ocrCH);
      if (scanCanvasY > 0) {
        cctx.drawImage(sharpCanvas, 0, 0, ocrCW, scanCanvasY, 0, 0, ocrCW, scanCanvasY);
      }
      if (scanCanvasY < ocrCH) {
        cctx.drawImage(noisyCanvas, 0, scanCanvasY, ocrCW, ocrCH - scanCanvasY, 0, scanCanvasY, ocrCW, ocrCH - scanCanvasY);
      }
      cctx.fillStyle = '#E8501C';
      cctx.fillRect(0, Math.max(0, scanCanvasY - 2), ocrCW, 4);
      ocrTex.needsUpdate = true;

      scanBarGroup.position.y = lerp(oH * 0.48, -oH * 0.48, scanFrac);

      // 06 CONVERT: folded leaf smoothly turning across PDF -> PDF/A -> DOCX · MD
      const leafPhase = (t * 2) % 1;
      const leafTurn = easeInOutQuint(clamp01(leafPhase / 0.72));
      if (t < 0.5) {
        cLeafMat.map = cTexPdf;
        cBaseMat.map = cTexPdfa;
        convertStateEl.textContent = 'PDF → PDF/A';
      } else {
        cLeafMat.map = cTexPdfa;
        cBaseMat.map = cTexMd;
        convertStateEl.textContent = 'PDF/A → DOCX · MD';
      }
      cLeafMat.needsUpdate = true;
      cBaseMat.needsUpdate = true;

      // Smooth leaf turn from right (+X) toward spine (-PI * 0.72) with paper curl, then gently reset for next cycle
      const turnAngle = leafTurn * (-Math.PI * 0.72);
      const leafFade = t < 0.5
        ? 1 - smootherstep((t - 0.40) / 0.10)
        : 1 - smootherstep((t - 0.90) / 0.10);
      cTurnPivot.rotation.y = turnAngle;
      cLeafMesh.visible = leafFade > 0.02;
      cLeafFP.applyFold({ curl: Math.sin(leafTurn * Math.PI) * 0.22 });

      renderer.render(scene, camera);
    };

    window.sceneReady = Promise.resolve();
  </script>
</body>
