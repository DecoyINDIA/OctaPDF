<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OctaPDF — Precision Editing (Level 4)</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FAF7F2;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .telemetry-rail {
      position: absolute;
      top: 28px;
      right: 42px;
      font-family: ui-monospace, 'Consolas', monospace;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6E645D;
      pointer-events: none;
      border-bottom: 1px solid rgba(36, 30, 27, 0.14);
      padding-bottom: 5px;
    }
    .telemetry-rail span {
      color: #E8501C;
    }
  </style>
</head>
<body>
  <div class="telemetry-rail" id="telemetry-rail">Z-DEPTH <span>+6.5 MM</span> &nbsp;·&nbsp; ROT <span>0.0°</span></div>

  <script type="module">
    import * as THREE from '/scripts/readme-studio/vendor/three.module.js';
    import {
      initStudio,
      createCottonPaperMaterial,
      createEditorialCaptionLayer,
      foldPlaneGeometry,
      clamp01,
      lerp,
      smootherstep,
      easeInOutQuint,
      springDamped
    } from '/scripts/readme-studio/scenes/studio-kit.js';

    const W = 1120;
    const H = 520;

    const studio = initStudio(null, {
      mode: 'light',
      width: W,
      height: H,
      fov: 28,
      camPos: [0.24, 1.66, 2.62],
      lookAt: [0.02, 0.02, 0.02],
      floorY: -0.025,
      fogDensity: 0.006,
      shadowOpacity: 0.28,
      shadowFrustum: 3.4,
      exposure: 0.88
    });
    const { renderer, scene, camera } = studio;
    studio.lights.key.position.set(4.2, 4.0, 2.0);
    studio.lights.key.intensity = 2.15;
    studio.lights.hemi.intensity = 0.68;

    const hud = createEditorialCaptionLayer(document.body, {
      mode: 'light',
      designWidth: W,
      designHeight: H,
      kicker: 'OCTAPDF // PRECISION EDITING'
    });

    const telemetryEl = document.getElementById('telemetry-rail');

    // Cotton paper drafting mat on the table beneath the contract sheet
    const matGeo = new THREE.PlaneGeometry(5.2, 4.4);
    const matMesh = new THREE.Mesh(
      matGeo,
      createCottonPaperMaterial({
        color: '#EDE4D7',
        roughness: 0.94,
        bumpScale: 0.006,
        sheen: 0.18
      })
    );
    matMesh.rotation.x = -Math.PI / 2;
    matMesh.position.y = -0.008;
    matMesh.receiveShadow = true;
    scene.add(matMesh);

    // Subtle hairline drafting rules on the cotton mat
    const matRulePts = [];
    for (let x = -1.8; x <= 1.81; x += 0.45) {
      matRulePts.push(new THREE.Vector3(x, -0.006, -1.6), new THREE.Vector3(x, -0.006, 1.6));
    }
    for (let z = -1.35; z <= 1.36; z += 0.45) {
      matRulePts.push(new THREE.Vector3(-1.8, -0.006, z), new THREE.Vector3(1.8, -0.006, z));
    }
    scene.add(new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(matRulePts),
      new THREE.LineBasicMaterial({ color: '#CFC3B2', transparent: true, opacity: 0.65 })
    ));

    // =========================================================================
    // Base High-DPI Contract PDF Sheet (1024x1320, clean signature line)
    // =========================================================================
    function createContractBaseTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1320;
      const ctx = c.getContext('2d');
      const Wp = 1024, Hp = 1320;
      const bg = '#FFFDF9', subtle = '#F5EFE6', ink = '#241E1B', muted = '#6E645D';
      const rule = 'rgba(36, 30, 27, 0.14)', accent = '#E8501C';

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, Wp, Hp);
      const vig = ctx.createRadialGradient(Wp * 0.5, Hp * 0.45, 160, Wp * 0.5, Hp * 0.5, 820);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(218, 206, 190, 0.20)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, Wp, Hp);

      // Corner crop marks
      ctx.strokeStyle = rule;
      ctx.lineWidth = 1.5;
      const m = 54, tk = 20;
      [[m, m, 1, 1], [Wp - m, m, -1, 1], [m, Hp - m, 1, -1], [Wp - m, Hp - m, -1, -1]].forEach(([x, y, dx, dy]) => {
        ctx.beginPath(); ctx.moveTo(x, y + dy * tk); ctx.lineTo(x, y); ctx.lineTo(x + dx * tk, y); ctx.stroke();
      });

      ctx.fillStyle = muted;
      ctx.font = '600 16px "Segoe UI", sans-serif';
      ctx.fillText('OCTAPDF  /  PRECISION EDITING', 92, 92);
      ctx.textAlign = 'right';
      ctx.fillText('CONTRACT  03 / 04', Wp - 92, 92);
      ctx.textAlign = 'left';

      ctx.strokeStyle = rule;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(92, 112); ctx.lineTo(Wp - 92, 112); ctx.stroke();

      ctx.fillStyle = accent;
      ctx.fillRect(92, 154, 52, 4);
      ctx.fillStyle = muted;
      ctx.font = '700 15px "Segoe UI", sans-serif';
      ctx.fillText('EXECUTION & INTEGRITY ATTESTATION', 92, 190);
      ctx.fillStyle = ink;
      ctx.font = '700 40px "Georgia", serif';
      ctx.fillText('Certificate of Local Processing', 92, 248);

      // Faint architectural registration box on right half where layout card sits
      ctx.strokeStyle = 'rgba(232, 80, 28, 0.22)';
      ctx.setLineDash([6, 6]);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(540, 300, 392, 310);
      ctx.setLineDash([]);

      const lines = [
        'ARTICLE I — CUSTODY OF MATERIAL',
        'All source manuscripts, exhibits, and signature',
        'vectors remain strictly under host custody.',
        '',
        'ARTICLE II — CRYPTOGRAPHIC SEALING',
        'Digital signatures apply PKCS#7 verification',
        'directly within local JVM execution.'
      ];
      ctx.fillStyle = 'rgba(36, 30, 27, 0.65)';
      ctx.font = '400 18px "Georgia", serif';
      lines.forEach((ln, idx) => ctx.fillText(ln, 92, 324 + idx * 32));

      // Lower signature execution block
      const y = 665;
      ctx.fillStyle = subtle;
      ctx.fillRect(92, y, Wp - 184, 248);
      ctx.strokeStyle = rule;
      ctx.strokeRect(92, y, Wp - 184, 248);

      ctx.fillStyle = muted;
      ctx.font = '700 14px "Segoe UI", sans-serif';
      ctx.fillText('AUTHORIZED SIGNATURE', 132, y + 48);
      ctx.fillText('LOCAL ATTESTATION', 668, y + 48);

      ctx.strokeStyle = 'rgba(36, 30, 27, 0.30)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(132, y + 174);
      ctx.lineTo(568, y + 174);
      ctx.stroke();

      ctx.fillStyle = ink;
      ctx.font = '600 15px "Segoe UI", sans-serif';
      ctx.fillText('PKCS#7 Local Keystore · v0.46.2', 132, y + 210);

      // Footer
      ctx.strokeStyle = rule;
      ctx.beginPath(); ctx.moveTo(92, Hp - 102); ctx.lineTo(Wp - 92, Hp - 102); ctx.stroke();
      ctx.fillStyle = muted;
      ctx.font = '400 14px "Consolas", monospace';
      ctx.fillText('LOCAL CUSTODY  ·  ZERO TELEMETRY  ·  MIT', 92, Hp - 68);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    const BASE_W = 2.48;
    const BASE_H = 3.20;
    const baseFP = foldPlaneGeometry(BASE_W, BASE_H, 32, 40);
    baseFP.applyFold({ waveAmp: 0.08, wavePhase: 0.4 });
    const baseSheet = new THREE.Mesh(
      baseFP.geometry,
      createCottonPaperMaterial({
        color: '#FFFFFF',
        map: createContractBaseTexture(),
        vertexColors: true,
        roughness: 0.85,
        sheen: 0.35,
        bumpScale: 0.005
      })
    );
    baseSheet.rotation.x = -Math.PI / 2;
    baseSheet.position.set(0, 0.002, 0);
    baseSheet.castShadow = true;
    baseSheet.receiveShadow = true;
    baseSheet.shadowSide = THREE.FrontSide;
    scene.add(baseSheet);

    // Fine border hairline on base sheet
    const addBorder = (mesh, w, h, color = '#ABA092') => {
      mesh.add(new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-w * 0.5, -h * 0.5, 0.0015),
          new THREE.Vector3(w * 0.5, -h * 0.5, 0.0015),
          new THREE.Vector3(w * 0.5, h * 0.5, 0.0015),
          new THREE.Vector3(-w * 0.5, h * 0.5, 0.0015)
        ]),
        new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.85 })
      ));
    };
    addBorder(baseSheet, BASE_W, BASE_H);

    // =========================================================================
    // 1. Lifted Left Typographic Layer (Real high-DPI paper cutout, 3-10mm Z-lift)
    // =========================================================================
    function createTypoLayerTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 640;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 512, 640);

      ctx.strokeStyle = 'rgba(36, 30, 27, 0.14)';
      ctx.lineWidth = 2;
      ctx.strokeRect(18, 18, 476, 604);

      ctx.fillStyle = '#E8501C';
      ctx.fillRect(42, 48, 40, 4);
      ctx.fillStyle = '#6E645D';
      ctx.font = '700 13px "Consolas", monospace';
      ctx.fillText('LAYER 01  ·  TYPOGRAPHY EXTRACT', 42, 78);

      ctx.fillStyle = '#241E1B';
      ctx.font = '700 30px "Georgia", serif';
      ctx.fillText('Editorial Custody', 42, 128);
      ctx.fillText('& Vector Fidelity', 42, 166);

      ctx.fillStyle = '#241E1B';
      ctx.font = '400 16px "Georgia", serif';
      const para = [
        'Embedded Type1 / TrueType font tables',
        'preserve exact kerning pairs, baseline',
        'metrics, and ICC color spaces across',
        'multi-page assemblies.',
        '',
        'Every lifted object layer retains its',
        'exact coordinate matrix without',
        'lossy page rasterization.'
      ];
      para.forEach((ln, idx) => ctx.fillText(ln, 42, 224 + idx * 30));

      ctx.strokeStyle = 'rgba(232, 80, 28, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(42, 500); ctx.lineTo(470, 500); ctx.stroke();

      ctx.fillStyle = '#6E645D';
      ctx.font = '600 13px "Consolas", monospace';
      ctx.fillText('PDFBOX 3.0.5  ·  Z-LAYER OBJECT', 42, 536);
      ctx.fillStyle = '#E8501C';
      ctx.fillText('VECTOR PRESERVATION: 100%', 42, 566);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    const typoFP = foldPlaneGeometry(0.96, 1.18, 22, 26);
    const typoLayer = new THREE.Mesh(
      typoFP.geometry,
      createCottonPaperMaterial({
        color: '#FFFFFF',
        map: createTypoLayerTexture(),
        vertexColors: true,
        roughness: 0.80,
        sheen: 0.4,
        bumpScale: 0.004
      })
    );
    typoLayer.rotation.x = -Math.PI / 2;
    typoLayer.position.set(-0.58, 0.05, -0.22);
    typoLayer.castShadow = true;
    typoLayer.receiveShadow = true;
    typoLayer.shadowSide = THREE.FrontSide;
    addBorder(typoLayer, 0.96, 1.18, '#A69A8B');
    scene.add(typoLayer);

    // =========================================================================
    // 2. Lifted Figure / Layout Card (Rotates 0° -> 90.0° inside 0.5mm crosshairs & degree dial)
    // =========================================================================
    function createLayoutCardTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 416;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#FFFDF9';
      ctx.fillRect(0, 0, 512, 416);

      ctx.strokeStyle = 'rgba(36, 30, 27, 0.16)';
      ctx.lineWidth = 2;
      ctx.strokeRect(14, 14, 484, 388);

      // Architectural schematic grid inside card
      ctx.strokeStyle = 'rgba(232, 80, 28, 0.12)';
      ctx.lineWidth = 1;
      for (let gx = 40; gx <= 472; gx += 36) {
        ctx.beginPath(); ctx.moveTo(gx, 110); ctx.lineTo(gx, 340); ctx.stroke();
      }
      for (let gy = 110; gy <= 340; gy += 36) {
        ctx.beginPath(); ctx.moveTo(40, gy); ctx.lineTo(472, gy); ctx.stroke();
      }

      ctx.fillStyle = '#E8501C';
      ctx.fillRect(36, 40, 34, 4);
      ctx.fillStyle = '#6E645D';
      ctx.font = '700 13px "Consolas", monospace';
      ctx.fillText('FIG 02  ·  LAYOUT PLATE', 36, 70);

      // Diagrammatic folio vector lines
      ctx.strokeStyle = '#241E1B';
      ctx.lineWidth = 2;
      ctx.strokeRect(64, 134, 160, 176);
      ctx.strokeStyle = '#E8501C';
      ctx.strokeRect(276, 134, 172, 84);
      ctx.strokeStyle = '#6E645D';
      ctx.strokeRect(276, 234, 172, 76);

      ctx.fillStyle = '#241E1B';
      ctx.font = '700 16px "Segoe UI", sans-serif';
      ctx.fillText('MEDIA BOX', 86, 174);
      ctx.fillStyle = '#E8501C';
      ctx.font = '700 14px "Consolas", monospace';
      ctx.fillText('CROP  90.0°', 298, 182);
      ctx.fillStyle = '#6E645D';
      ctx.fillText('BLEED  3 MM', 298, 278);

      ctx.fillStyle = '#6E645D';
      ctx.font = '600 12px "Consolas", monospace';
      ctx.fillText('ALIGN // TRANSFORM MATRIX', 36, 378);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    const cardCenter = new THREE.Vector3(0.56, 0, -0.34);
    const cardFP = foldPlaneGeometry(0.84, 0.68, 20, 18);
    const layoutCard = new THREE.Mesh(
      cardFP.geometry,
      createCottonPaperMaterial({
        color: '#FFFFFF',
        map: createLayoutCardTexture(),
        vertexColors: true,
        roughness: 0.78,
        sheen: 0.42,
        bumpScale: 0.004
      })
    );
    layoutCard.rotation.order = 'YXZ';
    layoutCard.rotation.x = -Math.PI / 2;
    layoutCard.position.set(cardCenter.x, 0.06, cardCenter.z);
    layoutCard.castShadow = true;
    layoutCard.receiveShadow = true;
    layoutCard.shadowSide = THREE.FrontSide;
    addBorder(layoutCard, 0.84, 0.68, '#A69A8B');
    scene.add(layoutCard);

    // =========================================================================
    // Ultra-Thin 0.5mm #E8501C Architectural Crosshairs & Degree Dial (0° -> 90.0°)
    // =========================================================================
    const crossGroup = new THREE.Group();
    crossGroup.position.set(cardCenter.x, 0.005, cardCenter.z);
    scene.add(crossGroup);

    // Fine crosshairs extending across the contract sheet
    const crossMat = new THREE.LineBasicMaterial({ color: '#E8501C', transparent: true, opacity: 0.78 });
    const crossPts = [
      new THREE.Vector3(-1.72, 0, 0), new THREE.Vector3(0.68, 0, 0),
      new THREE.Vector3(0, 0, -1.20), new THREE.Vector3(0, 0, 1.38)
    ];
    crossGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(crossPts), crossMat));

    // Precision architectural degree dial (0° -> 90° ticks on XZ plane)
    const dialRadius = 0.58;
    const dialArcPts = [];
    for (let k = 0; k <= 45; k++) {
      const a = (k / 45) * (Math.PI / 2);
      dialArcPts.push(new THREE.Vector3(Math.cos(a) * dialRadius, 0, -Math.sin(a) * dialRadius));
    }
    const dialArcMat = new THREE.LineBasicMaterial({ color: '#6E645D', transparent: true, opacity: 0.65 });
    crossGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(dialArcPts), dialArcMat));

    // Degree tick marks every 5°, longer every 15°
    const tickPts = [];
    for (let deg = 0; deg <= 90; deg += 5) {
      const a = (deg * Math.PI) / 180;
      const len = deg % 15 === 0 ? 0.045 : 0.022;
      tickPts.push(
        new THREE.Vector3(Math.cos(a) * dialRadius, 0, -Math.sin(a) * dialRadius),
        new THREE.Vector3(Math.cos(a) * (dialRadius + len), 0, -Math.sin(a) * (dialRadius + len))
      );
    }
    crossGroup.add(new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(tickPts),
      new THREE.LineBasicMaterial({ color: '#241E1B', transparent: true, opacity: 0.5 })
    ));

    // Active terracotta sweep needle ray on the degree dial
    const dialNeedleGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0.002, 0),
      new THREE.Vector3(dialRadius + 0.06, 0.002, 0)
    ]);
    const dialNeedle = new THREE.Line(
      dialNeedleGeo,
      new THREE.LineBasicMaterial({ color: '#E8501C', transparent: true, opacity: 0.92 })
    );
    crossGroup.add(dialNeedle);

    // Ultra-thin L-shaped corner registration brackets tracking the lifted layout card
    const bracketGroup = new THREE.Group();
    bracketGroup.position.set(cardCenter.x, 0.06, cardCenter.z);
    scene.add(bracketGroup);
    const bw = 0.45, bd = 0.37, bl = 0.10;
    const brkPts = [];
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
      brkPts.push(
        new THREE.Vector3(sx * bw, 0, sz * (bd - bl)), new THREE.Vector3(sx * bw, 0, sz * bd),
        new THREE.Vector3(sx * bw, 0, sz * bd), new THREE.Vector3(sx * (bw - bl), 0, sz * bd)
      );
    });
    const bracketMat = new THREE.LineBasicMaterial({ color: '#E8501C', transparent: true, opacity: 0.9 });
    const bracketLines = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(brkPts), bracketMat);
    bracketGroup.add(bracketLines);

    // =========================================================================
    // 3. Sleek Tapered Calligraphic Nib & Smooth Variable-Width Terracotta Ink Stroke
    // =========================================================================
    // Attached directly to baseSheet local space (XY = page plane, +Z = up off page)
    const sigAnchor = new THREE.Group();
    baseSheet.add(sigAnchor);

    // Organic aristocratic calligraphic signature curve (varied ascenders + sweeping tail)
    const sigCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.86, -0.425, 0.0045),
      new THREE.Vector3(-0.79, -0.235, 0.0045),
      new THREE.Vector3(-0.72, -0.445, 0.0045),
      new THREE.Vector3(-0.62, -0.355, 0.0045),
      new THREE.Vector3(-0.56, -0.430, 0.0045),
      new THREE.Vector3(-0.47, -0.375, 0.0045),
      new THREE.Vector3(-0.41, -0.432, 0.0045),
      new THREE.Vector3(-0.29, -0.280, 0.0045),
      new THREE.Vector3(-0.24, -0.435, 0.0045),
      new THREE.Vector3(-0.13, -0.388, 0.0045),
      new THREE.Vector3(-0.02, -0.425, 0.0045),
      new THREE.Vector3(-0.34, -0.475, 0.0045),
      new THREE.Vector3(0.08, -0.455, 0.0045)
    ]);

    function createCalligraphicRibbonGeometry(curve, segments = 260) {
      const geo = new THREE.BufferGeometry();
      const vertCount = (segments + 1) * 2;
      const positions = new Float32Array(vertCount * 3);
      const colors = new Float32Array(vertCount * 3);
      const indices = [];

      const p = new THREE.Vector3();
      const t = new THREE.Vector3();
      const cDark = new THREE.Color('#BF3408');
      const cMid = new THREE.Color('#E8501C');
      const cLight = new THREE.Color('#FF6B35');
      const tmpC = new THREE.Color();

      for (let s = 0; s <= segments; s++) {
        const u = s / segments;
        curve.getPoint(u, p);
        curve.getTangent(u, t).normalize();
        const nx = -t.y;
        const ny = t.x;

        // Broad-edge fountain nib swell: bold downstrokes, whisper-thin upstrokes
        const downBias = clamp01((-t.y + 0.62) * 0.70);
        const endTaper = Math.sin(clamp01(u) * Math.PI);
        const swell = 0.0038 + 0.0175 * Math.pow(downBias, 1.3) * (0.28 + 0.72 * Math.pow(endTaper, 0.42));

        const idx = s * 2;
        positions[idx * 3 + 0] = p.x - nx * swell;
        positions[idx * 3 + 1] = p.y - ny * swell;
        positions[idx * 3 + 2] = p.z;

        positions[(idx + 1) * 3 + 0] = p.x + nx * swell;
        positions[(idx + 1) * 3 + 1] = p.y + ny * swell;
        positions[(idx + 1) * 3 + 2] = p.z;

        tmpC.copy(cDark).lerp(cMid, 0.35 + 0.45 * downBias).lerp(cLight, u * 0.18);
        colors[idx * 3 + 0] = tmpC.r; colors[idx * 3 + 1] = tmpC.g; colors[idx * 3 + 2] = tmpC.b;
        colors[(idx + 1) * 3 + 0] = tmpC.r; colors[(idx + 1) * 3 + 1] = tmpC.g; colors[(idx + 1) * 3 + 2] = tmpC.b;

        if (s < segments) {
          indices.push(idx, idx + 1, idx + 2, idx + 1, idx + 3, idx + 2);
        }
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      geo.userData.segments = segments;
      return geo;
    }

    const SIG_SEGS = 260;
    const sigGeo = createCalligraphicRibbonGeometry(sigCurve, SIG_SEGS);
    const sigMesh = new THREE.Mesh(
      sigGeo,
      new THREE.MeshPhysicalMaterial({
        color: '#FFFFFF',
        vertexColors: true,
        roughness: 0.22,
        clearcoat: 0.62,
        clearcoatRoughness: 0.18,
        side: THREE.DoubleSide
      })
    );
    sigAnchor.add(sigMesh);

    // Sleek sculpted calligraphic fountain nib (flat beveled nib tines + slim drafting barrel)
    const nibGroup = new THREE.Group();
    const nibMetalMat = new THREE.MeshStandardMaterial({ color: '#3A342F', roughness: 0.24, metalness: 0.82 });
    const barrelMat = new THREE.MeshStandardMaterial({ color: '#1E1A17', roughness: 0.40, metalness: 0.35 });
    const collarMat = new THREE.MeshStandardMaterial({ color: '#E8501C', roughness: 0.30, metalness: 0.25 });

    // Flat calligraphic nib blade shape
    const nibShape = new THREE.Shape();
    nibShape.moveTo(0, 0);
    nibShape.lineTo(-0.015, 0.055);
    nibShape.lineTo(-0.011, 0.115);
    nibShape.lineTo(0.011, 0.115);
    nibShape.lineTo(0.015, 0.055);
    nibShape.closePath();

    const nibBlade = new THREE.Mesh(
      new THREE.ExtrudeGeometry(nibShape, { depth: 0.004, bevelEnabled: true, bevelThickness: 0.0015, bevelSize: 0.001, bevelSegments: 2 }),
      nibMetalMat
    );
    nibBlade.rotation.x = Math.PI * 0.5;
    nibBlade.position.set(0, 0.002, 0);
    nibBlade.castShadow = true;

    const nibCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.012, 0.022, 20), collarMat);
    nibCollar.rotation.x = Math.PI * 0.5;
    nibCollar.position.z = 0.125;
    nibCollar.castShadow = true;

    const nibBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.019, 0.014, 0.62, 20), barrelMat);
    nibBarrel.rotation.x = Math.PI * 0.5;
    nibBarrel.position.z = 0.445;
    nibBarrel.castShadow = true;

    const penPivot = new THREE.Group();
    penPivot.add(nibBlade, nibCollar, nibBarrel);
    // Tilt pen naturally in sheet space (+Z is up, +X right, -Y down)
    penPivot.rotation.set(-0.62, 0.32, 0.18);
    nibGroup.add(penPivot);
    sigAnchor.add(nibGroup);

    // Crisp hairline octagonal registration seal on right side of signature box
    const sealGroup = new THREE.Group();
    sealGroup.position.set(0.56, -0.435, 0.004);
    sigAnchor.add(sealGroup);
    const makeOctPts = (r) => {
      const pts = [];
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2 + Math.PI / 8;
        pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0));
      }
      return pts;
    };
    const sealMat = new THREE.LineBasicMaterial({ color: '#E8501C', transparent: true, opacity: 0.9 });
    sealGroup.add(
      new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(makeOctPts(0.175)), sealMat),
      new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(makeOctPts(0.135)), sealMat),
      new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-0.07, 0, 0), new THREE.Vector3(0.07, 0, 0),
        new THREE.Vector3(0, -0.07, 0), new THREE.Vector3(0, 0.07, 0)
      ]), sealMat)
    );

    const tmpPt = new THREE.Vector3();

    window.renderFrame = function renderFrame(i, totalFrames, t) {
      const orbit = t * Math.PI * 2;
      // Smooth low-angle macro sweep returning seamlessly at t=1
      camera.position.set(
        0.24 + Math.sin(orbit) * 0.24,
        1.66 - Math.cos(orbit) * 0.10,
        2.62 + Math.sin(orbit * 0.5) * 0.04
      );
      camera.lookAt(0.02 + Math.sin(orbit) * 0.04, 0.02, 0.02);

      // 1. Typographic layer smooth 4-10mm Z-lift casting delicate paper-to-paper shadows
      const liftU = smootherstep(t / 0.24) * (1 - smootherstep((t - 0.84) / 0.16));
      const typoHeight = lerp(0.036, 0.102, liftU) + Math.sin(orbit) * 0.006;
      typoLayer.position.y = typoHeight;
      typoFP.applyFold({ curl: 0.04 + 0.035 * liftU, waveAmp: 0.10, wavePhase: orbit });

      // 2. Layout card lift, 0° -> 90.0° architectural rotation & crosshair lock
      const rotIn = easeInOutQuint(clamp01((t - 0.20) / 0.24));
      const rotOut = easeInOutQuint(clamp01((t - 0.83) / 0.16));
      const aligned = rotIn * (1 - rotOut);

      const angleRad = aligned * (Math.PI * 0.5);
      const cardLift = lerp(0.042, 0.108, Math.sin(aligned * Math.PI)) + (1 - aligned) * 0.014;
      layoutCard.position.y = cardLift;
      layoutCard.rotation.y = angleRad;
      cardFP.applyFold({ curl: Math.sin(aligned * Math.PI) * 0.065 });

      // Crosshairs, degree dial & corner brackets track card lock
      const dialAlpha = smootherstep((t - 0.16) / 0.08) * (1 - smootherstep((t - 0.86) / 0.12));
      crossMat.opacity = 0.25 + dialAlpha * 0.65;
      dialArcMat.opacity = 0.25 + dialAlpha * 0.55;
      dialNeedle.rotation.y = angleRad;

      const brkScale = lerp(1.16, 1.0, aligned);
      bracketGroup.position.y = cardLift + 0.006;
      bracketGroup.rotation.y = angleRad;
      bracketGroup.scale.set(brkScale, 1, brkScale);
      bracketMat.opacity = 0.35 + aligned * 0.60;

      // 3. Calligraphic ink stroke & nib choreography (0.44 -> 0.76 draw, hold -> 0.85, reset)
      let drawU = 0;
      if (t >= 0.44 && t < 0.74) {
        drawU = easeInOutQuint((t - 0.44) / 0.30);
      } else if (t >= 0.74 && t < 0.86) {
        drawU = 1;
      } else if (t >= 0.86) {
        drawU = 1 - smootherstep((t - 0.86) / 0.12);
      }
      sigGeo.setDrawRange(0, Math.floor(drawU * SIG_SEGS) * 6);

      if (t >= 0.42 && t < 0.76) {
        nibGroup.visible = true;
        const pU = clamp01((t - 0.44) / 0.30);
        sigCurve.getPoint(pU, tmpPt);
        // Gentle approach & lift at stroke start/end
        const approachLift = (1 - smootherstep((t - 0.42) / 0.03)) * 0.08 + smootherstep((t - 0.735) / 0.025) * 0.12;
        nibGroup.position.set(tmpPt.x, tmpPt.y, tmpPt.z + approachLift);
      } else {
        nibGroup.visible = false;
      }

      // Hairline octagonal seal
      const sealU = springDamped(clamp01((t - 0.72) / 0.08), 6.5, 11.0) * (1 - smootherstep((t - 0.86) / 0.11));
      if (sealU > 0.02) {
        sealGroup.visible = true;
        sealGroup.scale.setScalar(0.65 + 0.35 * clamp01(sealU));
        sealMat.opacity = clamp01(sealU) * 0.90;
      } else {
        sealGroup.visible = false;
      }

      // Update Swiss editorial captions & telemetry readout
      const degNum = (aligned * 90.0).toFixed(1);
      const zMm = (typoHeight * 100).toFixed(1);
      telemetryEl.innerHTML = `Z-LAYER <span>+${zMm} MM</span> &nbsp;·&nbsp; ROT <span>${degNum}°</span>`;

      if (t < 0.24) {
        hud.setCaption('01 / 03', 'Z-DEPTH LAYERS — PAPER-TO-PAPER SHADOWS', 0.90);
      } else if (t < 0.46) {
        hud.setCaption('02 / 03', 'ARCHITECTURAL DIAL — 0° → 90.0° ALIGN', 0.90);
      } else {
        hud.setCaption('03 / 03', 'CALLIGRAPHIC NIB — VARIABLE INK & SEAL', 0.90);
      }

      renderer.render(scene, camera);
    };

    window.sceneReady = Promise.resolve();
  </script>
</body>
