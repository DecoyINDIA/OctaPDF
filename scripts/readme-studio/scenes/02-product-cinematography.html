<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OctaPDF — Product Cinematography</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #FAF7F2;
    }
    .progress-hairline {
      position: absolute; left: 42px; right: 42px; bottom: 20px; height: 1px;
      background: rgba(36, 30, 27, 0.12); pointer-events: none;
    }
    .progress-hairline-fill {
      height: 100%; width: 0%; background: #E8501C;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from '/scripts/readme-studio/vendor/three.module.js';
    import {
      initStudio,
      createCottonPaperMaterial,
      createEditorialCaptionLayer,
      clamp01,
      lerp,
      smoothstep,
      smootherstep,
      easeInOutQuint,
    } from '/scripts/readme-studio/scenes/studio-kit.js';

    const W = 1120;
    const H = 630;
    const studio = initStudio(null, {
      width: W,
      height: H,
      mode: 'light',
      fov: 28,
      camPos: [0, 0.36, 6.05],
      lookAt: [0, 0.04, 0],
      floorY: -1.26,
      shadowFrustum: 7.5,
      shadowOpacity: 0.16,
      fogDensity: 0.022,
    });
    const { renderer, scene, camera } = studio;

    const hud = createEditorialCaptionLayer(document.body, {
      mode: 'light',
      designWidth: W,
      designHeight: H,
      kicker: 'OCTAPDF 0.46.2  ·  LIVE WORKSPACE REEL',
    });

    const pTrack = document.createElement('div');
    pTrack.className = 'progress-hairline';
    const pFill = document.createElement('div');
    pFill.className = 'progress-hairline-fill';
    pTrack.appendChild(pFill);
    hud.root.appendChild(pTrack);

    // Subtle right-aligned Swiss spec tag inside hud.root
    const specEl = document.createElement('div');
    specEl.style.cssText = 'position:absolute;right:42px;top:30px;font-size:10px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#6E645D;';
    specEl.textContent = '2880×1800 CAPTURES · LOCAL-FIRST';
    hud.root.appendChild(specEl);

    // Texture loader
    const loader = new THREE.TextureLoader();
    const maxAniso = Math.min(16, renderer.capabilities.getMaxAnisotropy());
    function loadTex(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = maxAniso;
          tex.minFilter = THREE.LinearMipmapLinearFilter;
          tex.magFilter = THREE.LinearFilter;
          resolve(tex);
        }, undefined, reject);
      });
    }

    // Rounded-rectangle shape builder for crisp frameless card backing + shadow caster
    function createRoundedRectShape(w, h, r) {
      const s = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y);
      s.lineTo(x + w - r, y);
      s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r);
      s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h);
      s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r);
      s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }

    // SDF rounded-corner UI shader (crisp 1px border, zero chunky bezel, smooth opacity)
    function createUiScreenMaterial(tex, borderHex = '#DFD7CB') {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: true,
        uniforms: {
          uMap: { value: tex },
          uOpacity: { value: 1.0 },
          uRadius: { value: 0.026 },
          uAspect: { value: 16 / 10 },
          uBorderColor: { value: new THREE.Color(borderHex) },
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uMap;
          uniform float uOpacity;
          uniform float uRadius;
          uniform float uAspect;
          uniform vec3 uBorderColor;
          varying vec2 vUv;

          float roundedBoxSDF(vec2 p, vec2 b, float r) {
            vec2 q = abs(p) - b + r;
            return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
          }

          void main() {
            vec2 p = (vUv - 0.5) * vec2(uAspect, 1.0);
            vec2 halfSize = vec2(uAspect * 0.5, 0.5);
            float d = roundedBoxSDF(p, halfSize, uRadius);
            float aa = max(fwidth(d), 0.0012);
            float alpha = 1.0 - smoothstep(-aa, aa, d);
            if (alpha < 0.01) discard;

            float borderBand = 1.0 - smoothstep(0.0, aa * 1.8, abs(d + 0.0022));
            vec4 texel = texture2D(uMap, vUv);
            vec3 col = mix(texel.rgb, uBorderColor, borderBand * 0.85);
            gl_FragColor = vec4(col, alpha * uOpacity);
          }
        `,
      });
    }

    // Build sleek frameless rounded UI card
    function makeFramelessCard(w, h, cornerR = 0.095) {
      const group = new THREE.Group();
      const shape = createRoundedRectShape(w, h, cornerR);
      const bodyGeo = new THREE.ExtrudeGeometry(shape, {
        depth: 0.016,
        bevelEnabled: true,
        bevelThickness: 0.003,
        bevelSize: 0.003,
        bevelSegments: 3,
        curveSegments: 20,
      });
      bodyGeo.translate(0, 0, -0.016);
      const bodyMat = createCottonPaperMaterial({
        color: '#FFFFFF',
        roughness: 0.55,
        sheen: 0.25,
        bumpScale: 0.002,
      });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      const screenMat = createUiScreenMaterial(null, '#DDD5C9');
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(w, h), screenMat);
      screen.position.z = 0.004;
      group.add(screen);

      return { group, screenMat, bodyMat };
    }

    // Sleek macOS-style vector cursor (crisp arrow mesh)
    function makeVectorCursor() {
      const g = new THREE.Group();
      const s = new THREE.Shape();
      s.moveTo(0, 0);
      s.lineTo(0, -0.14);
      s.lineTo(0.036, -0.108);
      s.lineTo(0.064, -0.165);
      s.lineTo(0.086, -0.155);
      s.lineTo(0.058, -0.098);
      s.lineTo(0.102, -0.095);
      s.closePath();

      const borderGeo = new THREE.ShapeGeometry(s);
      const borderMesh = new THREE.Mesh(
        borderGeo,
        new THREE.MeshBasicMaterial({ color: '#FFFFFF', side: THREE.DoubleSide })
      );
      borderMesh.scale.set(1.16, 1.16, 1);
      borderMesh.position.set(-0.006, 0.008, 0.001);
      g.add(borderMesh);

      const fillMesh = new THREE.Mesh(
        new THREE.ShapeGeometry(s),
        new THREE.MeshBasicMaterial({ color: '#1F1C19', side: THREE.DoubleSide })
      );
      fillMesh.position.z = 0.003;
      g.add(fillMesh);

      // Subtle terracotta click-pulse ring
      const ringMat = new THREE.MeshBasicMaterial({
        color: '#E8501C', transparent: true, opacity: 0.0, side: THREE.DoubleSide
      });
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.045, 0.065, 32), ringMat);
      ring.position.set(0.01, -0.01, 0.002);
      g.add(ring);

      return { group: g, ring, ringMat };
    }

    const CARD_W = 3.52;
    const CARD_H = 2.20;

    const cardHome = makeFramelessCard(CARD_W, CARD_H);
    const cardMulti = makeFramelessCard(CARD_W, CARD_H);
    const cardSign = makeFramelessCard(CARD_W, CARD_H);

    // Floating Command Palette overlay layer on cardHome (clean full-card cross-reveal, zero moire)
    const paletteMat = createUiScreenMaterial(null, '#DDD5C9');
    const palettePlane = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), paletteMat);
    const paletteGroup = new THREE.Group();
    paletteGroup.add(palettePlane);
    paletteGroup.position.set(0, 0, 0.012);
    cardHome.group.add(paletteGroup);

    scene.add(cardHome.group);
    scene.add(cardMulti.group);
    scene.add(cardSign.group);

    const cursor = makeVectorCursor();
    scene.add(cursor.group);

    // Load real screenshots & sampled sequence frames
    const multiIndices = [];
    for (let k = 0; k < 25; k++) multiIndices.push(Math.round((k / 24) * 48));
    const signIndices = [];
    for (let k = 0; k < 25; k++) signIndices.push(Math.round((k / 24) * 47));

    const [homeTex, paletteTex, ...seqTex] = await Promise.all([
      loadTex('/assets/readme/captures/home-light.png'),
      loadTex('/assets/readme/captures/palette-light.png'),
      ...multiIndices.map((idx) => loadTex(`/scripts/readme-studio/captures_seq/seq_multitool/frame_${String(idx).padStart(3, '0')}.png`)),
      ...signIndices.map((idx) => loadTex(`/scripts/readme-studio/captures_seq/seq_sign_theme/frame_${String(idx).padStart(3, '0')}.png`)),
    ]);

    const multiTextures = seqTex.slice(0, multiIndices.length);
    const signTextures = seqTex.slice(multiIndices.length);

    cardHome.screenMat.uniforms.uMap.value = homeTex;
    paletteMat.uniforms.uMap.value = paletteTex;
    cardMulti.screenMat.uniforms.uMap.value = multiTextures[0];
    cardSign.screenMat.uniforms.uMap.value = signTextures[0];

    window.renderFrame = function renderFrame(i, totalFrames, t) {
      // Seamless 3-phase keynote carousel across t in [0, 1):
      // Phase 1 (0.00 .. 0.34): Home glides from subtle 6° keynote tilt -> crisp 0° -> Command Palette opens cleanly
      // Phase 2 (0.34 .. 0.67): Smooth spring slide to Multi-Tool (real 4-page PDF rotating & reordering + vector cursor)
      // Phase 3 (0.67 .. 1.00): Smooth spring slide to Sign & Live Light->Dark toggle -> serene slide back to Home

      const t12 = easeInOutQuint(clamp01((t - 0.25) / 0.065));
      const t23 = easeInOutQuint(clamp01((t - 0.59) / 0.065));
      const t31 = easeInOutQuint(clamp01((t - 0.92) / 0.075));

      // World X conveyor offset: 0 (Home) -> -4.8 (Multi-Tool) -> -9.6 (Sign) -> -14.4 wraps cleanly to 0!
      const posX = lerp(0, -4.8, t12) + lerp(0, -4.8, t23) + lerp(0, -4.8, t31);

      // Position cards cleanly in periodic carousel slots
      const homeSlotX = (t > 0.78) ? 14.4 : 0.0;
      cardHome.group.position.set(homeSlotX + posX, Math.sin(t * Math.PI * 2) * 0.02, 0);
      cardMulti.group.position.set(4.8 + posX, Math.sin(t * Math.PI * 2 + 1.0) * 0.02, 0);
      cardSign.group.position.set(9.6 + posX, Math.sin(t * Math.PI * 2 + 2.0) * 0.02, 0);

      // Keynote 6° entrance tilt settling smoothly to flat 1:1 legibility on the active card
      const homeTilt = Math.sin(clamp01(t / 0.10) * Math.PI) * -0.105 * (1 - smoothstep((t - 0.05) / 0.06));
      const homeOutTilt = t31 > 0 ? (1 - t31) * -0.09 : 0;
      cardHome.group.rotation.y = homeTilt + homeOutTilt;
      cardHome.group.rotation.x = 0.025 * (1 - smoothstep((t - 0.04) / 0.06));

      cardMulti.group.rotation.y = clamp01((cardMulti.group.position.x) * -0.04);
      cardSign.group.rotation.y = clamp01((cardSign.group.position.x) * -0.04);

      // Command Palette reveal on Home (0.08 .. 0.25)
      const palIn = smoothstep((t - 0.07) / 0.05);
      const palOut = 1 - smoothstep((t - 0.22) / 0.04);
      const palAlpha = palIn * palOut;
      paletteGroup.visible = palAlpha > 0.01;
      paletteGroup.position.z = 0.010 + palAlpha * 0.015;
      paletteMat.uniforms.uOpacity.value = palAlpha;

      // Multi-Tool live frame stream (0.30 .. 0.61)
      const mNorm = clamp01((t - 0.30) / 0.30);
      const mIdx = Math.min(multiTextures.length - 1, Math.floor(mNorm * (multiTextures.length - 1)));
      if (cardMulti.screenMat.uniforms.uMap.value !== multiTextures[mIdx]) {
        cardMulti.screenMat.uniforms.uMap.value = multiTextures[mIdx];
      }

      // Sign + Dark Mode live frame stream (0.64 .. 0.93)
      const sNorm = clamp01((t - 0.64) / 0.28);
      const sIdx = Math.min(signTextures.length - 1, Math.floor(sNorm * (signTextures.length - 1)));
      if (cardSign.screenMat.uniforms.uMap.value !== signTextures[sIdx]) {
        cardSign.screenMat.uniforms.uMap.value = signTextures[sIdx];
      }

      // Vector cursor choreography over active Multi-Tool & Sign cards
      cursor.group.visible = false;
      cursor.ringMat.opacity = 0;

      if (t >= 0.09 && t <= 0.24) {
        cursor.group.visible = true;
        const cu = smoothstep((t - 0.10) / 0.12);
        cursor.group.position.set(
          cardHome.group.position.x + lerp(0.55, -0.18, cu),
          lerp(-0.35, 0.32, cu),
          0.16
        );
      } else if (t >= 0.32 && t <= 0.59) {
        cursor.group.visible = true;
        const u = clamp01((t - 0.32) / 0.27);
        const cx = cardMulti.group.position.x + (
          u < 0.35 ? lerp(0.65, -0.45, smoothstep(u / 0.35)) :
          u < 0.70 ? lerp(-0.45, 0.08, smoothstep((u - 0.35) / 0.35)) :
          lerp(0.08, 0.74, smoothstep((u - 0.70) / 0.30))
        );
        const cy = (
          u < 0.35 ? lerp(0.15, -0.68, smoothstep(u / 0.35)) :
          u < 0.70 ? lerp(-0.68, -0.25, smoothstep((u - 0.35) / 0.35)) :
          lerp(-0.25, -0.78, smoothstep((u - 0.70) / 0.30))
        );
        cursor.group.position.set(cx, cy, 0.16);
        const clickA = Math.exp(-Math.pow((u - 0.34) * 18, 2));
        const clickB = Math.exp(-Math.pow((u - 0.68) * 18, 2));
        const pulse = Math.max(clickA, clickB);
        cursor.ringMat.opacity = pulse * 0.75;
        cursor.ring.scale.setScalar(0.8 + (1 - pulse) * 1.1);
      } else if (t >= 0.65 && t <= 0.91) {
        cursor.group.visible = true;
        const u = clamp01((t - 0.65) / 0.26);
        const cx = cardSign.group.position.x + lerp(-0.25, 1.14, smoothstep(clamp01((u - 0.35) / 0.35)));
        const cy = lerp(-0.10, 1.02, smoothstep(clamp01((u - 0.35) / 0.35)));
        cursor.group.position.set(cx, cy, 0.16);
        const pulse = Math.exp(-Math.pow((u - 0.72) * 16, 2));
        cursor.ringMat.opacity = pulse * 0.80;
        cursor.ring.scale.setScalar(0.8 + (1 - pulse) * 1.1);
      }

      // Gentle camera dolly breathing
      camera.position.set(
        Math.sin(t * Math.PI * 2) * 0.04,
        0.34 + Math.cos(t * Math.PI * 2) * 0.02,
        6.02 - Math.sin(t * Math.PI * 2) * 0.06
      );
      camera.lookAt(0, 0.04, 0);

      // Clean Swiss unboxed editorial caption locked to whichever card is centered
      if (posX > -2.4 || posX < -12.0) {
        hud.setCaption('01', palAlpha > 0.25 ? 'COMMAND PALETTE (⌘K)  ·  INSTANT WORKFLOW JUMP' : 'PAPER DESK HOME  ·  UNIVERSAL INTAKE DECK', 0.92);
      } else if (posX > -7.2) {
        hud.setCaption('02', 'MULTI-TOOL STUDIO  ·  REORDER, ROTATE & EXPORT', 0.92);
      } else {
        hud.setCaption('03', 'SIGN STUDIO  ·  FREEHAND SIGNATURE & LIVE DARK THEME', 0.92);
      }
      pFill.style.width = `${(t * 100).toFixed(2)}%`;

      renderer.render(scene, camera);
    };

    window.sceneReady = true;
  </script>
</body>
</html>
