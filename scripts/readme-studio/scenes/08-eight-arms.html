<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OctaPDF — Eight Arms, Endless Possibilities</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FAF7F2;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #FAF7F2;
    }
    .swiss-title-block {
      position: absolute;
      top: 52px;
      left: 42px;
    }
    .swiss-title {
      font-family: 'OctaEditorialSerif', Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: #241E1B;
      line-height: 1.1;
    }
    .swiss-sub {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #6E645D;
    }
    .swiss-index-item {
      position: absolute;
      display: flex;
      align-items: baseline;
      gap: 9px;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(36, 30, 27, 0.14);
      transform: translateY(-50%);
      white-space: nowrap;
    }
    .swiss-index-item.left {
      left: 42px;
      width: 176px;
    }
    .swiss-index-item.right {
      right: 42px;
      width: 176px;
      justify-content: flex-end;
      flex-direction: row-reverse;
    }
    .swiss-index-item .num {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #E8501C;
    }
    .swiss-index-item .lbl {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #241E1B;
    }
    svg.swiss-leaders {
      position: absolute;
      inset: 0;
      width: 1120px;
      height: 560px;
      pointer-events: none;
    }
    .swiss-footer-right {
      position: absolute;
      right: 42px;
      bottom: 30px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6E645D;
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <script type="module">
    import * as THREE from '/scripts/readme-studio/vendor/three.module.js';
    import {
      initStudio,
      createCottonPaperMaterial,
      createEditorialCaptionLayer
    } from '/scripts/readme-studio/scenes/studio-kit.js';

    const W = 1120;
    const H = 560;
    const stage = document.getElementById('stage');

    const { renderer, scene, camera, lights } = initStudio(stage, {
      width: W,
      height: H,
      mode: 'light',
      fov: 30,
      camPos: [0, 5.75, 10.15],
      lookAt: [0, 0.42, 0.12],
      floorY: -0.45,
      fogDensity: 0.022,
      shadowFrustum: 5.8,
      shadowOpacity: 0.24
    });
    // Raking architectural side-key so pleated paper facets separate boldly in light & shadow
    lights.key.position.set(6.4, 4.4, 3.2);
    lights.key.intensity = 1.65;
    lights.hemi.intensity = 0.52;
    lights.fill.intensity = 0.30;
    lights.rim.intensity = 0.65;

    const hud = createEditorialCaptionLayer(stage, {
      mode: 'light',
      designWidth: W,
      designHeight: H,
      kicker: 'OCTAPDF · KINETIC PAPER ARCHITECTURE',
      corners: true
    });
    hud.setCaption('08', 'Eight Articulated Origami Blades', 0.85);

    const titleBlock = document.createElement('div');
    titleBlock.className = 'swiss-title-block';
    titleBlock.innerHTML = `
      <div class="swiss-title">Eight Arms, Endless Possibilities</div>
      <div class="swiss-sub">Pleated cotton-rag sculpture · Eight verified local capabilities</div>
    `;
    hud.root.appendChild(titleBlock);

    const footerRight = document.createElement('div');
    footerRight.className = 'swiss-footer-right';
    footerRight.textContent = '100% LOCAL · ZERO TELEMETRY';
    hud.root.appendChild(footerRight);

    const leadersSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    leadersSvg.setAttribute('class', 'swiss-leaders');
    leadersSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    hud.root.appendChild(leadersSvg);

    // Subtle concentric studio datum rings on floor
    const floorDatumMat = new THREE.MeshBasicMaterial({
      color: '#D7CCC0',
      transparent: true,
      opacity: 0.45
    });
    for (const r of [1.45, 2.55, 3.65]) {
      const ring = new THREE.Mesh(new THREE.RingGeometry(r - 0.008, r + 0.008, 120), floorDatumMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = -0.446;
      scene.add(ring);
    }

    // Finely faceted matte-ceramic central hub (LatheGeometry spun ceramic silhouette)
    const hubGroup = new THREE.Group();
    scene.add(hubGroup);

    const ceramicMat = createCottonPaperMaterial({
      color: '#FFFFFF',
      roughness: 0.62,
      sheen: 0.25,
      bumpScale: 0.004,
      side: THREE.FrontSide
    });
    const warmStoneMat = createCottonPaperMaterial({
      color: '#EFE7DC',
      roughness: 0.72,
      sheen: 0.2,
      bumpScale: 0.005,
      side: THREE.FrontSide
    });
    const terracottaMat = createCottonPaperMaterial({
      color: '#E8501C',
      roughness: 0.52,
      sheen: 0.45,
      sheenColor: '#FF9E7A',
      bumpScale: 0.005,
      side: THREE.FrontSide
    });
    const graphiteMat = new THREE.MeshPhysicalMaterial({
      color: '#241E1B',
      roughness: 0.44,
      metalness: 0.12,
      clearcoat: 0.15
    });

    const plinthProfile = [
      new THREE.Vector2(0.0, -0.44),
      new THREE.Vector2(1.18, -0.44),
      new THREE.Vector2(1.18, -0.32),
      new THREE.Vector2(0.96, -0.24),
      new THREE.Vector2(0.96, -0.08),
      new THREE.Vector2(0.84, 0.02),
      new THREE.Vector2(0.84, 0.16),
      new THREE.Vector2(0.58, 0.28),
      new THREE.Vector2(0.0, 0.28)
    ];
    const plinthGeo = new THREE.LatheGeometry(plinthProfile, 16);
    const plinth = new THREE.Mesh(plinthGeo, warmStoneMat);
    plinth.castShadow = true;
    plinth.receiveShadow = true;
    hubGroup.add(plinth);

    const collarRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.87, 0.022, 16, 64),
      terracottaMat
    );
    collarRing.rotation.x = Math.PI / 2;
    collarRing.position.y = 0.04;
    collarRing.castShadow = true;
    hubGroup.add(collarRing);

    // Sculpted folded-vellum central lantern (nested smooth origami petals)
    const crownGroup = new THREE.Group();
    crownGroup.position.y = 0.62;
    hubGroup.add(crownGroup);

    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2 + Math.PI / 8;
      const petalGeo = new THREE.ConeGeometry(0.16, 0.68, 4, 1);
      const petal = new THREE.Mesh(petalGeo, k % 2 === 0 ? ceramicMat : warmStoneMat);
      petal.position.set(Math.cos(a) * 0.24, 0.05, Math.sin(a) * 0.24);
      petal.rotation.z = -Math.cos(a) * 0.34;
      petal.rotation.x = Math.sin(a) * 0.34;
      petal.rotation.y = -a;
      petal.castShadow = true;
      crownGroup.add(petal);
    }

    const coreEmber = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.19, 0),
      new THREE.MeshPhysicalMaterial({
        color: '#E8501C',
        emissive: '#E8501C',
        emissiveIntensity: 0.42,
        roughness: 0.3,
        clearcoat: 0.4
      })
    );
    coreEmber.position.y = 0.12;
    crownGroup.add(coreEmber);

    const coreLight = new THREE.PointLight('#FF7A45', 1.1, 4.5, 1.8);
    coreLight.position.set(0, 0.78, 0);
    scene.add(coreLight);

    // Eight capability pillars — stratified elevations prevent any crossing leader ticks
    const SLOT_TIP_Y = [1.42, 1.04, 0.64, 0.24];
    const PILLARS = [
      { num: '01', name: 'Assemble',          angleDeg: -138, side: 'left',  slotIdx: 0 },
      { num: '02', name: 'Split & Extract',   angleDeg: -163, side: 'left',  slotIdx: 1 },
      { num: '03', name: 'Sign & Stamp',      angleDeg: 162,  side: 'left',  slotIdx: 2 },
      { num: '04', name: 'View & Annotate',   angleDeg: 132,  side: 'left',  slotIdx: 3 },
      { num: '05', name: 'Secure & Sanitize', angleDeg: -42,  side: 'right', slotIdx: 0 },
      { num: '06', name: 'Compress & Repair', angleDeg: -17,  side: 'right', slotIdx: 1 },
      { num: '07', name: 'OCR & Enhance',     angleDeg: 18,   side: 'right', slotIdx: 2 },
      { num: '08', name: 'Convert & Export',  angleDeg: 48,   side: 'right', slotIdx: 3 }
    ];

    // Two-sided origami pleated W/M-blade geometry (5 verts across width x 48 stations)
    // flatShading: true gives crisp Matthew Shlian architectural paper crease facets!
    const STATIONS = 48;
    const CROSS_VERTS = 5;

    const bladeParchmentMat = createCottonPaperMaterial({
      color: '#EAE0D0',
      roughness: 0.88,
      sheen: 0.35,
      envMapIntensity: 0.25,
      vertexColors: true,
      flatShading: true,
      side: THREE.FrontSide
    });
    const bladeParchmentUnderMat = createCottonPaperMaterial({
      color: '#DF4E1B',
      roughness: 0.58,
      sheen: 0.40,
      sheenColor: '#FF9E7A',
      envMapIntensity: 0.30,
      vertexColors: true,
      flatShading: true,
      side: THREE.BackSide
    });
    const bladeTerraMat = createCottonPaperMaterial({
      color: '#E3521E',
      roughness: 0.62,
      sheen: 0.42,
      sheenColor: '#FF9E7A',
      envMapIntensity: 0.28,
      vertexColors: true,
      flatShading: true,
      side: THREE.FrontSide
    });
    const bladeTerraUnderMat = createCottonPaperMaterial({
      color: '#EFE5D7',
      roughness: 0.84,
      sheen: 0.30,
      envMapIntensity: 0.25,
      vertexColors: true,
      flatShading: true,
      side: THREE.BackSide
    });

    function buildPleatedBladePair(isTerracottaTop) {
      const vertCount = (STATIONS + 1) * CROSS_VERTS;
      const positions = new Float32Array(vertCount * 3);
      const colors = new Float32Array(vertCount * 3);
      const uvs = new Float32Array(vertCount * 2);
      const indices = [];

      for (let s = 0; s < STATIONS; s++) {
        const a = s * CROSS_VERTS;
        const b = (s + 1) * CROSS_VERTS;
        for (let k = 0; k < CROSS_VERTS - 1; k++) {
          indices.push(a + k, a + k + 1, b + k);
          indices.push(a + k + 1, b + k + 1, b + k);
        }
      }
      for (let s = 0; s <= STATIONS; s++) {
        const u = s / STATIONS;
        for (let k = 0; k < CROSS_VERTS; k++) {
          const idx = (s * CROSS_VERTS + k) * 2;
          uvs[idx] = u;
          uvs[idx + 1] = k / (CROSS_VERTS - 1);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geo.setIndex(indices);

      const topMesh = new THREE.Mesh(geo, isTerracottaTop ? bladeTerraMat : bladeParchmentMat);
      topMesh.castShadow = true;
      topMesh.receiveShadow = true;

      const underMesh = new THREE.Mesh(geo, isTerracottaTop ? bladeTerraUnderMat : bladeParchmentUnderMat);
      underMesh.castShadow = true;
      underMesh.receiveShadow = true;

      const ridgePositions = new Float32Array((STATIONS + 1) * 3);
      const ridgeGeo = new THREE.BufferGeometry();
      ridgeGeo.setAttribute('position', new THREE.BufferAttribute(ridgePositions, 3));
      const ridgeLine = new THREE.Line(
        ridgeGeo,
        new THREE.LineBasicMaterial({
          color: isTerracottaTop ? '#FFF4E8' : '#241E1B',
          transparent: true,
          opacity: isTerracottaTop ? 0.35 : 0.22
        })
      );

      const group = new THREE.Group();
      group.add(topMesh, underMesh, ridgeLine);
      return { group, geo, ridgeGeo };
    }

    const arms = PILLARS.map((pillar, idx) => {
      const isTerraTop = idx % 2 === 0;
      const baseAngle = THREE.MathUtils.degToRad(pillar.angleDeg);
      const anchorPin = new THREE.Mesh(
        new THREE.BoxGeometry(0.11, 0.08, 0.16),
        isTerraTop ? terracottaMat : graphiteMat
      );
      anchorPin.position.set(Math.cos(baseAngle) * 0.84, 0.15, Math.sin(baseAngle) * 0.84);
      anchorPin.rotation.y = -baseAngle + Math.PI / 2;
      anchorPin.castShadow = true;
      hubGroup.add(anchorPin);

      const { group, geo, ridgeGeo } = buildPleatedBladePair(isTerraTop);
      scene.add(group);

      const finial = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.088, 0),
        isTerraTop ? graphiteMat : terracottaMat
      );
      finial.scale.set(1.3, 0.55, 0.85);
      finial.castShadow = true;
      scene.add(finial);

      return {
        pillar,
        idx,
        baseAngle,
        geo,
        ridgeGeo,
        finial,
        tipWorld: new THREE.Vector3()
      };
    });

    const leftSlotsY = [148, 238, 330, 422];
    const rightSlotsY = [148, 238, 330, 422];

    const hudItems = arms.map((arm) => {
      const item = document.createElement('div');
      item.className = `swiss-index-item ${arm.pillar.side}`;
      item.style.top = `${arm.pillar.side === 'left' ? leftSlotsY[arm.pillar.slotIdx] : rightSlotsY[arm.pillar.slotIdx]}px`;
      item.innerHTML = `<span class="num">${arm.pillar.num}</span><span class="lbl">${arm.pillar.name}</span>`;
      hud.root.appendChild(item);

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', 'rgba(36, 30, 27, 0.28)');
      line.setAttribute('stroke-width', '1');
      leadersSvg.appendChild(line);

      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('r', '2.5');
      dot.setAttribute('fill', '#E8501C');
      leadersSvg.appendChild(dot);

      return { arm, item, line, dot };
    });

    const upVec = new THREE.Vector3(0, 1, 0);
    const tanVec = new THREE.Vector3();
    const sideVec = new THREE.Vector3();
    const normVec = new THREE.Vector3();

    function updateArm(arm, loopAngle) {
      const phase = loopAngle - arm.idx * (Math.PI / 4);
      const waveA = Math.sin(phase);
      const waveB = Math.cos(phase);
      const ripple = Math.sin(loopAngle * 2 - arm.idx * (Math.PI / 2));

      const dirX = Math.cos(arm.baseAngle);
      const dirZ = Math.sin(arm.baseAngle);
      const latX = -dirZ;
      const latZ = dirX;

      const tipY = SLOT_TIP_Y[arm.pillar.slotIdx];
      const reach = 2.90 + waveB * 0.12;
      const xScale = 1.14;
      const zScale = 0.70;

      const pts = [
        new THREE.Vector3(dirX * 0.84, 0.18, dirZ * 0.84),
        new THREE.Vector3(
          dirX * 1.42 * xScale + latX * waveA * 0.10,
          0.42 + (tipY - 0.42) * 0.24 + waveA * 0.14,
          dirZ * 1.42 * zScale + latZ * waveA * 0.08
        ),
        new THREE.Vector3(
          dirX * 2.12 * xScale - latX * waveB * 0.14,
          0.62 + (tipY - 0.62) * 0.56 + waveB * 0.16 + ripple * 0.04,
          dirZ * 2.12 * zScale - latZ * waveB * 0.10
        ),
        new THREE.Vector3(
          dirX * 2.74 * xScale + latX * waveA * 0.10,
          tipY - 0.08 + waveA * 0.12,
          dirZ * 2.74 * zScale + latZ * waveA * 0.08
        ),
        new THREE.Vector3(
          dirX * reach * xScale,
          tipY + waveB * 0.10,
          dirZ * reach * zScale
        )
      ];

      const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
      const pos = arm.geo.attributes.position;
      const col = arm.geo.attributes.color;

      for (let s = 0; s <= STATIONS; s++) {
        const u = s / STATIONS;
        const p = curve.getPoint(u);
        curve.getTangent(u, tanVec).normalize();

        sideVec.crossVectors(tanVec, upVec);
        if (sideVec.lengthSq() < 1e-4) sideVec.set(latX, 0, latZ);
        sideVec.normalize();
        normVec.crossVectors(sideVec, tanVec).normalize();

        const fanEnv = Math.sin(Math.pow(u, 0.78) * Math.PI * 0.90 + 0.16);
        const halfW = (0.14 + 0.34 * fanEnv) * (1.0 - 0.30 * u);
        const pleatH = halfW * 0.44 * (0.45 + 0.55 * Math.sin(u * Math.PI));
        const roll = Math.sin(u * Math.PI * 1.25 + phase) * 0.36;

        const cosR = Math.cos(roll);
        const sinR = Math.sin(roll);
        const sx = sideVec.x * cosR + normVec.x * sinR;
        const sy = sideVec.y * cosR + normVec.y * sinR;
        const sz = sideVec.z * cosR + normVec.z * sinR;
        const nx = normVec.x * cosR - sideVec.x * sinR;
        const ny = normVec.y * cosR - sideVec.y * sinR;
        const nz = normVec.z * cosR - sideVec.z * sinR;

        const profile = [
          [-1.0,  0.34, 0.92],
          [-0.48, -0.62, 0.62],
          [ 0.0,  0.98, 1.00],
          [ 0.48, -0.62, 0.62],
          [ 1.0,  0.34, 0.92]
        ];
        const b = s * CROSS_VERTS;
        for (let k = 0; k < CROSS_VERTS; k++) {
          const [wx, hy, ao] = profile[k];
          const px = p.x + sx * (wx * halfW) + nx * (hy * pleatH);
          const py = p.y + sy * (wx * halfW) + ny * (hy * pleatH);
          const pz = p.z + sz * (wx * halfW) + nz * (hy * pleatH);
          pos.setXYZ(b + k, px, py, pz);
          col.setXYZ(b + k, ao, ao * 0.985, ao * 0.965);
          if (k === 2) {
            arm.ridgeGeo.attributes.position.setXYZ(s, px + nx * 0.004, py + ny * 0.004, pz + nz * 0.004);
          }
        }
      }

      pos.needsUpdate = true;
      col.needsUpdate = true;
      arm.ridgeGeo.attributes.position.needsUpdate = true;
      arm.geo.computeVertexNormals();

      const tipPt = curve.getPoint(1.0);
      const tipTan = curve.getTangent(1.0).normalize();
      arm.finial.position.copy(tipPt).addScaledVector(tipTan, 0.14);
      arm.finial.rotation.y = -arm.baseAngle + loopAngle;
      arm.tipWorld.copy(arm.finial.position);
    }

    window.renderFrame = function renderFrame(i, totalFrames, t) {
      const loopAngle = t * Math.PI * 2;

      crownGroup.position.y = 0.62 + Math.sin(loopAngle) * 0.05;
      crownGroup.rotation.y = loopAngle * 0.25; // 90 deg = 2/8 petals -> seamless
      coreEmber.rotation.y = -loopAngle;
      coreLight.intensity = 1.0 + 0.28 * Math.sin(loopAngle);

      for (const arm of arms) {
        updateArm(arm, loopAngle);
      }

      renderer.render(scene, camera);

      for (const h of hudItems) {
        const p = h.arm.tipWorld.clone().project(camera);
        const sx = (p.x * 0.5 + 0.5) * W;
        const sy = (-p.y * 0.5 + 0.5) * H;
        const isLeft = h.arm.pillar.side === 'left';
        const anchorX = isLeft ? 218 : W - 218;
        const anchorY = isLeft ? leftSlotsY[h.arm.pillar.slotIdx] : rightSlotsY[h.arm.pillar.slotIdx];
        const elbowX = isLeft ? Math.min(sx - 18, anchorX + 28) : Math.max(sx + 18, anchorX - 28);

        h.line.setAttribute('points', `${sx.toFixed(1)},${sy.toFixed(1)} ${elbowX.toFixed(1)},${anchorY} ${anchorX},${anchorY}`);
        h.dot.setAttribute('cx', sx.toFixed(1));
        h.dot.setAttribute('cy', sy.toFixed(1));
      }
    };

    window.renderFrame(0, 240, 0);
  </script>
</body>
</html>
