<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OctaPDF — The Final Fold</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141210;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .gallery-vignette {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 160px;
      background: linear-gradient(to top, rgba(20, 18, 16, 0.94) 0%, rgba(20, 18, 16, 0.65) 55%, rgba(20, 18, 16, 0) 100%);
      pointer-events: none;
    }
    .finale-statement {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 30px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(0, 14px, 0);
    }
    .statement-line {
      font-family: 'OctaEditorialSerif', 'Georgia', serif;
      font-size: 27px;
      line-height: 1.3;
      letter-spacing: 0.015em;
      color: #F5EFE6;
      margin: 0 0 10px 0;
    }
    .statement-line em {
      font-style: normal;
      color: #FF6B35;
    }
    .statement-rule {
      height: 1.5px;
      width: 0px;
      margin: 0 auto 10px auto;
      background: linear-gradient(90deg, rgba(255, 107, 53, 0), #FF6B35, rgba(255, 107, 53, 0));
    }
    .statement-colophon {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #A89E94;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <script type="module">
    import * as THREE from '/scripts/readme-studio/vendor/three.module.js';
    import {
      initStudio,
      createCottonPaperMaterial,
      createEditorialCaptionLayer,
      foldPlaneGeometry,
      clamp01,
      lerp,
      smootherstep,
      band,
      easeOutExpo,
      springDamped
    } from '/scripts/readme-studio/scenes/studio-kit.js';

    const DESIGN_W = 1120;
    const DESIGN_H = 520;
    const stage = document.getElementById('stage');

    const studio = initStudio(stage, {
      width: DESIGN_W,
      height: DESIGN_H,
      mode: 'dark',
      background: '#141210',
      fov: 32,
      camPos: [0, 2.45, 6.65],
      lookAt: [0, 0.38, 0],
      exposure: 1.06,
      floorY: -0.94,
      shadowOpacity: 0.58,
      fogDensity: 0.042
    });
    const { renderer, scene, camera, lights } = studio;
    lights.rim.intensity = 0.75;

    // Dramatic warm gallery overhead spotlight + subtle terracotta raking edge light
    const gallerySpot = new THREE.SpotLight('#FFF4E6', 38, 20, Math.PI / 5.4, 0.76, 1.45);
    gallerySpot.position.set(1.6, 6.4, 4.0);
    gallerySpot.castShadow = true;
    gallerySpot.shadow.mapSize.set(2048, 2048);
    gallerySpot.shadow.radius = 4;
    gallerySpot.shadow.bias = -0.00035;
    const spotTarget = new THREE.Object3D();
    spotTarget.position.set(0, 0.48, 0);
    scene.add(spotTarget);
    gallerySpot.target = spotTarget;
    scene.add(gallerySpot);

    const rakingLight = new THREE.PointLight('#FF6B35', 1.2, 6.2, 1.8);
    rakingLight.position.set(-2.6, 1.2, 1.8);
    scene.add(rakingLight);

    // Subtle museum floor measurement hairlines (ultra-restrained obsidian plinth ring)
    const floorRingMat = new THREE.MeshBasicMaterial({
      color: '#FF6B35',
      transparent: true,
      opacity: 0.14
    });
    const floorRing = new THREE.Mesh(new THREE.RingGeometry(2.38, 2.395, 96), floorRingMat);
    floorRing.rotation.x = -Math.PI / 2;
    floorRing.position.y = -0.916;
    scene.add(floorRing);

    const outerRingMat = new THREE.MeshBasicMaterial({
      color: '#F5EFE6',
      transparent: true,
      opacity: 0.07
    });
    const outerRing = new THREE.Mesh(new THREE.RingGeometry(3.45, 3.462, 96), outerRingMat);
    outerRing.rotation.x = -Math.PI / 2;
    outerRing.position.y = -0.916;
    scene.add(outerRing);

    // Unboxed Swiss Gallery HUD
    const hud = createEditorialCaptionLayer(stage, {
      mode: 'dark',
      designWidth: DESIGN_W,
      designHeight: DESIGN_H,
      kicker: 'PROJECT ORIGAMI  ·  CLOSING EXHIBITION',
      corners: true
    });

    const vig = document.createElement('div');
    vig.className = 'gallery-vignette';
    hud.root.appendChild(vig);

    const stmtEl = document.createElement('div');
    stmtEl.className = 'finale-statement';
    stmtEl.innerHTML = `
      <p class="statement-line">Paper, precision, and control <em>&mdash;</em> entirely yours.</p>
      <div class="statement-rule" id="stmtRule"></div>
      <p class="statement-colophon">LOCAL-FIRST &nbsp;&middot;&nbsp; ZERO TELEMETRY &nbsp;&middot;&nbsp; MIT OPEN SOURCE</p>
    `;
    hud.root.appendChild(stmtEl);
    const stmtRuleEl = stmtEl.querySelector('#stmtRule');

    // =========================================================================
    // 1. Stepped Obsidian & Warm-Ivory Cardstock Monolith Pedestal
    // =========================================================================
    const plinthGroup = new THREE.Group();
    plinthGroup.position.set(0, -0.84, 0);
    scene.add(plinthGroup);

    const strataSpecs = [
      { r: 2.05, h: 0.07, color: '#1F1C19', y: 0.0 },
      { r: 1.82, h: 0.035, color: '#F5EFE6', y: 0.055 },
      { r: 1.66, h: 0.08, color: '#27221E', y: 0.115 },
      { r: 1.48, h: 0.025, color: '#E8501C', y: 0.17 },
      { r: 1.36, h: 0.08, color: '#1F1C19', y: 0.225 }
    ];
    const strata = strataSpecs.map((sp) => {
      const m = new THREE.Mesh(
        new THREE.CylinderGeometry(sp.r, sp.r * 1.02, sp.h, 8),
        createCottonPaperMaterial({
          color: sp.color,
          roughness: sp.color === '#E8501C' ? 0.42 : 0.78,
          sheen: 0.35,
          sheenColor: sp.color === '#F5EFE6' ? '#FFFDF9' : '#FF6B35'
        })
      );
      m.rotation.y = Math.PI / 8;
      m.position.y = sp.y;
      m.castShadow = true;
      m.receiveShadow = true;
      plinthGroup.add(m);
      return { mesh: m, spec: sp };
    });

    // =========================================================================
    // 2. Deep-Embossed Obsidian Cardstock Monolith + Raking Edge-Light Shader
    // =========================================================================
    const monolithGroup = new THREE.Group();
    monolithGroup.position.set(0, 0.78, 0);
    scene.add(monolithGroup);

    const octShape = new THREE.Shape();
    const R = 1.18;
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2 + Math.PI / 8;
      const x = Math.cos(a) * R;
      const y = Math.sin(a) * R;
      if (k === 0) octShape.moveTo(x, y);
      else octShape.lineTo(x, y);
    }
    octShape.closePath();

    const monoGeo = new THREE.ExtrudeGeometry(octShape, {
      depth: 0.14,
      bevelEnabled: true,
      bevelThickness: 0.028,
      bevelSize: 0.028,
      bevelSegments: 4
    });
    monoGeo.center();

    const monoMat = createCottonPaperMaterial({
      color: '#191614',
      roughness: 0.76,
      sheen: 0.35,
      sheenColor: '#FF6B35',
      bumpScale: 0.01
    });
    const monoBody = new THREE.Mesh(monoGeo, monoMat);
    monoBody.castShadow = true;
    monoBody.receiveShadow = true;
    monolithGroup.add(monoBody);

    // Fine warm terracotta chamfer perimeter ring
    const chamferMat = new THREE.MeshBasicMaterial({
      color: '#FF6B35',
      transparent: true,
      opacity: 0.72
    });
    const chamfer = new THREE.Mesh(new THREE.RingGeometry(1.01, 1.026, 8), chamferMat);
    chamfer.rotation.z = Math.PI / 8;
    chamfer.position.z = 0.102;
    monolithGroup.add(chamfer);

    // Custom GLSL Embossed Dark-Lockup Shader combining octapdf-lockup-dark-alpha.png + octapdf-emblem-normal.png
    let sealMat = null;
    function loadTex(url, srgb = false) {
      return new Promise((resolve, reject) => {
        new THREE.TextureLoader().load(
          url,
          (t) => {
            t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
            t.anisotropy = 8;
            resolve(t);
          },
          undefined,
          reject
        );
      });
    }

    window.sceneReady = Promise.all([
      loadTex('/scripts/readme-studio/assets/octapdf-lockup-dark-alpha.png', true),
      loadTex('/scripts/readme-studio/assets/octapdf-emblem-normal.png', false)
    ]).then(([lockupTex, normalTex]) => {
      sealMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          uLockup: { value: lockupTex },
          uNormal: { value: normalTex },
          uOpacity: { value: 0.0 },
          uRakeX: { value: -1.2 },
          uEmboss: { value: 1.0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uLockup;
          uniform sampler2D uNormal;
          uniform float uOpacity;
          uniform float uRakeX;
          uniform float uEmboss;
          varying vec2 vUv;

          void main() {
            vec4 col = texture2D(uLockup, vUv);
            if (col.a < 0.01) discard;

            // Map emblem normal onto upper portion of full lockup (emblem spans roughly y 0.25..0.88, x 0.20..0.78)
            vec2 embUv = vec2((vUv.x - 0.175) / 0.654, (vUv.y - 0.253) / 0.630);
            vec3 nMap = vec3(0.0, 0.0, 1.0);
            if (embUv.x >= 0.0 && embUv.x <= 1.0 && embUv.y >= 0.0 && embUv.y <= 1.0) {
              nMap = texture2D(uNormal, embUv).xyz * 2.0 - 1.0;
            }
            vec3 N = normalize(mix(vec3(0.0, 0.0, 1.0), nMap, uEmboss));

            // Raking warm spotlight across embossed surface
            vec3 L = normalize(vec3(uRakeX, 0.55, 0.52));
            float diff = max(dot(N, L), 0.0);
            vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
            float spec = pow(max(dot(N, H), 0.0), 22.0);
            float rim = pow(1.0 - max(N.z, 0.0), 2.0);

            vec3 lit = col.rgb * (0.82 + 0.34 * diff) + vec3(1.0, 0.42, 0.21) * (spec * 0.32 + rim * 0.24);
            gl_FragColor = vec4(lit, col.a * uOpacity);
          }
        `
      });

      const sealMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.62, 1.62), sealMat);
      sealMesh.position.set(0, -0.02, 0.106);
      monolithGroup.add(sealMesh);
    });

    // =========================================================================
    // 3. Eight Monumental Curved Matte-Charcoal & Warm-Ivory Paper Wings
    // =========================================================================
    const wingsGroup = new THREE.Group();
    wingsGroup.position.set(0, 0.16, -0.18);
    scene.add(wingsGroup);

    const wings = [];
    for (let i = 0; i < 8; i++) {
      const isCharcoal = i % 2 === 0;
      const wFold = foldPlaneGeometry(1.18, 2.15, 44, 60);

      const frontMat = createCottonPaperMaterial({
        color: isCharcoal ? '#221D1A' : '#F2ECE2',
        vertexColors: true,
        roughness: isCharcoal ? 0.78 : 0.88,
        sheen: 0.42,
        sheenColor: isCharcoal ? '#FF6B35' : '#FFFDF9',
        bumpScale: 0.009,
        side: THREE.FrontSide
      });
      const backMat = createCottonPaperMaterial({
        color: isCharcoal ? '#161311' : '#D54918',
        vertexColors: true,
        roughness: 0.80,
        sheen: 0.35,
        sheenColor: '#FF6B35',
        side: THREE.BackSide
      });

      const pivot = new THREE.Group();
      const mFront = new THREE.Mesh(wFold.geometry, frontMat);
      const mBack = new THREE.Mesh(wFold.geometry, backMat);
      mFront.castShadow = true;
      mFront.receiveShadow = true;
      mBack.castShadow = true;
      pivot.add(mFront, mBack);
      wingsGroup.add(pivot);

      const sideSign = i < 4 ? -1 : 1;
      const tier = i % 4; // 0..3 from inner crown wing to outer low sweep wing
      wings.push({
        pivot,
        fold: wFold,
        idx: i,
        sideSign,
        tier
      });
    }

    // =========================================================================
    // Seamless 10.0s Exhibition Loop Choreography (t in [0, 1))
    // =========================================================================
    window.renderFrame = async function renderFrame(i, totalFrames, t) {
      const loopA = t * Math.PI * 2;

      // Smooth inward convergence: open gallery amphitheater (t=0) -> framed monolith (t=0.50..0.78) -> open gallery (t=1.0)
      const convIn  = smootherstep(clamp01((t - 0.05) / 0.42));
      const convOut = smootherstep(clamp01((t - 0.80) / 0.18));
      const converge = clamp01(convIn * (1 - convOut));

      // 1) Stepped plinth breathes down smoothly as wings lock
      strata.forEach(({ mesh, spec }, idx) => {
        mesh.position.y = lerp(spec.y - 0.12 * (4 - idx) * 0.25, spec.y, converge);
      });

      // 2) Eight Monumental Radial Architectural Paper Wings (fan symmetrically, zero header overlap)
      wings.forEach((w) => {
        const phase = loopA + w.idx * 0.55;
        const openFan = w.sideSign * (0.46 + w.tier * 0.28);
        const closedFan = w.sideSign * (0.28 + w.tier * 0.21);
        const fan = lerp(openFan, closedFan, converge);

        const openR = 2.25 + w.tier * 0.42;
        const closedR = 1.18 + w.tier * 0.24;
        const r = lerp(openR, closedR, converge);

        const x = Math.sin(fan) * r;
        const z = -Math.cos(fan) * 0.65 - w.tier * 0.22 - lerp(0.0, 0.28, converge);
        const y = lerp(0.32 - w.tier * 0.14, 0.36 - w.tier * 0.12, converge) + Math.sin(phase) * 0.03;

        w.pivot.position.set(x, y, z);
        w.pivot.rotation.set(
          lerp(-0.14, -0.05, converge),
          -fan * 0.52 + Math.sin(phase) * 0.025,
          -fan * 0.62
        );
        w.pivot.scale.setScalar(lerp(0.92, 0.78, w.tier * 0.14) * lerp(1.0, 0.90, converge));

        w.fold.applyFold({
          fold: lerp(0.42, 0.24, converge),
          curl: lerp(0.68, 0.38, converge),
          diagFold: 0.28,
          wavePhase: phase,
          waveAmp: 0.42,
          aoStrength: 0.24
        });
      });

      // 3) Obsidian Monolith Elevation & Raking Edge-Light Sweep
      const monoLift = springDamped(clamp01((t - 0.22) / 0.26)) * (1 - band(t, 0.80, 0.94));
      monolithGroup.position.set(0, lerp(0.24, 0.72, monoLift), 0.05);
      monolithGroup.scale.setScalar(lerp(0.84, 0.94, monoLift));
      monolithGroup.rotation.set(
        lerp(-0.22, -0.04, monoLift),
        Math.sin(loopA) * 0.04,
        0
      );

      if (sealMat) {
        const lockupVis = band(t, 0.32, 0.48) * (1 - band(t, 0.80, 0.90));
        sealMat.uniforms.uOpacity.value = lockupVis;
        sealMat.uniforms.uRakeX.value = lerp(-1.35, 1.35, clamp01((t - 0.34) / 0.44));
      }

      // Warm raking gallery spotlight gently sweeps across monolith
      rakingLight.position.x = lerp(-2.4, 2.2, Math.sin(t * Math.PI));
      rakingLight.intensity = lerp(0.9, 1.45, monoLift);
      gallerySpot.intensity = lerp(32, 42, converge);

      // 4) Smooth Architectural Camera Dolly (identical at t=0 and t=1)
      const camPush = band(t, 0.08, 0.52) * (1 - band(t, 0.80, 0.98));
      const endBlend = band(t, 0.88, 1.0);
      const cx = Math.sin(loopA) * 0.24 * (1 - endBlend);
      const cy = lerp(2.45, 1.42, camPush);
      const cz = lerp(6.65, 5.90, camPush);

      camera.position.set(
        lerp(cx, 0, endBlend),
        lerp(cy, 2.45, endBlend),
        lerp(cz, 6.65, endBlend)
      );
      camera.lookAt(0, lerp(0.38, 0.42, camPush) * (1 - endBlend) + 0.38 * endBlend, 0);

      // 5) Closing Exhibition Serif Statement (0.54..0.85)
      const stIn  = easeOutExpo((t - 0.54) / 0.12);
      const stOut = band(t, 0.80, 0.87);
      const stVis = clamp01(stIn - stOut);

      stmtEl.style.opacity = stVis.toFixed(4);
      stmtEl.style.transform = `translate3d(0, ${(1 - stIn) * 14 - stOut * 8}px, 0)`;
      stmtRuleEl.style.width = `${Math.round(stVis * 140)}px`;

      hud.setCaption('15', 'THE FINAL FOLD', 0.72);

      renderer.render(scene, camera);
    };
  </script>
</body>
</html>
