<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OctaPDF — Verified Runtime & Build Paths</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FAF7F2;
      font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      color: #241E1B;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .topbar {
      position: absolute;
      top: 16px;
      left: 26px;
      right: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .brand-tag {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.90);
      border: 1px solid #E5DDD2;
      border-radius: 8px;
      padding: 7px 13px;
      box-shadow: 0 6px 18px rgba(36, 30, 27, 0.05);
    }
    .octa-dot {
      width: 10px;
      height: 10px;
      background: #E8501C;
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    }
    .brand-text {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #241E1B;
    }
    .sub-pill {
      background: rgba(36, 30, 27, 0.92);
      color: #FAF7F2;
      border-radius: 8px;
      padding: 7px 13px;
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 10.5px;
      letter-spacing: 0.04em;
    }
    .sub-pill span {
      color: #FF6B35;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand-tag">
      <div class="octa-dot"></div>
      <div class="brand-text">OctaPDF v0.46.2 &middot; Verified Acquisition &amp; Build Paths</div>
    </div>
    <div class="sub-pill"><span>0</span> prebuilt GitHub releases &middot; Build or deploy directly from <span>main</span></div>
  </div>

  <script type="module">
    import * as THREE from '/scripts/readme-studio/vendor/three.module.js';

    const W = window.innerWidth || 1200;
    const H = window.innerHeight || 440;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(W, H, false);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#FAF7F2');

    const camera = new THREE.PerspectiveCamera(26, W / H, 0.1, 60);
    camera.position.set(0, 3.15, 8.95);
    camera.lookAt(0, 1.18, 0);

    // Subtle procedural paper bump texture
    function makePaperGrain() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(256, 256);
      let s = 4242;
      const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.floor(124 + (rnd() - 0.5) * 28);
        img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 4);
      return tex;
    }

    const paperBump = makePaperGrain();

    // Lighting
    scene.add(new THREE.HemisphereLight('#FFFDF9', '#DCD0C1', 1.15));

    const sweepLight = new THREE.DirectionalLight('#FFF3E2', 2.2);
    sweepLight.position.set(2.5, 6.2, 5.2);
    sweepLight.castShadow = true;
    sweepLight.shadow.mapSize.set(2048, 2048);
    sweepLight.shadow.camera.near = 1;
    sweepLight.shadow.camera.far = 22;
    sweepLight.shadow.camera.left = -7.2;
    sweepLight.shadow.camera.right = 7.2;
    sweepLight.shadow.camera.top = 4.5;
    sweepLight.shadow.camera.bottom = -4.5;
    sweepLight.shadow.bias = -0.0004;
    sweepLight.shadow.radius = 3;
    scene.add(sweepLight);

    const fillLight = new THREE.DirectionalLight('#EFEAE2', 0.75);
    fillLight.position.set(-4, 3, 3);
    scene.add(fillLight);

    // Desk floor (smooth matte for crisp WebP inter-frame compression)
    const desk = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 14),
      new THREE.MeshStandardMaterial({
        color: '#F3ECE2',
        roughness: 0.96,
        metalness: 0.0,
      })
    );
    desk.rotation.x = -Math.PI / 2;
    desk.position.y = -0.02;
    desk.receiveShadow = true;
    scene.add(desk);

    // High-DPI cardstock label texture generator
    function makeCardTexture(spec) {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1120;
      const ctx = c.getContext('2d');

      // Warm ivory cardstock face
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, c.width, c.height);

      // Subtle top & bottom paper bands
      ctx.fillStyle = '#FAF7F2';
      ctx.fillRect(0, 0, c.width, 190);
      ctx.fillStyle = '#F5EFE6';
      ctx.fillRect(0, 930, c.width, 190);

      // Crisp hairline borders
      ctx.strokeStyle = '#E2D8CC';
      ctx.lineWidth = 4;
      ctx.strokeRect(18, 18, c.width - 36, c.height - 36);
      ctx.beginPath();
      ctx.moveTo(18, 190);
      ctx.lineTo(c.width - 18, 190);
      ctx.moveTo(18, 930);
      ctx.lineTo(c.width - 18, 930);
      ctx.stroke();

      // Pillar eyebrow
      ctx.fillStyle = '#E8501C';
      ctx.font = '700 32px "JetBrains Mono", "Cascadia Mono", Consolas, monospace';
      ctx.fillText(spec.eyebrow, 64, 92);

      // Pillar Title
      ctx.fillStyle = '#241E1B';
      ctx.font = '700 54px "Inter", "Segoe UI", sans-serif';
      ctx.fillText(spec.title, 64, 156);

      // Divider reserve space for 3D emblem relief in middle-top, bullets below
      let y = 510;
      spec.lines.forEach((line) => {
        ctx.fillStyle = '#E8501C';
        ctx.fillRect(64, y - 22, 16, 16);

        ctx.fillStyle = '#241E1B';
        ctx.font = '700 36px "Inter", "Segoe UI", sans-serif';
        ctx.fillText(line.label, 98, y);

        ctx.fillStyle = '#4A423C';
        ctx.font = '600 28px "JetBrains Mono", "Cascadia Mono", Consolas, monospace';
        ctx.fillText(line.detail, 98, y + 42);
        y += 108;
      });

      // Footer command block
      ctx.fillStyle = '#241E1B';
      ctx.fillRect(54, 964, c.width - 108, 114);
      ctx.fillStyle = '#FF6B35';
      ctx.font = '700 25px "JetBrains Mono", "Cascadia Mono", Consolas, monospace';
      ctx.fillText('$ ' + spec.cmd, 82, 1032);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    // Build custom 3D origami emblem per pillar
    function buildEmblem(kind) {
      const g = new THREE.Group();
      const whiteMat = new THREE.MeshStandardMaterial({ color: '#FAF7F2', roughness: 0.65, bumpMap: paperBump, bumpScale: 0.01 });
      const darkMat = new THREE.MeshStandardMaterial({ color: '#241E1B', roughness: 0.58, bumpMap: paperBump, bumpScale: 0.01 });
      const accentMat = new THREE.MeshStandardMaterial({ color: '#E8501C', roughness: 0.42, metalness: 0.06 });

      if (kind === 'docker') {
        // Layered hardened container cardstock blocks + Nginx reverse-proxy shield slab
        const positions = [
          [-0.28, 0.0, 0.06], [0.02, 0.0, 0.06], [0.32, 0.0, 0.06],
          [-0.14, 0.24, 0.08], [0.16, 0.24, 0.08],
        ];
        positions.forEach(([x, y, z], idx) => {
          const b = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.19, 0.16), idx === 4 ? accentMat : whiteMat);
          b.position.set(x, y, z);
          b.castShadow = true;
          g.add(b);
        });
        const base = new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.11, 0.20), darkMat);
        base.position.set(0.02, -0.18, 0.05);
        base.castShadow = true;
        g.add(base);
      } else if (kind === 'jar') {
        // Stepped Fat-JAR folio stack with central octagonal seal
        for (let i = 0; i < 3; i++) {
          const plate = new THREE.Mesh(
            new THREE.BoxGeometry(0.86 - i * 0.12, 0.12, 0.22 - i * 0.03),
            i === 1 ? darkMat : whiteMat
          );
          plate.position.set(0, -0.14 + i * 0.16, 0.04 + i * 0.03);
          plate.castShadow = true;
          g.add(plate);
        }
        const badge = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.08, 8), accentMat);
        badge.rotation.x = Math.PI / 2;
        badge.position.set(0.32, 0.18, 0.14);
        badge.castShadow = true;
        g.add(badge);
      } else {
        // Tri-fold native installer origami box (.exe / .dmg / .deb)
        const box = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.44, 0.20), whiteMat);
        box.position.set(0, -0.04, 0.06);
        box.castShadow = true;
        g.add(box);

        const leftFlap = new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.04, 0.20), accentMat);
        leftFlap.position.set(-0.14, 0.20, 0.06);
        leftFlap.rotation.z = 0.28;
        leftFlap.castShadow = true;
        g.add(leftFlap);

        const rightFlap = new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.04, 0.20), darkMat);
        rightFlap.position.set(0.14, 0.20, 0.06);
        rightFlap.rotation.z = -0.28;
        rightFlap.castShadow = true;
        g.add(rightFlap);
      }
      return g;
    }

    const specs = [
      {
        kind: 'docker',
        x: -3.28,
        eyebrow: '01 / CONTAINER STACK',
        title: 'Docker & Compose',
        lines: [
          { label: 'Alpine 3.24.4 + Nginx TLS', detail: 'Hardened multi-stage image' },
          { label: 'read_only & cap_drop: ALL', detail: 'Unprivileged user 1000:1000' },
          { label: 'internal: true Network', detail: 'Zero outbound egress' },
        ],
        cmd: 'docker compose -f docker-compose.prod.yml up',
      },
      {
        kind: 'jar',
        x: 0.0,
        eyebrow: '02 / JVM & DESKTOP UI',
        title: 'Java 21+ Fat JAR',
        lines: [
          { label: 'Gradle bootJar Artifact', detail: 'Stirling-PDF-0.46.2.jar' },
          { label: 'Local Desktop Mode', detail: 'STIRLING_PDF_DESKTOP_UI=true' },
          { label: 'Port 8080 Localhost', detail: 'Offline PDFBox + LibreOffice' },
        ],
        cmd: './gradlew bootJar && java -jar build/libs/*.jar',
      },
      {
        kind: 'native',
        x: 3.28,
        eyebrow: '03 / NATIVE BUILD',
        title: 'Source Installers',
        lines: [
          { label: 'jpackage 1.6.1 Targets', detail: 'Windows .exe · macOS .dmg · .deb' },
          { label: 'Launch4j 3.0.6 Wrapper', detail: 'Bundled Windows launcher' },
          { label: 'Built From main Branch', detail: 'Verified source packaging' },
        ],
        cmd: './gradlew jpackage',
      },
    ];

    const pillars = [];

    specs.forEach((spec, idx) => {
      const group = new THREE.Group();
      group.position.set(spec.x, 0, 0);

      // Stepped Paper Desk plinth under each pillar
      const plinth = new THREE.Mesh(
        new THREE.BoxGeometry(2.92, 0.14, 1.55),
        new THREE.MeshStandardMaterial({ color: '#EAE1D5', roughness: 0.85, bumpMap: paperBump, bumpScale: 0.01 })
      );
      plinth.position.y = 0.07;
      plinth.castShadow = true;
      plinth.receiveShadow = true;
      group.add(plinth);

      // Tilted architectural cardstock monolith
      const cardPivot = new THREE.Group();
      cardPivot.position.set(0, 0.14, 0);
      cardPivot.rotation.x = -0.34;
      group.add(cardPivot);

      const tex = makeCardTexture(spec);
      const sideMat = new THREE.MeshStandardMaterial({ color: '#EAE1D5', roughness: 0.8 });
      const frontMat = new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.62,
        metalness: 0.01,
        bumpMap: paperBump,
        bumpScale: 0.005,
      });

      const cardMesh = new THREE.Mesh(
        new THREE.BoxGeometry(2.58, 2.82, 0.09),
        [sideMat, sideMat, sideMat, sideMat, frontMat, sideMat]
      );
      cardMesh.position.y = 1.41;
      cardMesh.castShadow = true;
      cardMesh.receiveShadow = true;
      cardPivot.add(cardMesh);

      // Backing folded accent sleeve behind card
      const sleeve = new THREE.Mesh(
        new THREE.BoxGeometry(2.68, 2.70, 0.05),
        new THREE.MeshStandardMaterial({ color: '#241E1B', roughness: 0.7 })
      );
      sleeve.position.set(0.06, 1.35, -0.07);
      sleeve.castShadow = true;
      cardPivot.add(sleeve);

      // Hinged origami terracotta tab rising cleanly along top edge (never obscuring eyebrow)
      const flapPivot = new THREE.Group();
      flapPivot.position.set(0, 2.82, 0.02);
      cardPivot.add(flapPivot);

      const flap = new THREE.Mesh(
        new THREE.BoxGeometry(2.58, 0.16, 0.03),
        new THREE.MeshStandardMaterial({ color: '#E8501C', roughness: 0.45 })
      );
      flap.position.set(0, 0.08, 0.015);
      flap.castShadow = true;
      flapPivot.add(flap);

      // 3D geometric paper emblem mounted in upper card window
      const emblem = buildEmblem(spec.kind);
      emblem.position.set(0, 1.92, 0.12);
      cardPivot.add(emblem);

      scene.add(group);
      pillars.push({
        group,
        cardPivot,
        flapPivot,
        emblem,
        phase: (idx * Math.PI * 2) / 3,
      });
    });

    window.renderFrame = function renderFrame(i, totalFrames, t) {
      const theta = t * Math.PI * 2;

      // Directional key light sweeps cleanly across Pillar 1 -> Pillar 2 -> Pillar 3
      sweepLight.position.x = Math.sin(theta) * 5.2;
      sweepLight.position.z = 5.0 + Math.cos(theta) * 0.8;

      pillars.forEach((p) => {
        const wave = 0.5 + 0.5 * Math.sin(theta - p.phase);
        const smooth = wave * wave * (3 - 2 * wave);
        p.group.position.y = smooth * 0.14;
        p.cardPivot.rotation.x = -0.34 + smooth * 0.09;
        p.flapPivot.rotation.x = -0.15 - smooth * 0.35;
        p.emblem.position.z = 0.12 + smooth * 0.08;
        p.emblem.rotation.y = Math.sin(theta - p.phase) * 0.18;
      });

      renderer.render(scene, camera);
    };
  </script>
</body>
</html>
