<svg xmlns="http://www.w3.org/2000/svg"
    width="960" height="28" viewBox="0 0 960 28" role="presentation">
    <defs>
        <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#E8501C" stop-opacity="0"/>
            <stop offset="35%" stop-color="#E8501C" stop-opacity="0.3"/>
            <stop offset="50%" stop-color="#FF6B35" stop-opacity="1"/>
            <stop offset="65%" stop-color="#E8501C" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#E8501C" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="beamL" x1="100%" y1="0%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#FF6B35" stop-opacity="1"/>
            <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <style>
        @media (prefers-reduced-motion: no-preference) {
            .center-diamond {
                animation: diamondGlow 2.8s ease-in-out infinite;
                transform-origin: 480px 14px;
            }
            .pulse-line-l {
                stroke-dasharray: 60 300;
                animation: travelLeft 3.2s linear infinite;
            }
            .pulse-line-r {
                stroke-dasharray: 60 300;
                animation: travelRight 3.2s linear infinite;
            }
        }

        @keyframes diamondGlow {
            0%, 100% { transform: scale(1) rotate(45deg); opacity: 0.8; }
            50% { transform: scale(1.3) rotate(45deg); opacity: 1; }
        }

        @keyframes travelLeft {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 360; }
        }

        @keyframes travelRight {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -360; }
        }

        @media (prefers-color-scheme: dark) {
            .div-base-line { stroke: #2E2724 !important; }
        }
    </style>

    <!-- Base Hairline -->
    <line class="div-base-line" x1="40" y1="14" x2="920" y2="14" stroke="#E5DDD0" stroke-width="1.2"/>
    <line x1="120" y1="14" x2="840" y2="14" stroke="url(#divGrad)" stroke-width="1.4"/>

    <!-- Kinetic Traveling Pulse Left & Right -->
    <line class="pulse-line-l" x1="40" y1="14" x2="480" y2="14" stroke="#E8501C" stroke-width="1.8"/>
    <line class="pulse-line-r" x1="480" y1="14" x2="920" y2="14" stroke="#E8501C" stroke-width="1.8"/>

    <!-- Central Diamond Node -->
    <rect class="center-diamond" x="477" y="11" width="6" height="6" fill="#E8501C" transform="rotate(45 480 14)"/>
    <circle cx="480" cy="14" r="1.5" fill="#FFFFFF"/>
</svg>