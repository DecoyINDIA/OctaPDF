<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
    width="940" height="270" viewBox="0 0 940 270" role="img" aria-labelledby="pipeTitle pipeDesc">
    <title id="pipeTitle">OctaPDF Automated Document Pipeline</title>
    <desc id="pipeDesc">Demonstration of multi-step chained workflow: input packet, automated barcode splitting, OCR layer addition, pattern redaction, and stream compaction.</desc>

    <defs>
        <linearGradient id="pipeBg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FCFAF6"/>
            <stop offset="100%" stop-color="#F2ECE0"/>
        </linearGradient>

        <linearGradient id="progStream" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#E8501C"/>
            <stop offset="100%" stop-color="#10B981"/>
        </linearGradient>

        <filter id="pipeShadow" x="-10%" y="-10%" width="120%" height="125%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5A3A28" flood-opacity="0.08"/>
        </filter>

        <clipPath id="pipeClip"><rect width="940" height="270" rx="18"/></clipPath>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

        @media (prefers-reduced-motion: no-preference) {
            /* Progress line fill animation */
            .progress-wire-fill {
                stroke-dasharray: 680;
                stroke-dashoffset: 680;
                animation: fillPipeLine 7.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
            }

            /* Step Nodes Sequential Glow */
            .node-step-1 { animation: nodeStepAnim 7.5s infinite 0.4s; }
            .node-step-2 { animation: nodeStepAnim 7.5s infinite 1.8s; }
            .node-step-3 { animation: nodeStepAnim 7.5s infinite 3.4s; }
            .node-step-4 { animation: nodeStepAnim 7.5s infinite 4.8s; }
            .node-step-5 { animation: nodeStepAnim 7.5s infinite 6.0s; }

            /* Terminal cursor blink */
            .term-cursor {
                animation: termBlink 1s infinite;
            }
        }

        @keyframes fillPipeLine {
            0% { stroke-dashoffset: 680; }
            20% { stroke-dashoffset: 510; }
            45% { stroke-dashoffset: 340; }
            68% { stroke-dashoffset: 170; }
            90%, 100% { stroke-dashoffset: 0; }
        }

        @keyframes nodeStepAnim {
            0%, 10% { transform: scale(1); filter: none; }
            15%, 35% { transform: scale(1.08); filter: drop-shadow(0 4px 8px rgba(232,80,28,0.3)); }
            45%, 100% { transform: scale(1); filter: none; }
        }

        @keyframes termBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

        @media (prefers-color-scheme: dark) {
            .p-canvas { fill: #161412 !important; }
            .p-frame { stroke: #36312B !important; }
            .p-card { fill: #1F1C19 !important; stroke: #36312B !important; }
            .p-title { fill: #F5EFE6 !important; }
            .p-body { fill: #C8BFB5 !important; }
            .term-box { fill: #12100E !important; stroke: #2E2724 !important; }
            .wire-bg { stroke: #2E2724 !important; }
        }
    </style>

    <g clip-path="url(#pipeClip)">
        <rect class="p-canvas" width="940" height="270" fill="url(#pipeBg)"/>

        <!-- Header -->
        <g transform="translate(42, 22)">
            <text class="font-sans p-title" x="0" y="16" font-size="15" font-weight="800" fill="#241E1B">MULTI-STEP WORKFLOW AUTOMATION</text>
            <text class="font-mono p-body" x="380" y="16" font-size="10" font-weight="600" fill="#8C7E72">Chain arbitrary operations into single-pass batch routines via UI or CLI</text>
        </g>

        <!-- Pipeline Track Bar Base -->
        <g transform="translate(90, 85)">
            <line class="wire-bg" x1="0" y1="0" x2="760" y2="0" stroke="#DFD5C6" stroke-width="4" stroke-linecap="round"/>
            <line class="progress-wire-fill" x1="0" y1="0" x2="760" y2="0" stroke="url(#progStream)" stroke-width="4.5" stroke-linecap="round"/>
        </g>

        <!-- ======================================================== -->
        <!-- 5 PIPELINE STAGE NODES                                   -->
        <!-- ======================================================== -->
        
        <!-- Node 1: Input -->
        <g class="node-step-1" transform="translate(70, 48)">
            <rect class="p-card" width="100" height="74" rx="10" fill="#FFFFFF" stroke="#E2D8CA" stroke-width="1.2" filter="url(#pipeShadow)"/>
            <circle cx="50" cy="24" r="12" fill="#E8501C" opacity="0.14"/>
            <path d="M46 20 L54 20 M46 24 L52 24 M46 28 L54 28" stroke="#E8501C" stroke-width="1.4" stroke-linecap="round"/>
            <text class="font-sans p-title" x="50" y="48" font-size="9.5" font-weight="800" fill="#241E1B" text-anchor="middle">1. Intake</text>
            <text class="font-mono p-body" x="50" y="60" font-size="7.5" font-weight="600" fill="#8C7E72" text-anchor="middle">Scan_Stack.pdf</text>
        </g>

        <!-- Node 2: Barcode Split -->
        <g class="node-step-2" transform="translate(240, 48)">
            <rect class="p-card" width="110" height="74" rx="10" fill="#FFFFFF" stroke="#E2D8CA" stroke-width="1.2" filter="url(#pipeShadow)"/>
            <circle cx="55" cy="24" r="12" fill="#FE9114" opacity="0.14"/>
            <path d="M48 20 v8 M51 20 v8 M53 20 v8 M57 20 v8 M61 20 v8" stroke="#FE9114" stroke-width="1.3" stroke-linecap="round"/>
            <text class="font-sans p-title" x="55" y="48" font-size="9.5" font-weight="800" fill="#241E1B" text-anchor="middle">2. Barcode Split</text>
            <text class="font-mono p-body" x="55" y="60" font-size="7.5" font-weight="600" fill="#8C7E72" text-anchor="middle">Divider Detection</text>
        </g>

        <!-- Node 3: Tesseract OCR -->
        <g class="node-step-3" transform="translate(420, 48)">
            <rect class="p-card" width="110" height="74" rx="10" fill="#FFFFFF" stroke="#E2D8CA" stroke-width="1.2" filter="url(#pipeShadow)"/>
            <circle cx="55" cy="24" r="12" fill="#0284C7" opacity="0.14"/>
            <text class="font-mono" x="55" y="27" font-size="10" font-weight="800" fill="#0284C7" text-anchor="middle">OCR</text>
            <text class="font-sans p-title" x="55" y="48" font-size="9.5" font-weight="800" fill="#241E1B" text-anchor="middle">3. Tesseract OCR</text>
            <text class="font-mono p-body" x="55" y="60" font-size="7.5" font-weight="600" fill="#8C7E72" text-anchor="middle">Searchable Text</text>
        </g>

        <!-- Node 4: Pattern Redact -->
        <g class="node-step-4" transform="translate(600, 48)">
            <rect class="p-card" width="110" height="74" rx="10" fill="#FFFFFF" stroke="#E2D8CA" stroke-width="1.2" filter="url(#pipeShadow)"/>
            <circle cx="55" cy="24" r="12" fill="#E8501C" opacity="0.14"/>
            <rect x="46" y="20" width="18" height="8" rx="2" fill="#241E1B"/>
            <text class="font-sans p-title" x="55" y="48" font-size="9.5" font-weight="800" fill="#241E1B" text-anchor="middle">4. Scrub PII</text>
            <text class="font-mono p-body" x="55" y="60" font-size="7.5" font-weight="600" fill="#8C7E72" text-anchor="middle">Regex Patterns</text>
        </g>

        <!-- Node 5: Output -->
        <g class="node-step-5" transform="translate(770, 48)">
            <rect class="p-card" width="100" height="74" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.4" filter="url(#pipeShadow)"/>
            <circle cx="50" cy="24" r="12" fill="#10B981" opacity="0.14"/>
            <path d="M44 24 L48 28 L56 20" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <text class="font-sans p-title" x="50" y="48" font-size="9.5" font-weight="800" fill="#0D825A" text-anchor="middle">5. Compressed</text>
            <text class="font-mono" x="50" y="60" font-size="7.5" font-weight="700" fill="#10B981" text-anchor="middle">-85% Weight</text>
        </g>

        <!-- ======================================================== -->
        <!-- TERMINAL COMMAND BOX (Bottom)                            -->
        <!-- ======================================================== -->
        <g transform="translate(42, 145)">
            <rect class="term-box" width="856" height="100" rx="10" fill="#1A1715" stroke="#2E2824" stroke-width="1.2"/>
            
            <!-- Window dots -->
            <circle cx="20" cy="18" r="4" fill="#EF4444"/>
            <circle cx="34" cy="18" r="4" fill="#F59E0B"/>
            <circle cx="48" cy="18" r="4" fill="#10B981"/>
            <text class="font-mono" x="70" y="22" font-size="9" font-weight="600" fill="#8C7E72">octapdf-pipeline-executor</text>

            <!-- Command Line -->
            <text class="font-mono" x="20" y="52" font-size="10.5" fill="#FE9114">$ octapdf pipeline run --config workflow.yml ./input/scans.pdf</text>
            <rect class="term-cursor" x="510" y="42" width="7" height="12" fill="#FE9114"/>

            <!-- Execution Logs -->
            <text class="font-mono" x="20" y="72" font-size="9.5" fill="#10B981">✓ [STEP 1/4] Split by barcode -> 2 separate documents extracted</text>
            <text class="font-mono" x="20" y="88" font-size="9.5" fill="#C5BCB2">✓ [STEP 2/4] OCR layer generated · [STEP 3/4] 4 PII records redacted · [STEP 4/4] 18.2 MB → 2.4 MB (0.8s)</text>
        </g>
    </g>

    <!-- Outer Frame -->
    <rect class="p-frame" x="0.5" y="0.5" width="939" height="269" rx="17.5" fill="none" stroke="#E2D8CA" stroke-width="1.2"/>
</svg>