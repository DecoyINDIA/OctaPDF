<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
    width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="ctaTitle ctaDesc">
    <title id="ctaTitle">Launch OctaPDF Local Workspace</title>
    <desc id="ctaDesc">Closing launch console: animated docker compose startup terminal and call to action to launch your private document workspace.</desc>

    <defs>
        <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCFAF6"/>
            <stop offset="100%" stop-color="#F2ECE0"/>
        </linearGradient>

        <linearGradient id="btnGlow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#E8501C"/>
            <stop offset="100%" stop-color="#FF6B35"/>
        </linearGradient>

        <filter id="ctaShadow" x="-10%" y="-10%" width="120%" height="125%">
            <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#5A3A28" flood-opacity="0.1"/>
        </filter>

        <clipPath id="ctaClip"><rect width="960" height="260" rx="18"/></clipPath>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

        @media (prefers-reduced-motion: no-preference) {
            /* Terminal Text Line Typing Sequences */
            .cmd-type-line {
                stroke-dasharray: 450;
                stroke-dashoffset: 450;
                animation: typeCommand 6.5s steps(40) infinite;
            }
            .term-resp-1 {
                animation: respAppear 6.5s infinite 2.2s;
            }
            .term-resp-2 {
                animation: respAppear 6.5s infinite 3.4s;
            }
            .term-resp-3 {
                animation: respAppear 6.5s infinite 4.4s;
            }

            /* Primary Launch CTA Button Pulse */
            .cta-btn-pulse {
                animation: btnAura 3.0s ease-in-out infinite;
                transform-origin: 730px 105px;
            }
        }

        @keyframes respAppear {
            0%, 5% { opacity: 0; transform: translateY(4px); }
            15%, 85% { opacity: 1; transform: translateY(0px); }
            95%, 100% { opacity: 0; }
        }

        @keyframes btnAura {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 10px rgba(232,80,28,0.25)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 8px 18px rgba(232,80,28,0.4)); }
        }

        @media (prefers-color-scheme: dark) {
            .c-bg { fill: #161412 !important; }
            .c-frame { stroke: #36312B !important; }
            .term-shell { fill: #12100E !important; stroke: #2E2724 !important; }
            .c-card { fill: #1F1C19 !important; stroke: #36312B !important; }
            .c-title { fill: #F5EFE6 !important; }
            .c-body { fill: #C8BFB5 !important; }
        }
    </style>

    <g clip-path="url(#ctaClip)">
        <rect class="c-bg" width="960" height="260" fill="url(#ctaBg)"/>

        <!-- ======================================================== -->
        <!-- LEFT: TERMINAL LAUNCH CONSOLE                            -->
        <!-- ======================================================== -->
        <g transform="translate(42, 32)">
            <rect class="term-shell" width="480" height="196" rx="12" fill="#1A1715" stroke="#2E2824" stroke-width="1.2" filter="url(#ctaShadow)"/>
            
            <!-- Window controls -->
            <circle cx="20" cy="18" r="4" fill="#EF4444"/>
            <circle cx="34" cy="18" r="4" fill="#F59E0B"/>
            <circle cx="48" cy="18" r="4" fill="#10B981"/>
            <text class="font-mono" x="70" y="22" font-size="9" font-weight="600" fill="#8C7E72">local-deployment · bash</text>

            <!-- Command Line 1 -->
            <text class="font-mono" x="20" y="56" font-size="11" fill="#FE9114">$ docker compose -f docker-compose.prod.yml up -d</text>

            <!-- Server Response Logs -->
            <g class="term-resp-1">
                <text class="font-mono" x="20" y="86" font-size="10" fill="#10B981">✔ Network octapdf-internal Created [internal: true]</text>
            </g>
            <g class="term-resp-2">
                <text class="font-mono" x="20" y="112" font-size="10" fill="#10B981">✔ Container octapdf-app Started [Read-Only Root FS]</text>
            </g>
            <g class="term-resp-3">
                <text class="font-mono" x="20" y="138" font-size="10" fill="#00D2FF">✔ Listening at http://localhost:8080 (Zero Egress)</text>
                <text class="font-mono" x="20" y="164" font-size="9.5" fill="#C5BCB2">Ready for document intake in 1.4s.</text>
            </g>
        </g>

        <!-- ======================================================== -->
        <!-- RIGHT: CALL TO ACTION LAUNCH DECK                        -->
        <!-- ======================================================== -->
        <g transform="translate(560, 32)">
            <rect class="c-card" width="358" height="196" rx="12" fill="#FFFFFF" stroke="#E2D8CA" stroke-width="1.2" filter="url(#ctaShadow)"/>
            
            <text class="font-sans c-title" x="28" y="38" font-size="18" font-weight="800" fill="#241E1B">Ready to work?</text>
            <text class="font-sans c-body" x="28" y="58" font-size="11.5" font-weight="500" fill="#6B5F55">Run OctaPDF privately on your local machine or server.</text>

            <!-- Primary Glowing Button -->
            <g class="cta-btn-pulse" transform="translate(28, 80)">
                <rect width="302" height="46" rx="23" fill="url(#btnGlow)"/>
                <text class="font-sans" x="151" y="28" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">LAUNCH WORKSPACE ➔</text>
            </g>

            <!-- Security Badges Row -->
            <g transform="translate(28, 150)">
                <rect x="0" y="0" width="94" height="22" rx="6" fill="#FAF5ED" stroke="#E2D8CA" stroke-width="1"/>
                <text class="font-sans" x="8" y="14.5" font-size="8.5" font-weight="700" fill="#5A4E45">✓ 100% Local</text>

                <rect x="102" y="0" width="100" height="22" rx="6" fill="#FAF5ED" stroke="#E2D8CA" stroke-width="1"/>
                <text class="font-sans" x="110" y="14.5" font-size="8.5" font-weight="700" fill="#5A4E45">✓ Zero Egress</text>

                <rect x="210" y="0" width="92" height="22" rx="6" fill="#FAF5ED" stroke="#E2D8CA" stroke-width="1"/>
                <text class="font-sans" x="218" y="14.5" font-size="8.5" font-weight="700" fill="#5A4E45">✓ MIT License</text>
            </g>
        </g>
    </g>

    <!-- Outer Frame -->
    <rect class="c-frame" x="0.5" y="0.5" width="959" height="259" rx="17.5" fill="none" stroke="#E2D8CA" stroke-width="1.2"/>
</svg>