<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
    width="920" height="240" viewBox="0 0 920 240" role="img" aria-labelledby="palTitle palDesc">
    <title id="palTitle">OctaPDF ⌘K Command Palette</title>
    <desc id="palDesc">Keyboard-driven navigation HUD: quick search across 50+ specialized PDF operations with instant live filtering.</desc>

    <defs>
        <filter id="palShadow" x="-10%" y="-10%" width="120%" height="125%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#241E1B" flood-opacity="0.18"/>
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#241E1B" flood-opacity="0.1"/>
        </filter>
        <clipPath id="palClip"><rect width="920" height="240" rx="18"/></clipPath>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

        @media (prefers-reduced-motion: no-preference) {
            /* Selection Focus Bar Motion */
            .active-option-pill {
                animation: selectionPulse 3.6s ease-in-out infinite;
            }
            /* Cursor blink */
            .pal-cursor {
                animation: palCursorBlink 0.9s infinite;
            }
        }

        @keyframes selectionPulse {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(38px); }
        }

        @keyframes palCursorBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

        @media (prefers-color-scheme: dark) {
            .pal-desk { fill: #161412 !important; }
            .pal-shell { fill: #1F1C19 !important; stroke: #36312B !important; }
            .pal-input-bg { fill: #282420 !important; stroke: #3D352E !important; }
            .pal-txt-title { fill: #F5EFE6 !important; }
            .pal-txt-sub { fill: #C8BFB5 !important; }
        }
    </style>

    <g clip-path="url(#palClip)">
        <!-- Desk Backdrop -->
        <rect class="pal-desk" width="920" height="240" fill="#FAF6F0"/>

        <!-- Spotlight Command Palette Modal -->
        <g transform="translate(140, 20)">
            <rect class="pal-shell" width="640" height="200" rx="14" fill="#FFFFFF" stroke="#E2D8CA" stroke-width="1.4" filter="url(#palShadow)"/>

            <!-- Search Input Box -->
            <g transform="translate(18, 16)">
                <rect class="pal-input-bg" width="604" height="42" rx="8" fill="#FAF6F0" stroke="#DFD5C6" stroke-width="1"/>
                <!-- Search Icon -->
                <circle cx="22" cy="21" r="5" fill="none" stroke="#E8501C" stroke-width="1.8"/>
                <line x1="26" y1="25" x2="31" y2="30" stroke="#E8501C" stroke-width="1.8" stroke-linecap="round"/>
                
                <text class="font-mono pal-txt-title" x="42" y="26" font-size="13" font-weight="700" fill="#241E1B">> compress</text>
                <rect class="pal-cursor" x="135" y="14" width="7" height="15" fill="#E8501C"/>

                <!-- ⌘K Badge -->
                <rect x="556" y="11" width="36" height="20" rx="4" fill="#E5DDD0"/>
                <text class="font-mono" x="562" y="24" font-size="9" font-weight="800" fill="#5A4E45">ESC</text>
            </g>

            <!-- Filtered Results List -->
            <g transform="translate(18, 68)">
                <!-- Option 1: Compress PDF -->
                <g transform="translate(0, 0)">
                    <rect width="604" height="34" rx="6" fill="#FFF5EE" stroke="#E8501C" stroke-width="1"/>
                    <text class="font-sans" x="14" y="21" font-size="12" font-weight="800" fill="#E8501C">⚡ Compress PDF</text>
                    <text class="font-mono pal-txt-sub" x="140" y="21" font-size="10" font-weight="500" fill="#8C7E72">— Lossless qpdf stream compaction &amp; linearization</text>
                    <text class="font-mono" x="550" y="21" font-size="9.5" font-weight="700" fill="#E8501C">↵ ENTER</text>
                </g>

                <!-- Option 2: Searchable OCR -->
                <g transform="translate(0, 38)">
                    <rect width="604" height="34" rx="6" fill="#FAF6F0" opacity="0.6"/>
                    <text class="font-sans pal-txt-title" x="14" y="21" font-size="12" font-weight="700" fill="#38302A">📄 OCR &amp; Make Searchable</text>
                    <text class="font-mono pal-txt-sub" x="190" y="21" font-size="10" font-weight="500" fill="#8C7E72">— Tesseract neural text extraction (100+ langs)</text>
                </g>

                <!-- Option 3: Auto-Split -->
                <g transform="translate(0, 76)">
                    <rect width="604" height="34" rx="6" fill="#FAF6F0" opacity="0.6"/>
                    <text class="font-sans pal-txt-title" x="14" y="21" font-size="12" font-weight="700" fill="#38302A">✂️ Auto-Split by Dividers</text>
                    <text class="font-mono pal-txt-sub" x="180" y="21" font-size="10" font-weight="500" fill="#8C7E72">— Detect printed barcodes or blank separation sheets</text>
                </g>
            </g>
        </g>
    </g>

    <rect x="0.5" y="0.5" width="919" height="239" rx="17.5" fill="none" stroke="#E2D8CA" stroke-width="1.2"/>
</svg>