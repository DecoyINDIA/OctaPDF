<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
    width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="showcaseTitle showcaseDesc">
    <title id="showcaseTitle">OctaPDF Four Core Document Jobs</title>
    <desc id="showcaseDesc">Interactive animated showcase of OctaPDF's four workflows: Assemble and Clean, Sign and Annotate, Redact and Secure, and Compress and OCR.</desc>

    <defs>
        <linearGradient id="gridPaper" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCFAF6"/>
            <stop offset="100%" stop-color="#F2ECE0"/>
        </linearGradient>

        <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00D2FF" stop-opacity="0"/>
            <stop offset="50%" stop-color="#00D2FF" stop-opacity="1"/>
            <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
        </linearGradient>

        <filter id="panelDrop" x="-10%" y="-10%" width="120%" height="125%">
            <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#5A3A28" flood-opacity="0.08"/>
        </filter>

        <clipPath id="showcaseClip"><rect width="960" height="460" rx="20"/></clipPath>
        <clipPath id="ocrBoxClip"><rect x="0" y="0" width="180" height="85" rx="6"/></clipPath>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

        @media (prefers-reduced-motion: no-preference) {
            /* Job 1: Page Drag Motion */
            .dragged-thumbnail {
                animation: dragReorder 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            }
            .rotated-thumbnail {
                animation: rotatePage 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
                transform-origin: 242px 145px;
            }

            /* Job 2: Signature Drawing and Seal */
            .sign-pen-stroke {
                stroke-dasharray: 180;
                stroke-dashoffset: 180;
                animation: drawSignScript 4.6s ease-in-out infinite;
            }
            .notary-seal-pop {
                animation: stampLock 4.6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
                transform-origin: 360px 145px;
            }

            /* Job 3: Redaction and Lock */
            .redaction-block-1 {
                animation: redactWipeA 3.8s ease-in-out infinite;
            }
            .redaction-block-2 {
                animation: redactWipeA 3.8s ease-in-out infinite 0.4s;
            }
            .shield-lock-icon {
                animation: lockPulse 3.8s ease-in-out infinite;
                transform-origin: 360px 360px;
            }

            /* Job 4: OCR Scanner and Compaction Gauge */
            .ocr-laser-line {
                animation: ocrSweep 3.2s ease-in-out infinite;
            }
            .ocr-revealed-text {
                animation: textSharpFade 3.2s ease-in-out infinite;
            }
            .gauge-needle {
                animation: dialSpin 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
                transform-origin: 840px 360px;
            }
        }

        @keyframes dragReorder {
            0%, 15% { transform: translate(0, 0); }
            35%, 65% { transform: translate(-154px, -14px) scale(1.05); filter: drop-shadow(0 10px 12px rgba(90,58,40,0.18)); }
            85%, 100% { transform: translate(0, 0); }
        }

        @keyframes rotatePage {
            0%, 25% { transform: rotate(0deg); }
            45%, 75% { transform: rotate(90deg); }
            90%, 100% { transform: rotate(0deg); }
        }

        @keyframes drawSignScript {
            0%, 15% { stroke-dashoffset: 180; opacity: 0; }
            25% { opacity: 1; }
            65%, 85% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes stampLock {
            0%, 55% { transform: scale(0); opacity: 0; }
            62% { transform: scale(1.2); opacity: 1; }
            68%, 85% { transform: scale(1); opacity: 1; }
            95%, 100% { transform: scale(0.8); opacity: 0; }
        }

        @keyframes redactWipeA {
            0%, 20% { width: 0px; }
            40%, 80% { width: 92px; }
            95%, 100% { width: 0px; }
        }

        @keyframes lockPulse {
            0%, 40% { transform: scale(0.9); opacity: 0.6; }
            50%, 80% { transform: scale(1.1); opacity: 1; }
            95%, 100% { transform: scale(0.9); opacity: 0.6; }
        }

        @keyframes ocrSweep {
            0%, 100% { transform: translateY(10px); opacity: 0.2; }
            15% { opacity: 1; }
            50% { transform: translateY(72px); opacity: 1; }
            85% { opacity: 1; }
            92% { opacity: 0.2; }
        }

        @keyframes textSharpFade {
            0%, 20% { opacity: 0.2; }
            45%, 85% { opacity: 1; }
            95%, 100% { opacity: 0.2; }
        }

        @keyframes dialSpin {
            0%, 20% { transform: rotate(-70deg); }
            50%, 80% { transform: rotate(65deg); }
            95%, 100% { transform: rotate(-70deg); }
        }

        @media (prefers-color-scheme: dark) {
            .grid-bg { fill: #161412 !important; }
            .grid-border { stroke: #36312B !important; }
            .quad-card { fill: #1F1C19 !important; stroke: #36312B !important; }
            .quad-title { fill: #F5EFE6 !important; }
            .quad-body { fill: #C8BFB5 !important; }
            .sub-plate { fill: #282420 !important; stroke: #3D352E !important; }
            .sub-line { fill: #3D352E !important; }
        }
    </style>

    <g clip-path="url(#showcaseClip)">
        <!-- Grid Canvas -->
        <rect class="grid-bg" width="960" height="460" fill="url(#gridPaper)"/>

        <!-- ======================================================== -->
        <!-- QUADRANT 1: ASSEMBLE & CLEAN (Top Left)                 -->
        <!-- ======================================================== -->
        <g transform="translate(36, 32)">
            <rect class="quad-card" width="428" height="186" rx="14" fill="#FFFFFF" stroke="#E2D8CA" stroke-width="1.2" filter="url(#panelDrop)"/>
            
            <text class="font-sans quad-title" x="22" y="32" font-size="15" font-weight="800" fill="#241E1B">1. Assemble &amp; Clean</text>
            <text class="font-sans quad-body" x="22" y="50" font-size="11" font-weight="500" fill="#8C7E72">Visual page drag-reorder, 90° rotation, blank ejection &amp; packet merges.</text>

            <!-- Mini Workspace Slot Deck -->
            <g transform="translate(22, 68)">
                <!-- Slot 1 (Target for dropped page) -->
                <rect class="sub-plate" x="0" y="0" width="70" height="92" rx="6" fill="#FAF6F0" stroke="#DFD5C6" stroke-width="1"/>
                <rect class="sub-line" x="8" y="10" width="40" height="4" rx="2" fill="#E8DFD3"/>
                <rect class="sub-line" x="8" y="18" width="54" height="3" rx="1.5" fill="#EFE8DE"/>
                <rect class="sub-line" x="8" y="25" width="46" height="3" rx="1.5" fill="#EFE8DE"/>
                <text class="font-mono" x="8" y="82" font-size="8" font-weight="700" fill="#8C7E72">P1</text>

                <!-- Slot 2 (Rotated Page) -->
                <g class="rotated-thumbnail">
                    <rect class="sub-plate" x="88" y="0" width="70" height="92" rx="6" fill="#FAF6F0" stroke="#E8501C" stroke-width="1.2"/>
                    <rect class="sub-line" x="96" y="10" width="50" height="4" rx="2" fill="#E8DFD3"/>
                    <path d="M120 40 A 12 12 0 0 1 136 50" fill="none" stroke="#E8501C" stroke-width="1.6" stroke-linecap="round"/>
                    <path d="M136 46 L136 52 L130 52" fill="none" stroke="#E8501C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <text class="font-mono" x="96" y="82" font-size="8" font-weight="700" fill="#E8501C">P2 [90°]</text>
                </g>

                <!-- Slot 3: The Dragged Page -->
                <g class="dragged-thumbnail">
                    <rect class="sub-plate" x="176" y="0" width="70" height="92" rx="6" fill="#FFFFFF" stroke="#E8501C" stroke-width="1.4" filter="url(#panelDrop)"/>
                    <rect x="184" y="10" width="54" height="4" rx="2" fill="#E8501C" opacity="0.3"/>
                    <rect class="sub-line" x="184" y="18" width="48" height="3" rx="1.5" fill="#EFE8DE"/>
                    <rect class="sub-line" x="184" y="25" width="52" height="3" rx="1.5" fill="#EFE8DE"/>
                    <rect x="184" y="74" width="22" height="12" rx="4" fill="#10B981" opacity="0.2"/>
                    <text class="font-mono" x="188" y="83" font-size="7.5" font-weight="700" fill="#10B981">MOVE</text>
                </g>

                <!-- Info pill -->
                <g transform="translate(262, 24)">
                    <rect x="0" y="0" width="120" height="22" rx="11" fill="#FAF5ED" stroke="#E2D8CA" stroke-width="1"/>
                    <text class="font-sans" x="10" y="14.5" font-size="9" font-weight="700" fill="#5A4E45">✓ Barcode Divider Split</text>
                    <rect x="0" y="30" width="120" height="22" rx="11" fill="#FAF5ED" stroke="#E2D8CA" stroke-width="1"/>
                    <text class="font-sans" x="10" y="44.5" font-size="9" font-weight="700" fill="#5A4E45">✓ Blank Scan Removal</text>
                </g>
            </g>
        </g>

        <!-- ======================================================== -->
        <!-- QUADRANT 2: SIGN & ANNOTATE (Top Right)                 -->
        <!-- ======================================================== -->
        <g transform="translate(496, 32)">
            <rect class="quad-card" width="428" height="186" rx="14" fill="#FFFFFF" stroke="#E2D8CA" stroke-width="1.2" filter="url(#panelDrop)"/>
            
            <text class="font-sans quad-title" x="22" y="32" font-size="15" font-weight="800" fill="#241E1B">2. Sign &amp; Annotate</text>
            <text class="font-sans quad-body" x="22" y="50" font-size="11" font-weight="500" fill="#8C7E72">Pressure-curved vector signatures, date stamps, and flattening seals.</text>

            <g transform="translate(22, 68)">
                <!-- Document Sheet Base -->
                <rect class="sub-plate" x="0" y="0" width="270" height="92" rx="8" fill="#FAF6F0" stroke="#DFD5C6" stroke-width="1"/>
                <rect class="sub-line" x="14" y="14" width="180" height="4" rx="2" fill="#E8DFD3"/>
                <rect class="sub-line" x="14" y="24" width="140" height="4" rx="2" fill="#EFE8DE"/>
                <line x1="14" y1="64" x2="190" y2="64" stroke="#D8CCBC" stroke-width="1" stroke-dasharray="3 3"/>
                <text class="font-sans" x="14" y="76" font-size="7.5" font-weight="700" fill="#A89B8F">AUTHORIZED SIGNATURE</text>

                <!-- Animated Pressure Signature -->
                <path class="sign-pen-stroke" d="M18 58 C 30 40, 40 68, 54 48 C 64 36, 70 60, 84 50 C 94 42, 106 58, 120 48 C 132 40, 148 54, 168 46"
                      fill="none" stroke="#E8501C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

                <!-- Notary Stamp Seal Pop -->
                <g class="notary-seal-pop" transform="translate(200, 20)">
                    <circle cx="28" cy="28" r="24" fill="#FFFFFF" stroke="#FE9114" stroke-width="2"/>
                    <circle cx="28" cy="28" r="20" fill="none" stroke="#E8501C" stroke-width="1" stroke-dasharray="2 2"/>
                    <text class="font-mono" x="14" y="26" font-size="7" font-weight="800" fill="#E8501C">VERIFIED</text>
                    <text class="font-mono" x="13" y="36" font-size="6.5" font-weight="700" fill="#8C5C42">NOTARY</text>
                </g>

                <!-- Feature tags -->
                <g transform="translate(284, 14)">
                    <rect x="0" y="0" width="98" height="20" rx="10" fill="#10B981" opacity="0.12"/>
                    <text class="font-sans" x="10" y="13.5" font-size="8.5" font-weight="700" fill="#0D825A">✓ SVG / Canvas</text>
                    <rect x="0" y="26" width="98" height="20" rx="10" fill="#10B981" opacity="0.12"/>
                    <text class="font-sans" x="10" y="39.5" font-size="8.5" font-weight="700" fill="#0D825A">✓ Form Flatten</text>
                </g>
            </g>
        </g>

        <!-- ======================================================== -->
        <!-- QUADRANT 3: REDACT & SECURE (Bottom Left)               -->
        <!-- ======================================================== -->
        <g transform="translate(36, 242)">
            <rect class="quad-card" width="428" height="186" rx="14" fill="#FFFFFF" stroke="#E2D8CA" stroke-width="1.2" filter="url(#panelDrop)"/>
            
            <text class="font-sans quad-title" x="22" y="32" font-size="15" font-weight="800" fill="#241E1B">3. Redact &amp; Secure</text>
            <text class="font-sans quad-body" x="22" y="50" font-size="11" font-weight="500" fill="#8C7E72">True stream sanitization, AES password locking, and metadata wiping.</text>

            <g transform="translate(22, 68)">
                <rect class="sub-plate" x="0" y="0" width="270" height="92" rx="8" fill="#FAF6F0" stroke="#DFD5C6" stroke-width="1"/>
                <text class="font-mono" x="14" y="20" font-size="9" font-weight="700" fill="#6B5F55">ACCOUNT_NO: 4920-8192-4820</text>
                <!-- Redaction Box 1 -->
                <rect class="redaction-block-1" x="90" y="10" width="0" height="13" rx="2" fill="#241E1B"/>

                <text class="font-mono" x="14" y="42" font-size="9" font-weight="700" fill="#6B5F55">TAX_IDENT: 938-19-4820</text>
                <!-- Redaction Box 2 -->
                <rect class="redaction-block-2" x="78" y="32" width="0" height="13" rx="2" fill="#241E1B"/>

                <rect class="sub-line" x="14" y="60" width="160" height="4" rx="2" fill="#E8DFD3"/>

                <!-- Shield Lock Unit -->
                <g class="shield-lock-icon" transform="translate(204, 16)">
                    <rect width="52" height="60" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.4" filter="url(#panelDrop)"/>
                    <circle cx="26" cy="24" r="8" fill="none" stroke="#10B981" stroke-width="1.6"/>
                    <rect x="18" y="28" width="16" height="14" rx="3" fill="#10B981"/>
                    <circle cx="26" cy="35" r="2" fill="#FFFFFF"/>
                    <text class="font-mono" x="11" y="52" font-size="6.5" font-weight="800" fill="#10B981">AES-256</text>
                </g>

                <g transform="translate(284, 14)">
                    <rect x="0" y="0" width="98" height="20" rx="10" fill="#E8501C" opacity="0.12"/>
                    <text class="font-sans" x="10" y="13.5" font-size="8.5" font-weight="700" fill="#E8501C">✓ Zero Remnants</text>
                    <rect x="0" y="26" width="98" height="20" rx="10" fill="#E8501C" opacity="0.12"/>
                    <text class="font-sans" x="10" y="39.5" font-size="8.5" font-weight="700" fill="#E8501C">✓ PDF/A Archival</text>
                </g>
            </g>
        </g>

        <!-- ======================================================== -->
        <!-- QUADRANT 4: COMPRESS & OCR (Bottom Right)               -->
        <!-- ======================================================== -->
        <g transform="translate(496, 242)">
            <rect class="quad-card" width="428" height="186" rx="14" fill="#FFFFFF" stroke="#E2D8CA" stroke-width="1.2" filter="url(#panelDrop)"/>
            
            <text class="font-sans quad-title" x="22" y="32" font-size="15" font-weight="800" fill="#241E1B">4. Compress &amp; OCR</text>
            <text class="font-sans quad-body" x="22" y="50" font-size="11" font-weight="500" fill="#8C7E72">QPDF stream compaction (-85%) and Tesseract multilingual OCR layers.</text>

            <g transform="translate(22, 68)">
                <!-- Left OCR Scanner Pod -->
                <g clip-path="url(#ocrBoxClip)">
                    <rect class="sub-plate" width="180" height="85" rx="6" fill="#FAF6F0" stroke="#DFD5C6" stroke-width="1"/>
                    <g class="ocr-revealed-text">
                        <text class="font-mono" x="12" y="22" font-size="8" font-weight="700" fill="#241E1B">SECTION 4.1 CONDITIONAL</text>
                        <text class="font-mono" x="12" y="38" font-size="8" font-weight="700" fill="#241E1B">TEXT RECOGNITION: PASS</text>
                        <text class="font-mono" x="12" y="54" font-size="8" font-weight="700" fill="#241E1B">SEARCHABLE LAYER: TRUE</text>
                    </g>
                    <!-- Laser Beam -->
                    <g class="ocr-laser-line">
                        <line x1="0" y1="0" x2="180" y2="0" stroke="url(#laserBeam)" stroke-width="2.5"/>
                    </g>
                </g>

                <!-- Right Compression Gauge Pod -->
                <g transform="translate(200, 4)">
                    <rect class="sub-plate" width="180" height="78" rx="8" fill="#FFFFFF" stroke="#DFD5C6" stroke-width="1" filter="url(#panelDrop)"/>
                    <!-- Compression Dial -->
                    <circle cx="44" cy="40" r="26" fill="none" stroke="#EFE8DE" stroke-width="6"/>
                    <circle cx="44" cy="40" r="26" fill="none" stroke="#E8501C" stroke-width="6" stroke-dasharray="90 180"/>
                    <g class="gauge-needle" transform="translate(44, 40)">
                        <line x1="0" y1="0" x2="0" y2="-20" stroke="#241E1B" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="0" cy="0" r="3" fill="#E8501C"/>
                    </g>
                    <!-- Stat Labels -->
                    <text class="font-sans" x="80" y="30" font-size="16" font-weight="800" fill="#10B981">-87%</text>
                    <text class="font-mono" x="80" y="46" font-size="9" font-weight="600" fill="#5A4E45">24.5 MB → 3.2 MB</text>
                    <text class="font-mono" x="80" y="60" font-size="8" font-weight="500" fill="#8C7E72">qpdf linearize</text>
                </g>
            </g>
        </g>
    </g>

    <!-- Outer Frame -->
    <rect class="grid-border" x="0.5" y="0.5" width="959" height="459" rx="19.5" fill="none" stroke="#E2D8CA" stroke-width="1.2"/>
</svg>