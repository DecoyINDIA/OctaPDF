services:
  octapdf:
    image: ${OCTAPDF_IMAGE:-ghcr.io/decoyindia/octapdf:latest}
    read_only: true # SEC-11: Read-only root filesystem
    security_opt:
      - no-new-privileges:true # SEC-11: Prevent privilege escalation
    cap_drop:
      - ALL # SEC-11: Drop all Linux capabilities
    user: "1000:1000" # SEC-11: Run as unprivileged user
    tmpfs:
      - /tmp:size=1G,mode=1777 # SEC-09 & SEC-11: Capped in-memory tempfs
      - /home/stirlingpdfuser:size=512M,uid=1000,gid=1000,mode=0700
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - octapdf-configs:/configs:rw
      - octapdf-logs:/logs:rw
      - octapdf-pipeline:/pipeline:rw
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SECURITY_ENABLELOGIN=false
      - SYSTEM_DEFAULTLOCALE=en-GB
      - UI_APPNAME=OctaPDF
      - METRICS_ENABLED=false
      - TESSDATA_PREFIX=/usr/share/tessdata
      - SECURITY_RATELIMIT_TRUSTEDPROXIES=172.16.0.0/12
      - ENDPOINTS_TOREMOVE=pipeline,html-to-pdf,markdown-to-pdf,file-to-pdf,redact,auto-redact
    networks:
      - octapdf-internal # SEC-02: Isolated network with zero egress
    restart: unless-stopped

  reverse-proxy:
    image: nginx:alpine
    container_name: octapdf-proxy
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - frontend
      - octapdf-internal
    depends_on:
      octapdf:
        condition: service_healthy
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  octapdf-internal:
    driver: bridge
    internal: true # SEC-02: Denies all external outbound internet egress

volumes:
  octapdf-configs:
  octapdf-logs:
  octapdf-pipeline:
